# =============================================================================
# ✅ Today Action Plan - one page that says what to do today, and why
# -----------------------------------------------------------------------------
# VERSION 1.3.0 (2026-11-13)
#   1.3.0: THE BROKER (today_action_plan 1.3.0). The page reads the newest
#          read-only IBKR capture from Drive for cash and working orders:
#          TFB_IBKR_CAPTURE on | off, TFB_IBKR_CAPTURE_FOLDER_ID,
#          TFB_TAP_IBKR_MAX_AGE_H (30).
#   1.3.2: TFB_TAP_BUY_CAPTURE_MARKET_H (2): a new buy needs a capture at most 2 market-open hours old.
#   1.2.0: ALIGNMENT (today_action_plan 1.2.0). The page also reads the two
#          Top 10 pages, the news gate and the cash ledger: TFB_TAP_ALIGN
#          on | off, TFB_TAP_NEWS_MAX_H (24).
#   1.1.0: the page is written with its design (today_action_plan 1.1.0).
#          TFB_TAP_STYLE=off writes the plain grid. A run by hand with
#          "preview" writes the tab Today_Action_Plan_Preview and leaves the
#          live page alone; with "plain" it writes the plain grid once.
#   1.0.1: TFB_TAP_RETRIES passed to the script (today_action_plan 1.0.2): a
#          Sheets per-minute quota answer is waited out and tried again.
#
# WHY: the owner asked (12 Nov 2026) for the Daily Plan and the Exit Plan in one
# sheet, "Today Action Plan", with clearer instructions that come from the other
# pages and stay aligned with them. scripts/today_action_plan.py copies the
# actions and levels of Exit_Plan and _Daily_Plan, adds the Evidence Board's
# figures and the Consistency Check's differences, and orders the day's steps.
#
# WHEN: after every successful Daily Plan or Exit Plan run (those two are
# started every hour by apps_script/29_Page_Refresh_Dispatch.gs), and by hand
# or from the workbook menu (apps_script/30_Action_Plan_Menu.gs).
#
# WRITES: only its own tab (Today_Action_Plan). It hides the ledger tabs named
# in TFB_TAP_HIDE_TABS (never deletes one). No order is placed.
# Rollback: repository variable TFB_TODAY_PLAN=off.
# =============================================================================
name: ✅ Today Action Plan

on:
  workflow_run:
    workflows: ["🗓️ Daily Plan", "🎯 Exit Plan"]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Compute and print only (write nothing)"
        type: boolean
        default: false
      preview:
        description: "Write the tab Today_Action_Plan_Preview instead of the live page"
        type: boolean
        default: false
      plain:
        description: "Write the plain grid, without the design (this run only)"
        type: boolean
        default: false

concurrency:
  group: tfb-today-action-plan
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: "3.11"
  PYTHONUNBUFFERED: 1
  TZ: Asia/Riyadh
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  today_plan:
    name: ✅ Build the page
    # a skipped or failed plan run has nothing new to copy
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v6

      - name: 🐍 Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install dependencies
        run: python -m pip install --quiet gspread==6.2.1 google-auth

      - name: 🔎 Resolve spreadsheet id
        id: sheet
        env:
          VAR_SHEET: ${{ vars.DEFAULT_SPREADSHEET_ID }}
        run: |
          SID="${VAR_SHEET:-}"
          if [[ -z "$SID" ]]; then
            echo "::error::Spreadsheet ID empty. Set repository variable DEFAULT_SPREADSHEET_ID."
            exit 1
          fi
          echo "sid=$SID" >> "$GITHUB_OUTPUT"

      - name: ✅ Build the Today Action Plan
        env:
          PYTHONPATH: ${{ github.workspace }}
          DEFAULT_SPREADSHEET_ID: ${{ steps.sheet.outputs.sid }}
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS != '' && secrets.GOOGLE_SHEETS_CREDENTIALS || secrets.GOOGLE_SHEETS_CREDENTIALS_B64 }}
          TFB_TODAY_PLAN: ${{ vars.TFB_TODAY_PLAN || 'on' }}
          TFB_TAP_STALE_H: ${{ vars.TFB_TAP_STALE_H || '3' }}
          TFB_TAP_STALE_EVIDENCE_H: ${{ vars.TFB_TAP_STALE_EVIDENCE_H || '18' }}
          TFB_TAP_STOP_TOL_PCT: ${{ vars.TFB_TAP_STOP_TOL_PCT || '1' }}
          TFB_TAP_PIPELINE: ${{ vars.TFB_TAP_PIPELINE || '5' }}
          TFB_TAP_HIDE_TABS: ${{ vars.TFB_TAP_HIDE_TABS || '_Daily_Plan,_Exit_Plan,_Evidence_Log' }}
          TFB_TAP_RETRIES: ${{ vars.TFB_TAP_RETRIES || '3' }}
          TFB_TAP_ALIGN: ${{ vars.TFB_TAP_ALIGN || 'on' }}
          TFB_TAP_NEWS_MAX_H: ${{ vars.TFB_TAP_NEWS_MAX_H || '24' }}
          TFB_TAP_IBKR_MAX_AGE_H: ${{ vars.TFB_TAP_IBKR_MAX_AGE_H || '30' }}
          TFB_TAP_BUY_CAPTURE_MARKET_H: ${{ vars.TFB_TAP_BUY_CAPTURE_MARKET_H || '2' }}
          TFB_IBKR_CAPTURE: ${{ vars.TFB_IBKR_CAPTURE || 'on' }}
          TFB_IBKR_CAPTURE_FOLDER_ID: ${{ vars.TFB_IBKR_CAPTURE_FOLDER_ID || '1WbO2y3xMzPU0lKQ3gHJQ28L19IIAQdNH' }}
          TFB_TAP_STYLE: ${{ (github.event_name == 'workflow_dispatch' && inputs.plain) && 'off' || vars.TFB_TAP_STYLE || 'on' }}
          TFB_TAP_PREVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.preview || 'false' }}
          EVENT_NAME: ${{ github.event_name }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=()
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$IN_DRY_RUN" == "true" ]]; then
            ARGS+=(--dry-run)
          fi
          python scripts/today_action_plan.py "${ARGS[@]}"
