# =============================================================================
# 📸 BigQuery Snapshots - the heavy views, computed once after each collector
# -----------------------------------------------------------------------------
# VERSION 1.0.0 (2026-11-24)
#
# WHY: owner, 24 Nov 2026 13:07 Riyadh (in Arabic): BigQuery more, faster,
# more accurate; 13:53 "Let's go with next". v_universe_latest,
# v_news_understanding and v_news_trend_learning cost 0.24-0.37 GB per read
# and are read many times a day (News Now twice an hour); their sources change
# only when a collector loads. scripts/bq_snapshots.py computes each once into
# snap_<name>; readers take a snapshot younger than 30 hours, else the view.
#
# WHEN: after each successful run of the archive, the deep data, the market
# series and the views (a changed view is snapshotted at once) - workflow_run -
# or dispatched (write=true; 'only' limits the tables).
# No cron. A failed collector run refreshes nothing.
#
# READS: the three views (SELECT only). WRITES: the snap_* tables only.
# Rollback: repository Variable TFB_BQ_SNAPSHOTS=off (the snapshots age and
# every reader goes back to the views by itself).
# =============================================================================
name: 📸 BigQuery Snapshots
run-name: ${{ github.event_name == 'workflow_dispatch' && format('{0} (dispatch, write={1})', github.workflow, inputs.write) || github.workflow }}

on:
  workflow_run:
    workflows: ["🗄️ BigQuery Archive", "🔬 BigQuery Symbol Deep Data", "🌍 BigQuery Market Series",
                "🗄️ BigQuery Looker Views"]
    types: [completed]
  workflow_dispatch:
    inputs:
      write:
        description: "Refresh the snapshots (unticked = dry run)"
        type: boolean
        default: false
      only:
        description: "Comma list of snapshot tables or views (empty = all)"
        type: string
        default: ""

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: "3.11"
  PYTHONUNBUFFERED: 1
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  snapshots:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    concurrency:
      group: tfb-bq-snapshots
      cancel-in-progress: false
    name: 📸 Refresh the snapshots
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v6

      - name: 🐍 Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install dependencies
        run: python -m pip install --quiet "google-auth==2.49.2" "requests==2.33.1"

      - name: 📸 Refresh
        env:
          PYTHONPATH: ${{ github.workspace }}
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS != '' && secrets.GOOGLE_SHEETS_CREDENTIALS || secrets.GOOGLE_SHEETS_CREDENTIALS_B64 }}
          TFB_BQ_PROJECT: ${{ vars.TFB_BQ_PROJECT || 'project-2e3530e6-2311-4aa3-b36' }}
          TFB_BQ_DATASET: ${{ vars.TFB_BQ_DATASET || 'tfb_archive' }}
          TFB_BQ_LOCATION: ${{ vars.TFB_BQ_LOCATION || 'US' }}
          TFB_BQ_SNAPSHOTS: ${{ vars.TFB_BQ_SNAPSHOTS || 'on' }}
          EVENT_NAME: ${{ github.event_name }}
          IN_WRITE: ${{ inputs.write }}
          IN_ONLY: ${{ inputs.only }}
        run: |
          ARGS=(--only "${IN_ONLY:-}")
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$IN_WRITE" != "true" ]]; then
            ARGS+=(--dry-run)
            echo "Dry-run mode - nothing refreshed (tick write=true to refresh)."
          fi
          python scripts/bq_snapshots.py "${ARGS[@]}"
