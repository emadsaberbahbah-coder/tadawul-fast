name: 🧯 Page Refresh Recovery

# (2026-10-16) RECOVERY WRITER CONTROL PARITY. Manual recovery executes the
# same persistence path as Advanced Sync. It must retain that writer's active
# last-good sanity and quota protections and honor the same operator controls;
# otherwise a repair can restore rows the scheduled writer quarantined or
# ignore an armed retirement/currency/hold guard. Match daily_sync's two writer
# lanes without copying tracker settings. Page selection and the independent
# 3600-second recovery budget remain specific to this workflow. All newly wired
# opt-in controls retain the scheduled writer's existing off/empty defaults.
# Read-back: the runner's guard tokens and sync_runner_* evidence; regression:
# tests/test_recovery_writer_control_parity.py. No production dispatch is added.

# (2026-10-13) P0-1 SUPERSEDE AT WRITER START (Codex P1 on PR #763): the
# recover-page job gains ONE step, 'Supersede released decision feed (P0-1)',
# after its credentials step and before its page write, gated on
# vars.TFB_DECISION_RELEASE (unset: skipped, nothing else moves). This file has
# no VERSION header, so none is invented here; the WHY is on the step.

on:
  pull_request:
    paths:
      - '.github/workflows/page_refresh_recovery.yml'
      - 'scripts/audit_sync_outcome.py'
      - 'scripts/plan_sync_recovery.py'
      - 'scripts/run_inline_page_recovery.py'
      - 'tests/test_sync_outcome_audit.py'
      - 'tests/test_sync_recovery_plan.py'
      - 'tests/test_inline_page_recovery.py'
      - 'tests/test_manual_recovery_evidence_workflow.py'
      - 'tests/test_activation_rollout_evidence_workflows.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/page_refresh_recovery.yml'
      - 'scripts/audit_sync_outcome.py'
      - 'scripts/plan_sync_recovery.py'
      - 'scripts/run_inline_page_recovery.py'
      - 'tests/test_sync_outcome_audit.py'
      - 'tests/test_sync_recovery_plan.py'
      - 'tests/test_inline_page_recovery.py'
      - 'tests/test_manual_recovery_evidence_workflow.py'
      - 'tests/test_activation_rollout_evidence_workflows.py'
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Completed Advanced Sync run ID to inspect and recover'
        required: true
        type: string
      rank_mode:
        description: 'Whole-page ranking override for this recovery (inherit repository variable)'
        required: false
        default: inherit
        type: choice
        options: ['inherit', 'off', 'observe', 'enforce']
      warnings_mode:
        description: 'Warning compaction override; enforcement awaits a verified external archive'
        required: false
        default: inherit
        type: choice
        options: ['inherit', 'off', 'observe']

permissions:
  contents: read
  actions: read

# Automatic recovery now runs inside Advanced Sync and keeps the same production
# lease. This workflow remains for manual historical-run recovery only. Its CI
# tests use a separate cancellable group and never compete with production writes.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('tadawul-production-write-{0}', github.ref) || format('page-recovery-ci-{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  regression-tests:
    name: Test page refresh recovery
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Compile recovery code
        run: |
          python -m py_compile \
            scripts/audit_sync_outcome.py \
            scripts/plan_sync_recovery.py \
            scripts/run_inline_page_recovery.py \
            tests/test_sync_outcome_audit.py \
            tests/test_sync_recovery_plan.py \
            tests/test_inline_page_recovery.py

      - name: Install rollout workflow test dependencies
        run: python -m pip install pytest==9.1.1 pyyaml==6.0.3

      - name: Run recovery regression tests
        run: |
          python -m unittest \
            tests/test_sync_outcome_audit.py \
            tests/test_sync_recovery_plan.py \
            tests/test_inline_page_recovery.py
          python -m pytest -q tests/test_activation_rollout_evidence_workflows.py tests/test_manual_recovery_evidence_workflow.py

  plan:
    name: Plan missing page refreshes
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # A successful write can still contain last-good rows retained after an
    # incomplete fetch. Keep the planner on the same 95% fresh-data contract as
    # Daily Sync's inline recovery and the scheduled outcome audit.
    env:
      TFB_AUDIT_REQUIRE_FULL_FETCH: '1'
      TFB_AUDIT_MIN_FRESH_PCT: '95'
    outputs:
      needs_recovery: ${{ steps.plan.outputs.needs_recovery }}
      matrix: ${{ steps.plan.outputs.matrix }}
      retry_pages: ${{ steps.plan.outputs.retry_pages }}
      source_run_id: ${{ steps.source.outputs.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Resolve source run
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            RUN_ID="$WORKFLOW_RUN_ID"
            echo "Source workflow conclusion: ${WORKFLOW_CONCLUSION:-unknown}"
          else
            RUN_ID="$INPUT_RUN_ID"
          fi
          if [[ ! "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid source run id: '$RUN_ID'"
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download source sync artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: tadawul-sync-logs-${{ steps.source.outputs.run_id }}-*
          path: source-sync-artifacts
          merge-multiple: false
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}

      # A completed Daily Sync can already have repaired a primary leg using
      # its inline recovery. Plan from both artifact families of the SAME
      # resolved source run, just like Sync Outcome Audit. The zz-recovery
      # prefix makes later recovery verdicts supersede primary verdicts; the
      # auditor orders cycleN attempts numerically. Sources predating inline
      # recovery have no matching artifact and retain primary-only planning.
      - name: Download source inline recovery evidence (best-effort)
        id: source_inline_evidence
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: page-refresh-${{ steps.source.outputs.run_id }}-*
          path: source-sync-artifacts/zz-recovery
          merge-multiple: false
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Build targeted recovery matrix
        id: plan
        env:
          SOURCE_INLINE_DOWNLOAD_OUTCOME: ${{ steps.source_inline_evidence.outcome }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          if os.getenv("SOURCE_INLINE_DOWNLOAD_OUTCOME") != "success":
              print("::warning::Source inline recovery download was unavailable; no recovery success is inferred.")
          if not any(path.is_file() for path in Path("source-sync-artifacts/zz-recovery").rglob("sync_*.log")):
              print("::notice::No source inline recovery logs are available; the planner must certify downloaded primary evidence or request a retry.")
          PY
          python scripts/plan_sync_recovery.py \
            --root source-sync-artifacts \
            --json-out sync-recovery-plan.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload recovery plan
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sync-recovery-plan-${{ steps.source.outputs.run_id }}
          path: sync-recovery-plan.json
          retention-days: 30
          if-no-files-found: warn

  recover-page:
    name: Recover ${{ matrix.page }}
    needs: plan
    if: ${{ needs.plan.outputs.needs_recovery == 'true' }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 115
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      PYTHON_VERSION: '3.11'
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ${{ github.workspace }}
      TZ: Asia/Riyadh
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      # The post-refresh auditor below must reject a positive write whose
      # current-run fresh coverage remains below the recovery contract.
      TFB_AUDIT_REQUIRE_FULL_FETCH: '1'
      TFB_AUDIT_MIN_FRESH_PCT: '95'
      TARGET_URL: ${{ vars.BACKEND_BASE_URL || 'https://tadawul-fast-bridge.onrender.com' }}
      TARGET_SHEET_ID: ${{ vars.DEFAULT_SPREADSHEET_ID }}
      TFB_XPAGE_PRICE_CHECK: '1'
      TFB_SYNC_PAGE_ORDER: ${{ matrix.page }}
      TFB_SYNC_EMPTY_RETRY: '0'
      TFB_SYNC_NAME_DEDUP_MODE: observe
      # Already active in both scheduled writer lanes: validate restored rows
      # before keeping them and stop spending/filling pages on exhausted quota.
      TFB_SYNC_PERSIST_SANITY: '1'
      TFB_SYNC_EODHD_QUOTA: observe
      TFB_SYNC_EODHD_QUOTA_GUARD: enforce
      TFB_SYNC_FETCHFAIL_TRUTH: observe
      # Same fail-closed writer controls, including their operator kill switches.
      TFB_SYNC_CAPACITY_STATUS: ${{ vars.TFB_SYNC_CAPACITY_STATUS || '1' }}
      TFB_SYNC_FALSE_GREEN_SCREEN: ${{ vars.TFB_SYNC_FALSE_GREEN_SCREEN || '1' }}
      TFB_SYNC_KLG_IDENTITY_GATE: ${{ vars.TFB_SYNC_KLG_IDENTITY_GATE || '1' }}
      TFB_SYNC_APPEND_FAIL_IS_ERROR: ${{ vars.TFB_SYNC_APPEND_FAIL_IS_ERROR || '1' }}
      # These mappings make existing controls reachable; they do not arm them.
      TFB_SYNC_FORCE_REFETCH_SYMBOLS: ${{ vars.TFB_SYNC_FORCE_REFETCH_SYMBOLS || '' }}
      TFB_SYNC_QUARANTINE_SYMBOLS: ${{ vars.TFB_SYNC_QUARANTINE_SYMBOLS || '' }}
      TFB_SYNC_IDENTITY_REFETCH: ${{ vars.TFB_SYNC_IDENTITY_REFETCH || '0' }}
      TFB_SYNC_KLG_CRYPTO_NAME_GATE: ${{ vars.TFB_SYNC_KLG_CRYPTO_NAME_GATE || 'off' }}
      TFB_SYNC_RETIRE_TAB: ${{ vars.TFB_SYNC_RETIRE_TAB || 'off' }}
      TFB_SYNC_RETIRE_TAB_NAME: ${{ vars.TFB_SYNC_RETIRE_TAB_NAME || '_Retired_Symbols' }}
      TFB_SYNC_RETIRE_MAX_PCT: ${{ vars.TFB_SYNC_RETIRE_MAX_PCT || '20' }}
      TFB_OPP_FX_USX_SUBUNIT: ${{ vars.TFB_OPP_FX_USX_SUBUNIT || '0' }}
      TFB_SYNC_OHLC_PREWRITE: ${{ vars.TFB_SYNC_OHLC_PREWRITE || '0' }}
      TFB_SYNC_OHLC_PREWRITE_MODE: ${{ vars.TFB_SYNC_OHLC_PREWRITE_MODE || 'observe' }}
      TFB_SYNC_OHLC_PREWRITE_TOL: ${{ vars.TFB_SYNC_OHLC_PREWRITE_TOL || '0.01' }}
      TFB_SYNC_OHLC_PREWRITE_ENFORCE_CLASSES: ${{ vars.TFB_SYNC_OHLC_PREWRITE_ENFORCE_CLASSES || '' }}
      TFB_SYNC_OHLC_RUNLOG: ${{ vars.TFB_SYNC_OHLC_RUNLOG || '1' }}
      # W1A-6f (2026-08-25): v6.44 FILL-GUARD gates (DS-01) — same contract
      # as daily_sync; unset Variables keep the guard OFF.
      TFB_SYNC_OHLC_FILL_GUARD: ${{ vars.TFB_SYNC_OHLC_FILL_GUARD || '0' }}
      TFB_SYNC_OHLC_FILL_GUARD_MODE: ${{ vars.TFB_SYNC_OHLC_FILL_GUARD_MODE || 'observe' }}
      TFB_SYNC_OHLC_FILL_GUARD_COLS: ${{ vars.TFB_SYNC_OHLC_FILL_GUARD_COLS || '' }}
      TFB_SYNC_OHLC_READBACK: ${{ vars.TFB_SYNC_OHLC_READBACK || '0' }}
      TFB_SYNC_RB_TOL_ROWS: ${{ vars.TFB_SYNC_RB_TOL_ROWS || '0' }}
      TFB_SYNC_RB_TOL_PCT: ${{ vars.TFB_SYNC_RB_TOL_PCT || '0' }}
      TFB_SYNC_NULL_CLEAR_SCOPE: ${{ vars.TFB_SYNC_NULL_CLEAR_SCOPE || 'ohlc' }}
      TFB_SYNC_NULL_KEEP_COLS: ${{ vars.TFB_SYNC_NULL_KEEP_COLS || '' }}
      TFB_SYNC_READBACK_REPAIR: ${{ vars.TFB_SYNC_READBACK_REPAIR || '' }}
      TFB_SYNC_STATUS_STAMP: ${{ vars.TFB_SYNC_STATUS_STAMP || '0' }}
      TFB_SYNC_STATUS_STAMP_PAGES: ${{ vars.TFB_SYNC_STATUS_STAMP_PAGES || '' }}
      TFB_SYNC_STATUS_TRUTH: ${{ vars.TFB_SYNC_STATUS_TRUTH || '0' }}
      TFB_SYNC_UPSTREAM_VERDICT: ${{ vars.TFB_SYNC_UPSTREAM_VERDICT || '0' }}
      TFB_SYNC_VERDICT_PAGES: ${{ vars.TFB_SYNC_VERDICT_PAGES || '' }}
      TFB_SYNC_VERDICT_MAX_AGE_MIN: ${{ vars.TFB_SYNC_VERDICT_MAX_AGE_MIN || '240' }}
      TFB_SYNC_WRITE_SENTINEL: ${{ vars.TFB_SYNC_WRITE_SENTINEL || '0' }}
      TFB_SYNC_HOLD_TTL_SEC: ${{ vars.TFB_SYNC_HOLD_TTL_SEC || '180' }}
      TFB_SYNC_HOLD_POST_GRACE_SEC: ${{ vars.TFB_SYNC_HOLD_POST_GRACE_SEC || '45' }}
      TFB_PORTFOLIO_REBUILD: '1'
      # v6.64.8 (2026-10-07) portfolio minor-unit currency guard (GBp vs GBP
      # 100x Position Value / P/L). Guard the three production PF write lanes.
      # Default ON: reject explicit minor-unit quotes instead of publishing
      # major-currency cost/value math. An explicit Variable value 0 opts out.
      TFB_PF_MINOR_UNIT_CCY_GUARD: ${{ vars.TFB_PF_MINOR_UNIT_CCY_GUARD || '1' }}
      TFB_SYNC_DECISION_GUARD: '1'
      TFB_SYNC_PRIORITY_FETCH: '0'
      TFB_SYNC_SYMBOL_BATCH_SIZE: '25'
      TFB_SYNC_TIME_BUDGET_SEC: '3600'
      TFB_SYNC_MAX_SYMBOLS_MARKET: '7000'
      TFB_SYNC_MARKET_GATEWAY: analysis
      # v6.65.0 WP-6 WARNINGS-COMPACT (2026-10-11): a recovery write obeys the
      # same gate as the scheduled legs (off | observe | enforce, explicit
      # words). (2026-10-12) Operator-authorized initial rollout observes;
      # enforcement stays blocked without a verified external archive.
      # Rollback: set the Variable to off; unsetting reactivates observe.
      TFB_WARNINGS_COMPACT: ${{ vars.TFB_WARNINGS_COMPACT || 'observe' }}
      TFB_WARNINGS_COMPACT_KEEP: ${{ vars.TFB_WARNINGS_COMPACT_KEEP || '' }}
      # v6.66.0 WP-2c RANK-PAGE (2026-10-11): a recovery write ranks Rank (Overall)
      # over the whole page under the same gate as the scheduled legs; without this
      # mapping a recovery after arming would republish within-batch ranks (batch 25).
      # (2026-10-12) Same rank-only gate as scheduled legs.
      # Rollback: set the Variable to off; unsetting reactivates enforce.
      TFB_RANK_OVERALL_PAGE: ${{ vars.TFB_RANK_OVERALL_PAGE || 'enforce' }}
      BACKEND_TOKEN: ${{ secrets.BACKEND_TOKEN }}
      # The quota observer/guard reads this locally; backend authentication
      # alone cannot provide a usage snapshot (missing key is fail-open).
      EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.render.txt
            requirements.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          if [[ -f requirements.render.txt ]]; then
            python -m pip install -r requirements.render.txt
          elif [[ -f requirements.txt ]]; then
            python -m pip install -r requirements.txt
          else
            echo "::error::No requirements file found."
            exit 1
          fi

      - name: Resolve publication rollout modes
        env:
          RANK_MODE_OVERRIDE: ${{ github.event.inputs.rank_mode || 'inherit' }}
          WARNINGS_MODE_OVERRIDE: ${{ github.event.inputs.warnings_mode || 'inherit' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          requested = {"rank": os.getenv("RANK_MODE_OVERRIDE", "inherit"),
                       "warnings": os.getenv("WARNINGS_MODE_OVERRIDE", "inherit")}
          for feature, allowed in (("rank", {"inherit", "off", "observe", "enforce"}),
                                   ("warnings", {"inherit", "off", "observe"})):
              if requested[feature] not in allowed:
                  raise SystemExit("::error::Invalid " + feature + " rollout override")
          configured = {"rank": os.getenv("TFB_RANK_OVERALL_PAGE", "off"),
                        "warnings": os.getenv("TFB_WARNINGS_COMPACT", "off")}
          effective = {}
          for feature in requested:
              value = (configured[feature] if requested[feature] == "inherit" else requested[feature]).strip().lower()
              effective[feature] = value if value in {"observe", "enforce"} else "off"
          if effective["warnings"] == "enforce":
              raise SystemExit("::error::Warning enforcement is blocked: no verified prewrite external archive")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write("TFB_RANK_OVERALL_PAGE=" + effective["rank"] + "\n")
              env.write("TFB_WARNINGS_COMPACT=" + effective["warnings"] + "\n")
          evidence = {"run_id": os.getenv("GITHUB_RUN_ID"), "source_sha": os.getenv("GITHUB_SHA"),
                      "event": os.getenv("GITHUB_EVENT_NAME"), "requested": requested,
                      "configured": configured, "effective": effective,
                      "warnings_enforcement": "blocked_no_prewrite_external_archive"}
          Path("rollout_modes.json").write_text(json.dumps(evidence, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(evidence))
          PY

      - name: Configure production credentials
        env:
          SECRET_CREDS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          SECRET_CREDS_B64: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "${TARGET_SHEET_ID:-}" ]]; then
            echo "::error::vars.DEFAULT_SPREADSHEET_ID is empty."
            exit 1
          fi

          RAW_CREDS="${SECRET_CREDS:-}"
          if [[ -z "$RAW_CREDS" && -n "${SECRET_CREDS_B64:-}" ]]; then
            RAW_CREDS="$(printf '%s' "$SECRET_CREDS_B64" | base64 --decode 2>/dev/null || true)"
          fi
          if [[ -z "$RAW_CREDS" ]] || ! printf '%s' "$RAW_CREDS" | jq empty >/dev/null 2>&1; then
            echo "::error::No valid Google Sheets credentials found."
            exit 1
          fi

          CREDS_PATH="$RUNNER_TEMP/google_credentials.json"
          printf '%s' "$RAW_CREDS" > "$CREDS_PATH"
          chmod 600 "$CREDS_PATH"
          SA_EMAIL="$(jq -r '.client_email // empty' "$CREDS_PATH")"
          [[ -n "$SA_EMAIL" ]] && echo "::add-mask::$SA_EMAIL"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CREDS_PATH" >> "$GITHUB_ENV"

      # (2026-10-13) P0-1 SUPERSEDE AT WRITER START (Codex P1 on PR #763).
      # WHY: this job re-runs run_dashboard_sync.py, which re-stamps the page
      # with THIS recovery run's id, so a released EXECUTABLE for an older run
      # must not survive into the recovered cohort. Before the page write
      # below, scripts/release_decision_feed.py --mode supersede downgrades any
      # feed a consumer would read as EXECUTABLE through the unchanged
      # finalize.publish_blocker. Gated on the release variable (armed words
      # 1/true/yes/on, case-insensitive): unset or any other value skips this
      # step and nothing else moves. FAIL CLOSED: a fault exits 3 and fails
      # this step, so the page write is skipped.
      - name: Supersede released decision feed (P0-1)
        if: ${{ contains(fromJSON('["1","true","yes","on"]'), vars.TFB_DECISION_RELEASE) && github.event_name == 'workflow_dispatch' }}
        timeout-minutes: 5
        run: |
          set -euo pipefail
          python scripts/release_decision_feed.py --mode supersede \
            --current-run "$GITHUB_RUN_ID" \
            --sheet-id "$TARGET_SHEET_ID" \
            --json-out "$RUNNER_TEMP/release_decision_feed_supersede.json"

      - name: Check backend health
        run: |
          set -euo pipefail
          for endpoint in /readyz /health /livez; do
            if curl -fsS --max-time 15 "$TARGET_URL$endpoint" >/dev/null; then
              echo "Backend healthy via $endpoint"
              exit 0
            fi
          done
          echo "::error::Backend health checks failed."
          exit 1

      - name: Stagger provider load
        if: ${{ matrix.stagger != 0 }}
        run: sleep "${{ matrix.stagger }}"

      - name: Refresh one page with an independent budget
        id: refresh
        run: |
          set -euo pipefail
          echo "Refreshing ${{ matrix.page }} as key ${{ matrix.key }}"
          set +e
          python scripts/run_dashboard_sync.py \
            --backend "$TARGET_URL" \
            --sheet-id "$TARGET_SHEET_ID" \
            --keys "${{ matrix.key }}" \
            --start-cell A1 \
            --json-out "sync_runner_${{ matrix.group }}_${GITHUB_RUN_ID:-local}_${GITHUB_RUN_ATTEMPT:-1}.json" \
            2>&1 | tee sync_execution.log
          RC=${PIPESTATUS[0]}
          set -e
          echo "runner_exit=$RC" >> "$GITHUB_OUTPUT"
          if [[ "$RC" -ne 0 ]]; then
            echo "::error::Page refresh runner failed with exit $RC."
            exit "$RC"
          fi

      - name: Require a real page refresh
        run: |
          python scripts/audit_sync_outcome.py \
            --root . \
            --required-pages "${{ matrix.page }}" \
            --json-out page-audit.json

      - name: Upload page recovery evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: page-refresh-${{ needs.plan.outputs.source_run_id }}-${{ matrix.group }}
          path: |
            sync_execution.log
            sync_summary.json
            sync_runner_*.json
            rollout_modes.json
            page-audit.json
            sync_row_telemetry_*.jsonl
          retention-days: 30
          if-no-files-found: warn

      - name: Secure cleanup
        if: always()
        run: |
          CREDS_PATH="${GOOGLE_APPLICATION_CREDENTIALS:-$RUNNER_TEMP/google_credentials.json}"
          if [[ -f "$CREDS_PATH" ]]; then
            shred -u -z "$CREDS_PATH" 2>/dev/null || rm -f "$CREDS_PATH"
          fi

  recovery-verdict:
    name: Page recovery verdict
    needs: [plan, recover-page]
    if: >-
      ${{
        always() &&
        needs.plan.result == 'success' &&
        needs.plan.outputs.needs_recovery == 'true'
      }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require every targeted page retry to pass
        env:
          RECOVERY_RESULT: ${{ needs.recover-page.result }}
          RETRY_PAGES: ${{ needs.plan.outputs.retry_pages }}
        run: |
          if [[ "$RECOVERY_RESULT" != "success" ]]; then
            echo "::error::Automatic page recovery failed for one or more pages: $RETRY_PAGES"
            exit 1
          fi
          echo "All targeted page refreshes succeeded: $RETRY_PAGES"
