name: 🧯 Page Refresh Recovery

on:
  pull_request:
    paths:
      - '.github/workflows/page_refresh_recovery.yml'
      - 'scripts/audit_sync_outcome.py'
      - 'scripts/plan_sync_recovery.py'
      - 'scripts/run_inline_page_recovery.py'
      - 'tests/test_sync_outcome_audit.py'
      - 'tests/test_sync_recovery_plan.py'
      - 'tests/test_inline_page_recovery.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/page_refresh_recovery.yml'
      - 'scripts/audit_sync_outcome.py'
      - 'scripts/plan_sync_recovery.py'
      - 'scripts/run_inline_page_recovery.py'
      - 'tests/test_sync_outcome_audit.py'
      - 'tests/test_sync_recovery_plan.py'
      - 'tests/test_inline_page_recovery.py'
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Completed Advanced Sync run ID to inspect and recover'
        required: true
        type: string

permissions:
  contents: read
  actions: read

# Automatic recovery now runs inside Advanced Sync and keeps the same production
# lease. This workflow remains for manual historical-run recovery only. Its CI
# tests use a separate cancellable group and never compete with production writes.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('tadawul-production-write-{0}', github.ref) || format('page-recovery-ci-{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  regression-tests:
    name: Test page refresh recovery
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Compile recovery code
        run: |
          python -m py_compile \
            scripts/audit_sync_outcome.py \
            scripts/plan_sync_recovery.py \
            scripts/run_inline_page_recovery.py \
            tests/test_sync_outcome_audit.py \
            tests/test_sync_recovery_plan.py \
            tests/test_inline_page_recovery.py

      - name: Run recovery regression tests
        run: |
          python -m unittest \
            tests/test_sync_outcome_audit.py \
            tests/test_sync_recovery_plan.py \
            tests/test_inline_page_recovery.py

  plan:
    name: Plan missing page refreshes
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      needs_recovery: ${{ steps.plan.outputs.needs_recovery }}
      matrix: ${{ steps.plan.outputs.matrix }}
      retry_pages: ${{ steps.plan.outputs.retry_pages }}
      source_run_id: ${{ steps.source.outputs.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Resolve source run
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            RUN_ID="$WORKFLOW_RUN_ID"
            echo "Source workflow conclusion: ${WORKFLOW_CONCLUSION:-unknown}"
          else
            RUN_ID="$INPUT_RUN_ID"
          fi
          if [[ ! "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid source run id: '$RUN_ID'"
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download source sync artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: tadawul-sync-logs-${{ steps.source.outputs.run_id }}-*
          path: source-sync-artifacts
          merge-multiple: false
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Build targeted recovery matrix
        id: plan
        run: |
          python scripts/plan_sync_recovery.py \
            --root source-sync-artifacts \
            --json-out sync-recovery-plan.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload recovery plan
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sync-recovery-plan-${{ steps.source.outputs.run_id }}
          path: sync-recovery-plan.json
          retention-days: 30
          if-no-files-found: warn

  recover-page:
    name: Recover ${{ matrix.page }}
    needs: plan
    if: ${{ needs.plan.outputs.needs_recovery == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 115
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      PYTHON_VERSION: '3.11'
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ${{ github.workspace }}
      TZ: Asia/Riyadh
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      TARGET_URL: ${{ vars.BACKEND_BASE_URL || 'https://tadawul-fast-bridge.onrender.com' }}
      TARGET_SHEET_ID: ${{ vars.DEFAULT_SPREADSHEET_ID }}
      TFB_XPAGE_PRICE_CHECK: '1'
      TFB_SYNC_PAGE_ORDER: ${{ matrix.page }}
      TFB_SYNC_EMPTY_RETRY: '0'
      TFB_SYNC_NAME_DEDUP_MODE: observe
      TFB_PORTFOLIO_REBUILD: '1'
      TFB_SYNC_DECISION_GUARD: '1'
      TFB_SYNC_SYMBOL_BATCH_SIZE: '25'
      TFB_SYNC_TIME_BUDGET_SEC: '3600'
      TFB_SYNC_MAX_SYMBOLS_MARKET: '7000'
      TFB_SYNC_MARKET_GATEWAY: analysis
      BACKEND_TOKEN: ${{ secrets.BACKEND_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.render.txt
            requirements.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          if [[ -f requirements.render.txt ]]; then
            python -m pip install -r requirements.render.txt
          elif [[ -f requirements.txt ]]; then
            python -m pip install -r requirements.txt
          else
            echo "::error::No requirements file found."
            exit 1
          fi

      - name: Configure production credentials
        env:
          SECRET_CREDS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          SECRET_CREDS_B64: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "${TARGET_SHEET_ID:-}" ]]; then
            echo "::error::vars.DEFAULT_SPREADSHEET_ID is empty."
            exit 1
          fi

          RAW_CREDS="${SECRET_CREDS:-}"
          if [[ -z "$RAW_CREDS" && -n "${SECRET_CREDS_B64:-}" ]]; then
            RAW_CREDS="$(printf '%s' "$SECRET_CREDS_B64" | base64 --decode 2>/dev/null || true)"
          fi
          if [[ -z "$RAW_CREDS" ]] || ! printf '%s' "$RAW_CREDS" | jq empty >/dev/null 2>&1; then
            echo "::error::No valid Google Sheets credentials found."
            exit 1
          fi

          CREDS_PATH="$RUNNER_TEMP/google_credentials.json"
          printf '%s' "$RAW_CREDS" > "$CREDS_PATH"
          chmod 600 "$CREDS_PATH"
          SA_EMAIL="$(jq -r '.client_email // empty' "$CREDS_PATH")"
          [[ -n "$SA_EMAIL" ]] && echo "::add-mask::$SA_EMAIL"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CREDS_PATH" >> "$GITHUB_ENV"

      - name: Check backend health
        run: |
          set -euo pipefail
          for endpoint in /readyz /health /livez; do
            if curl -fsS --max-time 15 "$TARGET_URL$endpoint" >/dev/null; then
              echo "Backend healthy via $endpoint"
              exit 0
            fi
          done
          echo "::error::Backend health checks failed."
          exit 1

      - name: Stagger provider load
        if: ${{ matrix.stagger != 0 }}
        run: sleep "${{ matrix.stagger }}"

      - name: Refresh one page with an independent budget
        id: refresh
        run: |
          set -euo pipefail
          echo "Refreshing ${{ matrix.page }} as key ${{ matrix.key }}"
          set +e
          python scripts/run_dashboard_sync.py \
            --backend "$TARGET_URL" \
            --sheet-id "$TARGET_SHEET_ID" \
            --keys "${{ matrix.key }}" \
            --start-cell A1 \
            2>&1 | tee sync_execution.log
          RC=${PIPESTATUS[0]}
          set -e
          echo "runner_exit=$RC" >> "$GITHUB_OUTPUT"
          if [[ "$RC" -ne 0 ]]; then
            echo "::error::Page refresh runner failed with exit $RC."
            exit "$RC"
          fi

      - name: Require a real page refresh
        run: |
          python scripts/audit_sync_outcome.py \
            --root . \
            --required-pages "${{ matrix.page }}" \
            --json-out page-audit.json

      - name: Upload page recovery evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: page-refresh-${{ needs.plan.outputs.source_run_id }}-${{ matrix.group }}
          path: |
            sync_execution.log
            sync_summary.json
            page-audit.json
          retention-days: 30
          if-no-files-found: warn

      - name: Secure cleanup
        if: always()
        run: |
          CREDS_PATH="${GOOGLE_APPLICATION_CREDENTIALS:-$RUNNER_TEMP/google_credentials.json}"
          if [[ -f "$CREDS_PATH" ]]; then
            shred -u -z "$CREDS_PATH" 2>/dev/null || rm -f "$CREDS_PATH"
          fi

  recovery-verdict:
    name: Page recovery verdict
    needs: [plan, recover-page]
    if: >-
      ${{
        always() &&
        needs.plan.result == 'success' &&
        needs.plan.outputs.needs_recovery == 'true'
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every targeted page retry to pass
        env:
          RECOVERY_RESULT: ${{ needs.recover-page.result }}
          RETRY_PAGES: ${{ needs.plan.outputs.retry_pages }}
        run: |
          if [[ "$RECOVERY_RESULT" != "success" ]]; then
            echo "::error::Automatic page recovery failed for one or more pages: $RETRY_PAGES"
            exit 1
          fi
          echo "All targeted page refreshes succeeded: $RETRY_PAGES"
