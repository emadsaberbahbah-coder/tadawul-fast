# =============================================================================
# 📏 TFB Acceptance (Day-10 definition of done, measured) — acceptance_check.yml
# =============================================================================
# VERSION 1.0.1 (2026-10-20) -- LIVE READ WINDOW VARIABLE (default off)
# WHY: scripts/tfb_acceptance.py v1.0.10 adds TFB_ACCEPTANCE_LIVE_WINDOW. On
# the live workbook A1, A2a and A3 have always printed NA ('section not
# found' / 'Symbol/Name columns not found') because the live reader's window
# is narrower than the layout they parse. Mapped at JOB level from the
# repository Variable with default '0' (unset -> '0' -> the v1.0.9 reads,
# byte-identical). Set the Variable to 1 to let A1/A2a/A3 measure. Rollback:
# unset the Variable. Nothing else in this workflow changes.
# WHY: "done" is a printed table of measurements, not an opinion. This runs
# scripts/tfb_acceptance.py v1.0.0 READ-ONLY against the live workbook every
# morning after the sync legs (and on demand), publishes the table to the job
# summary and an artifact, and never writes a cell. Non-strict by design: an
# instrument, not a blocker (add strict=true on dispatch to make FAIL red).
# =============================================================================
name: 📏 TFB Acceptance (measured)
on:
  schedule:
    - cron: "45 6 * * *"   # 09:45 Riyadh — after the morning legs + Top_10
  workflow_dispatch:
    inputs:
      strict:
        description: "Exit non-zero when any criterion FAILs"
        type: choice
        options: ["false", "true"]
        default: "false"
      board_min:
        description: "Board criterion: minimum qualified names"
        type: string
        default: "5"
permissions:
  contents: read
concurrency:
  group: tfb-acceptance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  acceptance:
    name: 📏 Measure the definition of done
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # v1.0.1 (2026-10-20): tfb_acceptance v1.0.10 live read window for A1/A2a/A3.
      TFB_ACCEPTANCE_LIVE_WINDOW: ${{ vars.TFB_ACCEPTANCE_LIVE_WINDOW || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install --quiet gspread google-auth openpyxl
      - name: Offline selftest (no credentials)
        run: python scripts/tfb_acceptance.py --selftest
      - name: Measure the live workbook (read-only)
        env:
          DEFAULT_SPREADSHEET_ID: ${{ vars.DEFAULT_SPREADSHEET_ID }}
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          GOOGLE_SHEETS_CREDENTIALS_B64: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS_B64 }}
        run: |
          set -o pipefail
          ARGS=(--live --json artifacts/acceptance.json --board-min "${{ inputs.board_min || '5' }}")
          if [ "${{ inputs.strict }}" = "true" ]; then ARGS+=(--strict); fi
          python scripts/tfb_acceptance.py "${ARGS[@]}" | tee artifacts_console.txt
      - name: Upload acceptance artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tfb-acceptance-${{ github.run_id }}
          path: |
            artifacts/
            artifacts_console.txt
          if-no-files-found: warn
          retention-days: 90
