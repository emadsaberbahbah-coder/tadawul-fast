# =============================================================================
# Release Decision Feed (P0-1) - .github/workflows/release_decision_feed.yml
# =============================================================================
# VERSION 1.2.1 (2026-10-24, renumbered 2026-10-31; authored as 1.1.1, which
# main reserved for this PR) -- SCHEDULED SLOT DEFERRAL (release_decision_feed.py
# v1.3.1, authored as v1.2.1). Merged over main's 1.2.0 (render settle); both
# gates sit in the release STEP env, and either one off leaves the other as is.
# The release step maps TFB_RELEASE_INFLIGHT_DEFER from the repository
# variable (default '0' = v1.3.0 behaviour; v1.2.0 when authored). Armed, a
# scheduled source=auto attempt
# that lands inside the daily_sync which superseded or produced its cohort exits 1
# (deferred, green with a warning below) instead of 3, and the one key-block read
# retries transport faults. Mapped in the STEP env so the job env stays the final
# job's env plus the two release gates. ROLLBACK: delete the variable.
#
# VERSION 1.2.0 (2026-10-29) -- RENDER SETTLE MAPPING (release_decision_feed 1.3.0)
# (1.1.1 is claimed by open PR #831.)
#
# WHY: a release run whose strict audit reads a cockpit mid-render ('status:
# running...' in B2) fails, and an armed re-verification of a live release
# then withdraws it for good (release_window_consumed); see the script's
# v1.3.0 WHY. WHAT: the release STEP env maps
# TFB_RELEASE_RENDER_SETTLE: ${{ vars.TFB_RELEASE_RENDER_SETTLE || '0' }}
# (default OFF). The JOB env is untouched, so its parity with the final job
# of daily_sync.yml (tests/test_release_decision_feed.py case_n16) holds.
# A settle adds one 150 s wait plus one strict audit, inside the 30-minute
# timeout. The release summary prints a render_settle row only when the
# result carries that key (absent when the gate is off). Nothing else
# changes: triggers, group, gates, steps.
# ROLLBACK: unset the variable, or revert this line.
#
# VERSION 1.1.0 (2026-10-19) -- SCHEDULED ATTEMPTS WITH SOURCE DISCOVERY
#
# WHY: the board has read 'FEED NOT ACTIONABLE ... 0 EXECUTABLE' on every
# cockpit run since 15 Oct while 11-12 names qualified on merit. The feed is
# downgrade-only and the ONLY promotion path was this workflow, dispatched by
# hand with the sync run id, after the cockpits re-render and before the
# 480-minute clock, several times a day. Nobody did, so nothing was ever
# released (procedural stopper, not an audit failure).
# WHAT: (1) 'schedule' triggers after the cockpit render slots (Riyadh 03:45,
# 08:30, 13:45, 15:45, 20:45, 23:45) with source_run_id=auto and mode=release;
# (2) source_run_id is optional on dispatch and defaults to 'auto'
# (release_decision_feed.py v1.2.0 reads the cohort from the same bounded
# _Status L:M block: the run= token of 'TFB Feed Global_Markets'); (3) on a
# SCHEDULED run exit 1 (deferred: sync in flight) and exit 2 (audits not
# accepted: cockpits have not consumed the cohort yet) end the job GREEN with
# a warning annotation, because they are the expected answers between a sync
# and its cockpit renders; exit 3 (refused, layout, write/readback fault) and
# every non-zero exit of a DISPATCHED run stay RED. The artifact and the job
# summary carry the exact outcome either way.
# UNCHANGED: the gates (vars.TFB_DECISION_RELEASE off => dry-run, zero writes;
# KILL sticky), the private concurrency group, the environment, the checkout
# of this workflow's ref, the env block copied from the final job, the
# supersede wiring, every acceptance rule in the script. Until the owner arms
# TFB_DECISION_RELEASE the scheduled runs are the P0-1 commit sheet's
# "zero-code observe experiment" performed automatically.
#
# VERSION 1.0.0 (2026-10-13) -- NEW WORKFLOW: review blocker 1 / P0-1 / D1
#
# WHY: since #751 the 'TFB Decision Feed' cell is downgrade-only. The sync and
# the final job can veto it but nothing can ever return it to EXECUTABLE, even
# after every strict audit passes. scripts/release_decision_feed.py v1.0.0 is
# the explicit audited release; this workflow is its only production entry.
#
# DISPATCH or SCHEDULE (v1.1.0). Inputs reach the shell through env, never inline.
#   source_run_id  the COMPLETED Advanced Sync (daily_sync.yml) run whose
#                  cohort both cockpits consumed, or 'auto' (default; the
#                  schedule always uses it). Never this run's own id.
#   mode           release = re-run the strict audits bound to source_run_id
#                  and promote (DRY-RUN report unless vars.TFB_DECISION_RELEASE
#                  is armed); sweep = retract an expired/malformed EXECUTABLE;
#                  kill = retract any EXECUTABLE now.
#
# Order of operations for a live release: sync -> cockpit refresh (receipts)
# -> this workflow -> cockpit refresh (display). The release JSON states
# display_pending_cockpit_refresh=true until the cockpits re-render.
#
# CONCURRENCY: a PRIVATE group. It deliberately does NOT join the
# tadawul-production-write-* lease: a newly queued member of that group
# cancels a pending production sync (documented in track_performance.yml).
# The script defers (exit 1, no write) while any schedule/workflow_dispatch
# run of daily_sync, page_refresh_recovery or grid_capacity_repair is not
# completed, re-probes immediately before the write, and compare-and-sets
# the slot and prior value.
# (2026-10-13 review) mode=kill shares this group: a kill dispatched while a
# release runs WAITS for it (up to the 30-minute timeout), and GitHub cancels
# a PENDING member of a group when a newer dispatch queues, so a later
# dispatch can silently cancel a queued kill. The sticky variable is what
# makes a kill robust: every run started after TFB_DECISION_RELEASE_KILL=1
# is set, whatever its mode, takes the kill branch and retracts.
#
# CHECKOUT: this workflow's own ref (github.sha), refused unless the dispatch
# ref is refs/heads/main. The release code that may write EXECUTABLE is the
# reviewed main code, not the source run's commit; the audits it runs are the
# same finalize/audit modules main ships. The commit sheet records this.
#
# ENV: the verify-final-decision-publication job env of daily_sync.yml copied
# VERBATIM (tests/test_release_decision_feed.py asserts equality), plus the
# two default-off gates. TARGET_SHEET_ID has no inputs fallback: the sheet
# is always vars.DEFAULT_SPREADSHEET_ID.
#
# ROLLBACK: delete this file (and the script). To RETRACT a live release, all
# three: (1) set vars.TFB_DECISION_RELEASE_KILL=1 (blocks later promotions;
# it is read only when a run starts and writes nothing by itself), (2)
# dispatch mode=kill, (3) read back the _Status 'TFB Decision Feed' cell and
# confirm it is NOT_ACTIONABLE (re-dispatch if the kill was cancelled or
# queued behind a release). Setting vars.TFB_DECISION_RELEASE to 0 only
# disarms future promotions; it NEVER retracts a live release.
# DT10_UPSTREAM_VERDICT=off is a cockpit BYPASS, never a kill switch.
# =============================================================================
name: Release Decision Feed (P0-1)

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Completed Advanced Sync (daily_sync.yml) run ID to release, or auto = the cohort in the Global_Markets feed (never this run)"
        required: false
        default: "auto"
        type: string
      mode:
        description: "release (dry-run unless armed) | sweep (retract expired) | kill (retract now)"
        required: true
        default: "release"
        type: choice
        options: [release, sweep, kill]
  schedule:
    # v1.1.0: after the cockpit render slots (UTC; Riyadh = UTC+3). Each run
    # is source=auto / mode=release; deferred or not-yet-consumed cohorts end
    # green with a warning, see the header. ~2 runner-minutes per slot.
    - cron: "45 0,10,17,20 * * *"   # 03:45, 13:45, 20:45, 23:45 Riyadh
    - cron: "30 5 * * *"            # 08:30 Riyadh, after the 08:07 morning render
    - cron: "45 12 * * *"           # 15:45 Riyadh, after the 15:29 render

concurrency:
  group: tfb-decision-release
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  release-decision-feed:
    name: Release decision feed
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
      TARGET_SHEET_ID: ${{ vars.DEFAULT_SPREADSHEET_ID }}
      TFB_DECISION_SOURCE_MAX_AGE_H: '30'
      TFB_DECISION_SURFACE_MAX_AGE_H: '8'
      # (2026-10-12) Owner-approved current scope: Saudi-only 255 leaders /
      # 2,474 funds. The explicit versioned scope supersedes July floor vars;
      # preserve source clocks, acquisition, names, prices and custody gates.
      TFB_EXPECTED_MIN_ROWS_MARKET_LEADERS: ${{ vars.EXPECTED_MIN_ROWS_MARKET_LEADERS || '255' }}
      TFB_EXPECTED_MIN_ROWS_GLOBAL_MARKETS: ${{ vars.EXPECTED_MIN_ROWS_GLOBAL_MARKETS || '6512' }}
      TFB_EXPECTED_MIN_ROWS_COMMODITIES_FX: ${{ vars.EXPECTED_MIN_ROWS_COMMODITIES_FX || '453' }}
      TFB_EXPECTED_MIN_ROWS_MUTUAL_FUNDS: ${{ vars.EXPECTED_MIN_ROWS_MUTUAL_FUNDS || '2474' }}
      # (2026-10-13) P0-1 gates, both default OFF. Release off => dry-run
      # report only, zero writes. Kill on => never promote; retract.
      TFB_DECISION_RELEASE: ${{ vars.TFB_DECISION_RELEASE || '0' }}
      TFB_DECISION_RELEASE_KILL: ${{ vars.TFB_DECISION_RELEASE_KILL || '0' }}
    steps:
      - name: Validate dispatch inputs
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id || 'auto' }}
          RELEASE_MODE: ${{ inputs.mode || 'release' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::The decision-feed release runs only from refs/heads/main (got $GITHUB_REF)."
            exit 3
          fi
          if [[ ! "$SOURCE_RUN_ID" =~ ^(auto|[1-9][0-9]*)$ ]]; then
            echo "::error::source_run_id must be one positive run ID or auto."
            exit 3
          fi
          if [[ "$SOURCE_RUN_ID" == "$GITHUB_RUN_ID" ]]; then
            echo "::error::source_run_id is this release run; pass the completed sync run ID."
            exit 3
          fi
          case "$RELEASE_MODE" in
            release|sweep|kill) ;;
            *) echo "::error::mode must be release, sweep or kill."; exit 3 ;;
          esac
          if [[ "$EVENT_NAME" == "schedule" && ( "$RELEASE_MODE" != "release" || "$SOURCE_RUN_ID" != "auto" ) ]]; then
            echo "::error::a scheduled run is always mode=release with source_run_id=auto."
            exit 3
          fi

      - name: Checkout this workflow's ref
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.render.txt
            requirements.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          if [[ -f requirements.render.txt ]]; then
            python -m pip install -r requirements.render.txt
          else
            python -m pip install -r requirements.txt
          fi

      - name: Configure release-audit credentials
        env:
          SECRET_CREDS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          SECRET_CREDS_B64: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS_B64 }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os
          from pathlib import Path
          if not os.environ.get('TARGET_SHEET_ID', '').strip():
              raise SystemExit('::error::Spreadsheet ID is missing.')
          raw = os.environ.get('SECRET_CREDS', '')
          if not raw:
              try:
                  raw = base64.b64decode(os.environ.get('SECRET_CREDS_B64', ''), validate=True).decode()
              except Exception:
                  raise SystemExit('::error::Google Sheets credentials are invalid.')
          try:
              credentials = json.loads(raw)
              valid = isinstance(credentials, dict) and credentials.get('type') == 'service_account'
              valid = valid and credentials.get('client_email') and credentials.get('private_key')
              if not valid:
                  raise ValueError('invalid service-account structure')
          except Exception:
              raise SystemExit('::error::Google Sheets credentials are invalid.')
          path = Path(os.environ['RUNNER_TEMP']) / 'final_publication_credentials.json'
          fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
          os.fchmod(fd, 0o600)
          with os.fdopen(fd, 'w') as handle:
              handle.write(raw)
          print('::add-mask::' + credentials['client_email'])
          with open(os.environ['GITHUB_ENV'], 'a') as handle:
              handle.write('GOOGLE_APPLICATION_CREDENTIALS=' + str(path) + '\n')
          PY

      - name: Release or retract the decision feed
        id: release
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id || 'auto' }}
          RELEASE_MODE: ${{ inputs.mode || 'release' }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ github.token }}
          # v1.2.0: release_decision_feed 1.3.0 render settle (default OFF).
          TFB_RELEASE_RENDER_SETTLE: ${{ vars.TFB_RELEASE_RENDER_SETTLE || '0' }}
          # v1.2.1 (authored as v1.1.1): scheduled-slot deferral (release_decision_feed.py v1.3.1).
          TFB_RELEASE_INFLIGHT_DEFER: ${{ vars.TFB_RELEASE_INFLIGHT_DEFER || '0' }}
        run: |
          set -euo pipefail
          code=0
          python scripts/release_decision_feed.py \
            --sheet-id "$TARGET_SHEET_ID" \
            --source-run-id "$SOURCE_RUN_ID" \
            --mode "$RELEASE_MODE" \
            --json-out release_decision_feed.json || code=$?
          echo "release_exit=$code" >> "$GITHUB_OUTPUT"
          if [[ "$code" -ne 0 ]]; then
            # v1.1.0: on the SCHEDULE, a deferral (1: a production writer is
            # in flight) or a not-accepted audit (2: the cockpits have not
            # consumed this cohort yet, or the render is older than the
            # window) is the expected answer between a sync and its cockpit
            # renders; the next slot retries. Refusals and faults (3) and
            # every dispatched non-zero exit stay red.
            if [[ "$EVENT_NAME" == "schedule" && ( "$code" -eq 1 || "$code" -eq 2 ) ]]; then
              echo "::warning::Scheduled decision feed attempt: no release this slot (exit $code); see the artifact and the summary."
              exit 0
            fi
            echo "::error::Decision feed release did not complete (exit $code); see the artifact."
            exit "$code"
          fi

      - name: Publish release summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          armed = os.environ.get('TFB_DECISION_RELEASE', '0').strip().lower() in {'1', 'true', 'yes', 'on'}
          killed = os.environ.get('TFB_DECISION_RELEASE_KILL', '0').strip().lower() in {'1', 'true', 'yes', 'on'}
          banner = 'KILL ACTIVE' if killed else ('ARMED' if armed else 'DRY-RUN (TFB_DECISION_RELEASE off)')
          path = Path('release_decision_feed.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as handle:
              handle.write('## Decision feed release: ' + banner + '\n\n')
              if not path.exists():
                  handle.write('The release did not complete. No feed value was promoted.\n')
              else:
                  result = json.loads(path.read_text())
                  handle.write('| Check | Result |\n|---|---|\n')
                  for key in ('mode', 'exit_code', 'outcome', 'source_mode', 'source_run_id', 'prior_class',
                              'accepted', 'reasons', 'audit_exit_codes', 'blockers',
                              'deferred', 'released', 'expires', 'downgrade', 'would_downgrade',
                              'display_pending_cockpit_refresh'):
                      handle.write('| ' + key + ' | ' + json.dumps(result.get(key)) + ' |\n')
                  if 'render_settle' in result:
                      # v1.2.0: only when release_decision_feed 1.3.0 settled a render.
                      handle.write('| render_settle | ' + json.dumps(result['render_settle']) + ' |\n')
                  handle.write('\nA released value is shown on the board only after both cockpits re-render.\n')
          PY

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-decision-feed-${{ github.run_id }}
          path: release_decision_feed.json
          retention-days: 30
          if-no-files-found: warn

      - name: Secure credential cleanup
        if: always()
        run: |
          CREDS_PATH="$RUNNER_TEMP/final_publication_credentials.json"
          if [[ -f "$CREDS_PATH" ]]; then
            shred -u -z "$CREDS_PATH" 2>/dev/null || rm -f "$CREDS_PATH"
          fi
