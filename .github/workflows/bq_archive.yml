# =============================================================================
# 🗄️ BigQuery Archive — read-only daily copy of the decision workbook
# =============================================================================
# 2026-10-27 (program register C8, Phase 1): scripts/archive_to_bigquery.py
#       v1.0.0 reads the learning tabs (Top_10_Investments, _Selection_Log,
#       _Shadow_Rank_Log, _Board_Scorecard, Calendar_Events, Signal_History,
#       Performance_Log, My_Portfolio, Portfolio_Decision, _Run_Log) and loads
#       one partition per UTC day into BigQuery dataset tfb_archive
#       (project-2e3530e6-2311-4aa3-b36, US). WRITE_TRUNCATE per day: a re-run
#       replaces only that day. NOTHING is written to the workbook and the live
#       system never reads BigQuery.
# AUTH: the sync's service account (GOOGLE_SHEETS_CREDENTIALS) with BigQuery
#       Data Editor + BigQuery Job User granted on the project by the owner.
# GATE: armed here (TFB_BQ_ARCHIVE defaults to on); kill with the repository
#       Variable TFB_BQ_ARCHIVE=off. TFB_BQ_PROJECT / TFB_BQ_DATASET Variables
#       override the defaults below.
# SCHEDULE: 23:05 UTC daily (after the US close and the 22:23 UTC nightly
#       board scorecard). A manual dispatch is a dry run unless write=true.
# =============================================================================
name: 🗄️ BigQuery Archive

on:
  # Opt-in only. The capture script independently proves full-source readiness;
  # success/failure of this triggering workflow is never an acceptance receipt.
  workflow_run:
    workflows: ["🏦 Tadawul Dashboard Advanced Sync"]
    types: [completed]
  schedule:
    # 23:05 UTC == 02:05 Asia/Riyadh (next calendar day), daily.
    - cron: "5 23 * * *"
  workflow_dispatch:
    inputs:
      write:
        description: "Load into BigQuery? (default: dry-run — reads the tabs and prints what it would load)"
        required: false
        default: false
        type: boolean
      tabs:
        description: "Comma-separated tab names (blank = the standard list)"
        required: false
        default: ""
        type: string
      staging_dataset:
        description: "Optional isolated tfb_archive_staging_* dataset; enables coherent mode only for this dispatch"
        required: false
        default: ""
        type: string
      source_run_id:
        description: "Completed production source run for a real coherent capture (blank = current source)"
        required: false
        default: ""
        type: string
      staging_checks:
        description: "Run synthetic atomic/replay/rollback/diagnostic checks in the isolated dataset (requires staging_dataset)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: "3.11"
  PYTHONUNBUFFERED: 1
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  archive:
    name: 🗄️ Archive the workbook to BigQuery
    if: >-
      ${{ github.event_name != 'workflow_run' || (
        contains(fromJSON('["1", "true", "yes", "on"]'), vars.TFB_BQ_AFTER_SYNC) &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        contains(fromJSON('["schedule", "workflow_dispatch"]'), github.event.workflow_run.event) &&
        contains(fromJSON('["success", "failure"]'), github.event.workflow_run.conclusion)
      ) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    # Job-level: skipped PR/push completions never enter this queue. This group
    # is private to archive writers and never joins the production sync lease.
    concurrency:
      group: tfb-bigquery-archive-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: 🐍 Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "google-auth==2.49.2" "requests==2.33.1"

      - name: Install strict audit dependencies for coherent capture
        if: contains(fromJSON('["1", "true", "yes", "on"]'), vars.TFB_BQ_AFTER_SYNC) || github.event.inputs.staging_dataset != ''
        run: python -m pip install -r requirements.render.txt

      - name: 🔎 Resolve spreadsheet id
        id: sheet
        env:
          VAR_SHEET: ${{ vars.DEFAULT_SPREADSHEET_ID }}
        run: |
          SID="${VAR_SHEET:-}"
          if [[ -z "$SID" ]]; then
            echo "::error::Spreadsheet ID empty. Set repository variable DEFAULT_SPREADSHEET_ID."
            exit 1
          fi
          echo "sid=$SID" >> "$GITHUB_OUTPUT"

      - name: 🗄️ Run the archive
        env:
          PYTHONPATH: ${{ github.workspace }}
          DEFAULT_SPREADSHEET_ID: ${{ steps.sheet.outputs.sid }}
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS != '' && secrets.GOOGLE_SHEETS_CREDENTIALS || secrets.GOOGLE_SHEETS_CREDENTIALS_B64 }}
          TFB_BQ_ARCHIVE: ${{ vars.TFB_BQ_ARCHIVE || 'on' }}
          TFB_BQ_PROJECT: ${{ vars.TFB_BQ_PROJECT || 'project-2e3530e6-2311-4aa3-b36' }}
          TFB_BQ_DATASET: ${{ vars.TFB_BQ_DATASET || 'tfb_archive' }}
          TFB_BQ_LOCATION: "US"
          TFB_BQ_AFTER_SYNC: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.staging_dataset != '' && 'on' || vars.TFB_BQ_AFTER_SYNC || 'off' }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.inputs.source_run_id || github.event.workflow_run.id || 'auto' }}
          STAGING_DATASET: ${{ github.event.inputs.staging_dataset }}
          STAGING_CHECKS: ${{ github.event.inputs.staging_checks }}
          INPUT_TABS: ${{ github.event.inputs.tabs }}
        run: |
          set -euo pipefail
          if [[ -n "${STAGING_DATASET:-}" ]]; then
            if [[ ! "$STAGING_DATASET" =~ ^tfb_archive_staging_[A-Za-z0-9_]{1,128}$ ]]; then
              echo "::error::Staging requires a separate tfb_archive_staging_* dataset."
              exit 2
            fi
            export TFB_BQ_DATASET="$STAGING_DATASET"
          elif [[ "${STAGING_CHECKS:-false}" == "true" ]]; then
            echo "::error::Synthetic staging checks cannot target the production dataset."
            exit 2
          fi
          # Schedule always writes; a manual dispatch writes ONLY when
          # write=true was explicitly ticked (dry run otherwise).
          MODE="--write"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.write }}" != "true" ]]; then
            MODE="--dry-run"
            echo "Dry-run mode — reading the tabs, loading nothing (tick write=true to load)."
          fi
          if [[ "${STAGING_CHECKS:-false}" == "true" ]]; then
            CHECK_MODE=""
            [[ "$MODE" == "--write" ]] && CHECK_MODE="--write"
            python scripts/validate_coherent_archive_staging.py $CHECK_MODE
            exit "$?"
          fi
          case "${TFB_BQ_AFTER_SYNC}" in
            1|true|yes|on)
              # While armed, nightly and manual writes use the SAME coherent
              # publisher; no legacy writer can overwrite its generation.
              # All-tabs only: partial manual scopes are refused by the script.
              COHERENT_MODE=""
              [[ "$MODE" == "--write" ]] && COHERENT_MODE="--write"
              python scripts/archive_coherent_snapshot.py $COHERENT_MODE \
                --source-run "$SOURCE_RUN" --tabs "${INPUT_TABS:-}"
              ;;
            *) python scripts/archive_to_bigquery.py $MODE --tabs "${INPUT_TABS:-}" ;;
          esac

      - name: Upload coherent capture receipt (no raw grids)
        if: always() && (contains(fromJSON('["1", "true", "yes", "on"]'), vars.TFB_BQ_AFTER_SYNC) || github.event.inputs.staging_dataset != '')
        uses: actions/upload-artifact@v7
        with:
          name: coherent-archive-${{ github.run_id }}
          path: |
            coherent_archive.json
            coherent_staging_validation.json
          if-no-files-found: warn
          retention-days: 14
