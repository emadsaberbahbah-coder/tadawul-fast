# =============================================================================
# 🎓 Learning Watch - every learning record in BigQuery, read every day
# -----------------------------------------------------------------------------
# VERSION 1.0.0 (2026-11-24)
#
# WHY: owner, 24 Nov 2026 13:07 Riyadh (in Arabic): how can BigQuery be used
# more, faster and more accurately? BigQuery holds 19 learning records, each
# with a fixed reading, and none is seen until someone opens it. This job
# reads them all every day, stores the day's readings and lists what is
# proven, what works against, and what changed since the last day.
#
# WHEN: after the Exit Plan workflow, which the workbook dispatches every hour
# (apps_script/29_Page_Refresh_Dispatch.gs, :35 Riyadh), when the UTC hour is
# one of TFB_LEARNING_WATCH_CHAIN_HOURS (repository Variable; default "9" =
# 12:35 Riyadh, after the night's collectors; "off" = no chained run). No
# cron: GitHub's schedule starts this repository's runs hours late. A manual
# dispatch writes only with write=true.
#
# READS: the 19 learning views (SELECT only). WRITES: BigQuery
# learning_watch_log (today's partition) and the workbook tab Learning_Watch.
# OBSERVE ONLY: nothing changes a recommendation, a gate or an order.
# Rollback: repository Variable TFB_LEARNING_WATCH=off.
# =============================================================================
name: 🎓 Learning Watch
run-name: ${{ github.event_name == 'workflow_dispatch' && format('{0} (dispatch, write={1})', github.workflow, inputs.write) || github.workflow }}

on:
  workflow_run:
    workflows: ["🎯 Exit Plan"]
    types: [completed]
  workflow_dispatch:
    inputs:
      write:
        description: "Load BigQuery and write the page (unticked = dry run)"
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: "3.11"
  PYTHONUNBUFFERED: 1
  TZ: Asia/Riyadh
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  due:
    name: 🕒 Is a chained run due this hour?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.due.outputs.run }}
    steps:
      - name: 🕒 Is a chained run due this hour?
        id: due
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHAIN_HOURS: ${{ vars.TFB_LEARNING_WATCH_CHAIN_HOURS || '9' }}
        run: |
          # A run chained to the hourly Exit Plan works only in the listed UTC hours; a dispatch always.
          # "off" (or no number) = no chained run.
          RUN=true
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            HOUR=$((10#$(date -u +%H)))
            RUN=false
            for h in $CHAIN_HOURS; do
              if [[ "$h" =~ ^[0-9]+$ ]] && (( 10#$h == HOUR )); then RUN=true; fi
            done
            echo "Chained run at UTC hour $HOUR (hours: $CHAIN_HOURS): run=$RUN"
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

  watch:
    # The gate is its own job, so a chained run that is not due never enters this job's
    # concurrency group and cannot cancel or replace a run that publishes.
    needs: due
    if: needs.due.outputs.run == 'true'
    concurrency:
      group: tfb-learning-watch
      cancel-in-progress: false
    name: 🎓 Read every learning record, publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v6

      - name: 🐍 Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install dependencies
        run: python -m pip install --quiet gspread==6.2.1 "google-auth==2.49.2" "requests==2.33.1"

      - name: 🔎 Resolve spreadsheet id
        id: sheet
        env:
          VAR_SHEET: ${{ vars.DEFAULT_SPREADSHEET_ID }}
        run: |
          SID="${VAR_SHEET:-}"
          if [[ -z "$SID" ]]; then
            echo "::error::Spreadsheet ID empty. Set repository variable DEFAULT_SPREADSHEET_ID."
            exit 1
          fi
          echo "sid=$SID" >> "$GITHUB_OUTPUT"

      - name: 🎓 Run the learning watch
        env:
          PYTHONPATH: ${{ github.workspace }}
          DEFAULT_SPREADSHEET_ID: ${{ steps.sheet.outputs.sid }}
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS != '' && secrets.GOOGLE_SHEETS_CREDENTIALS || secrets.GOOGLE_SHEETS_CREDENTIALS_B64 }}
          TFB_BQ_PROJECT: ${{ vars.TFB_BQ_PROJECT || 'project-2e3530e6-2311-4aa3-b36' }}
          TFB_BQ_DATASET: ${{ vars.TFB_BQ_DATASET || 'tfb_archive' }}
          TFB_BQ_LOCATION: ${{ vars.TFB_BQ_LOCATION || 'US' }}
          TFB_LEARNING_WATCH: ${{ vars.TFB_LEARNING_WATCH || 'on' }}
          EVENT_NAME: ${{ github.event_name }}
          IN_WRITE: ${{ inputs.write }}
        run: |
          ARGS=()
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$IN_WRITE" != "true" ]]; then
            ARGS+=(--dry-run)
            echo "Dry-run mode - reading the records, writing nothing (tick write=true to write)."
          fi
          python scripts/learning_watch.py "${ARGS[@]}"
