# =============================================================================
# Verified Name Label Renewal - .github/workflows/name_label_renewal.yml
# =============================================================================
# VERSION 1.1.1 (2026-10-24) -- EXPIRED VS DUE-SOON RECOVERY EVIDENCE
# Checks stay red while authority evidence is expired/due. An always-running
# summary identifies each binding and distinguishes partial manual renewals
# from complete renewal. No expiry or held binding is altered by reporting.
# VERSION 1.1.0 (2026-10-21) -- RENEW PUBLISHES A REVIEW BRANCH
#
# WHY (2026-10-21): 1.0.0 left the renewed registry only in the run's
# artifact, so turning a renewal into a reviewed PR needed someone to
# download the artifact by hand. Nothing did: the 39 Mutual_Funds captions
# that expired on 19 Oct 12:31 UTC were still expired on 21 Oct, keeping
# the Mutual_Funds Name floor below 99% (a decision-feed release blocker),
# and 67 Global_Markets captions expired on 21 Oct 07:44 UTC.
# WHAT: a second job, publish-renewal, runs only on a renew dispatch with
# publish_branch=true (the default). It merges the renewed registry from the
# artifact into the DEFAULT-BRANCH registry binding by binding
# (renew_verified_name_labels 1.1.0 --apply-renewal: only an unchanged caption
# with a newer review takes the renewed copy, so an artifact built from another
# revision cannot revert or add a binding), validates the result with the
# production loader, and when it differs commits it to a NEW branch
# name-label-renewal/<run_id> and opens a DRAFT pull request against main.
# It never pushes to main: the renewed file still reaches main only through
# a reviewed PR. Write permissions (contents, pull-requests) are granted to
# that job alone; the scheduled check and the renew job stay read-only.
# If the repository forbids Actions-created PRs, the branch is still pushed
# and the run says so (open the PR from the branch).
# The sec.gov contact is read from the repository SECRET TFB_SEC_USER_AGENT
# first (masked in logs; this repository is public), then the 1.0.0 Variable.
# Rollback: dispatch with publish_branch=false (1.0.0 behaviour).
#
# VERSION 1.0.0 (2026-10-20) -- NEW WORKFLOW
#
# WHY: data/verified_name_labels.json captions expire seven days after review.
# On 19 Oct the 39 Mutual_Funds captions expired at 12:31 UTC and the 18:44 UTC
# Advanced Sync (#4945) failed the coverage audit on the Mutual_Funds Name floor
# (97.98% < 99%), adding coverage_failed to the decision-feed blockers. 67
# Global_Markets captions expire on 21 Oct 07:44 UTC. Nothing renewed them.
# WHAT: two jobs, both read-only towards the workbook and the repository.
#   check  (schedule + dispatch, no network): fails RED when any binding
#          expires within 48 h, so the cliff is visible two days ahead.
#   renew  (dispatch only): scripts/renew_verified_name_labels.py re-captures
#          every public source, re-checks each caption, validates the output
#          with the production loader and uploads the renewed registry and its
#          report as an artifact. It never pushes; the renewed file reaches
#          main only through a reviewed PR.
# sec.gov refuses requests without a declared contact User-Agent; set the
# repository variable TFB_SEC_USER_AGENT (e.g. "Name contact@example.com").
# Without it every binding that cites sec.gov is held, never guessed.
# =============================================================================
name: Verified Name Label Renewal

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check (expiry window only) | renew (re-capture sources, upload renewed registry)"
        required: true
        default: "renew"
        type: choice
        options: [check, renew]
      publish_branch:
        description: "renew only: commit the renewed registry to a review branch and open a draft PR (never main)"
        required: false
        default: true
        type: boolean
  schedule:
    - cron: "15 4 * * *"   # 07:15 Riyadh, daily expiry check

concurrency:
  group: tfb-name-label-renewal
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  name-label-renewal:
    name: Name label ${{ github.event_name == 'schedule' && 'check' || inputs.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      MODE: ${{ github.event_name == 'schedule' && 'check' || inputs.mode }}
      # 1.1.0: a repository SECRET is preferred (this repository is public and a
      # secret is masked in logs); the 1.0.0 repository Variable still works.
      TFB_SEC_USER_AGENT: ${{ secrets.TFB_SEC_USER_AGENT || vars.TFB_SEC_USER_AGENT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run
        run: |
          set -uo pipefail
          code=0
          if [[ "$MODE" == "check" ]]; then
            python scripts/renew_verified_name_labels.py --check --report renewal_report.json || code=$?
          else
            if [[ -z "${TFB_SEC_USER_AGENT// }" ]]; then
              echo "::warning::TFB_SEC_USER_AGENT (repository secret or variable) is not set; bindings citing sec.gov will be held."
            fi
            python scripts/renew_verified_name_labels.py \
              --out renewed_verified_name_labels.json \
              --report renewal_report.json || code=$?
          fi
          {
            echo "## Verified name labels ($MODE)"
            echo
            echo '```json'
            head -c 6000 renewal_report.json 2>/dev/null || echo '{}'
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$code" -eq 1 && "$MODE" == "renew" ]]; then
            echo "::warning::Some bindings were held; see the report. The renewed file still contains them unchanged."
            code=0
          fi
          exit "$code"

      - name: Explain expired or held authority evidence
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.renew_verified_name_labels import render_step_summary
          report = Path('renewal_report.json')
          if report.is_file():
              text = render_step_summary(json.loads(report.read_text()))
          else:
              text = '# Verified name authority check\n\nUNKNOWN: no report was produced. Inspect the failed step; do not extend expiry without re-captured authority evidence.\n'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write(text)
          PY

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: name-label-renewal-${{ github.run_id }}
          path: |
            renewal_report.json
            renewed_verified_name_labels.json
          retention-days: 14
          if-no-files-found: warn

  # 1.1.0: the only job with write permissions; renew dispatches only.
  publish-renewal:
    name: Publish renewed registry to a review branch
    needs: name-label-renewal
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'renew' && inputs.publish_branch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      # The review branch is always cut from the default branch, so its PR
      # carries the registry change only, whichever ref was dispatched.
      - name: Checkout the default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Download the renewed registry
        uses: actions/download-artifact@v8
        with:
          name: name-label-renewal-${{ github.run_id }}
          path: renewal_out

      - name: Merge the renewal into the default branch, commit to a review branch, open a draft PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NEW=renewal_out/renewed_verified_name_labels.json
          REG=data/verified_name_labels.json
          if [[ ! -s "$NEW" ]]; then
            echo "::warning::No renewed registry in the artifact; nothing to publish."
            exit 0
          fi
          # renew_verified_name_labels 1.1.0 --apply-renewal: a binding takes its
          # renewed copy only when its caption is unchanged on this default-branch
          # revision and the review is newer, so an artifact built from another
          # revision can never revert or add a binding. The merged file passes the
          # production loader before it is written.
          code=0
          python scripts/renew_verified_name_labels.py --registry "$REG" \
            --apply-renewal "$NEW" --report apply_report.json || code=$?
          if [[ "$code" -eq 3 ]]; then
            echo "::warning::No binding of the default branch was renewed; nothing to publish."
            exit 0
          fi
          if [[ "$code" -ne 0 ]]; then
            exit "$code"
          fi
          COUNTS=$(python - <<'PY'
          import json
          r = json.load(open("apply_report.json"))
          n = lambda v: len(v) if isinstance(v, (list, dict)) else int(v or 0)
          print("%d %d" % (n(r.get("applied")), n(r.get("kept"))))
          PY
          )
          read -r APPLIED KEPT <<< "$COUNTS"
          if git diff --quiet -- "$REG"; then
            echo "::notice::The merged registry is identical to the default branch; nothing to publish."
            exit 0
          fi
          BR="name-label-renewal/${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BR"
          git add "$REG"
          git commit -q -m "Renew verified name captions: ${APPLIED} renewed, ${KEPT} kept (run ${GITHUB_RUN_ID})"
          git push -q origin "$BR"
          echo "::notice::Pushed ${BR} (${APPLIED} renewed, ${KEPT} kept)."
          {
            echo "Renewal run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "- renewed: ${APPLIED}"
            echo "- kept unchanged (held, caption changed upstream, or not newer): ${KEPT}"
            echo
            echo "Every renewed binding was re-captured from its own public sources and re-checked by"
            echo "scripts/renew_verified_name_labels.py, then merged binding by binding into this default"
            echo "branch revision (--apply-renewal): only reviewed_at_utc, expires_at_utc, source receipts,"
            echo "directory_creation_time and the review digest change. The file passed the production"
            echo "loader. Review, then merge; the next sync fills the blank Names again."
          } > pr_body.md
          if gh pr create --draft --base "${{ github.event.repository.default_branch }}" --head "$BR" \
               --title "Renew verified name captions (${APPLIED} renewed, ${KEPT} kept)" \
               --body-file pr_body.md; then
            echo "::notice::Draft PR opened from ${BR}."
          else
            echo "::warning::Branch ${BR} is pushed but the PR could not be opened (the repository may forbid Actions-created PRs); open it from the branch."
          fi
