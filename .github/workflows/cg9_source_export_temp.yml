name: TEMP CG9 Source Export

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/cg9_source_export_temp.yml"
      - "apps_script/11_Manual_Refresh_Coordinator.gs"
      - "tests/test_manual_refresh_priority_contract.py"
      - "docs/MANUAL_REFRESH_PRIORITY_V1.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Collect CG9 source
        run: |
          set -euo pipefail
          mkdir -p cg9-source/apps_script cg9-source/tests cg9-source/docs
          cp apps_script/11_Manual_Refresh_Coordinator.gs cg9-source/apps_script/
          cp tests/test_manual_refresh_priority_contract.py cg9-source/tests/
          cp docs/MANUAL_REFRESH_PRIORITY_V1.md cg9-source/docs/
          python - <<'PY'
          import json, pathlib, re
          path = pathlib.Path('apps_script/11_Manual_Refresh_Coordinator.gs')
          text = path.read_text(encoding='utf-8')
          funcs = re.findall(r'^function\s+([A-Za-z0-9_]+)\s*\(', text, re.M)
          pathlib.Path('cg9-source/function_inventory_base.json').write_text(
              json.dumps({'count': len(funcs), 'functions': funcs}, indent=2),
              encoding='utf-8'
          )
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: cg9-source-${{ github.run_id }}
          path: cg9-source
          retention-days: 1
