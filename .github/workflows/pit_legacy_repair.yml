# =============================================================================
# 🧹 PIT legacy repair - repair_pit_legacy_rows.py 1.0.0
# VERSION 1.0.0 (2026-11-25) - NEW WORKFLOW
# WHY (external audit of 25 Nov, P0 research): _PIT_Fundamentals still holds 78
#   timestamp-shaped values in its reliability/diagnostic columns and 11
#   non-instrument label rows from the 16->24 header migration of 22-28 Jul.
#   The repair planner (scripts/repair_pit_legacy_rows.py, 11 Oct) was built
#   for exactly these rows but had no runner, so it never ran.
# WHAT: dispatch only (no schedule).
#   scan  = read-only: print the plan counts (realigned / deleted / anomalies).
#   apply = first copy _PIT_Fundamentals to a hidden backup tab in the same
#           workbook (_PIT_Backup_YYYYMMDD; never overwritten), then run
#           --apply. The script refuses any anomaly, more than 78 realigns or
#           11 deletions, or a grid that changed between its two reads, and
#           appends one [PIT-REPAIR] line to _Run_Log.
# LOGS: counts only. No symbol, value or amount is printed.
# ROLLBACK: copy the backup tab's cells back over _PIT_Fundamentals.
# =============================================================================
name: 🧹 PIT legacy repair

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "scan = print the plan counts only; apply = back up the tab, then repair"
        type: choice
        options: [scan, apply]
        default: scan

concurrency:
  group: tfb-pit-legacy-repair
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: "3.11"
  PYTHONUNBUFFERED: 1
  TZ: Asia/Riyadh
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  pit_repair:
    name: 🧹 Scan or repair the PIT legacy rows
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v6

      - name: 🐍 Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install dependencies
        run: python -m pip install --quiet gspread==6.2.1 google-auth requests

      - name: 🔎 Resolve spreadsheet id
        id: sheet
        env:
          VAR_SHEET: ${{ vars.DEFAULT_SPREADSHEET_ID }}
        run: |
          SID="${VAR_SHEET:-}"
          if [[ -z "$SID" ]]; then
            echo "::error::Spreadsheet ID empty. Set repository variable DEFAULT_SPREADSHEET_ID."
            exit 1
          fi
          echo "sid=$SID" >> "$GITHUB_OUTPUT"

      - name: 🔎 Scan (read-only)
        env:
          PYTHONPATH: ${{ github.workspace }}
          DEFAULT_SPREADSHEET_ID: ${{ steps.sheet.outputs.sid }}
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS != '' && secrets.GOOGLE_SHEETS_CREDENTIALS || secrets.GOOGLE_SHEETS_CREDENTIALS_B64 }}
        run: python scripts/repair_pit_legacy_rows.py --scan

      - name: 💾 Back up _PIT_Fundamentals (apply only)
        if: ${{ inputs.mode == 'apply' }}
        env:
          PYTHONPATH: ${{ github.workspace }}
          DEFAULT_SPREADSHEET_ID: ${{ steps.sheet.outputs.sid }}
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS != '' && secrets.GOOGLE_SHEETS_CREDENTIALS || secrets.GOOGLE_SHEETS_CREDENTIALS_B64 }}
        run: python scripts/backup_sheet_tab.py --tab _PIT_Fundamentals --prefix _PIT_Backup_

      - name: 🧹 Repair (apply only)
        if: ${{ inputs.mode == 'apply' }}
        env:
          PYTHONPATH: ${{ github.workspace }}
          DEFAULT_SPREADSHEET_ID: ${{ steps.sheet.outputs.sid }}
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS != '' && secrets.GOOGLE_SHEETS_CREDENTIALS || secrets.GOOGLE_SHEETS_CREDENTIALS_B64 }}
        run: python scripts/repair_pit_legacy_rows.py --apply
