name: Apply request-scoped US alias fix (PR)

on:
  pull_request:
    paths:
      - 'scripts/apply_request_scoped_us_alias_fix.py'
      - '.github/workflows/apply_request_scoped_us_alias_fix_pr.yml'

permissions:
  contents: write

concurrency:
  group: apply-request-scoped-us-alias-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'perf/python-batch-concurrency-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 1
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Align assertion with current runner shape
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_request_scoped_us_alias_fix.py')
          text = path.read_text(encoding='utf-8')
          old = '''        2,
                  label="sequential batch request indexes",
          '''
          new = '''        1,
                  label="sequential batch request indexes",
          '''
          if text.count(old) != 1:
              raise SystemExit('expected one replace-count assertion block')
          text = text.replace(old, new, 1)
          old = '''    if count != 2:
                  raise RuntimeError(
                      f"sequential response resolver: expected 2 matches, found {count}"
                  )
          '''
          new = '''    if count != 1:
                  raise RuntimeError(
                      f"sequential response resolver: expected 1 match, found {count}"
                  )
          '''
          if text.count(old) != 1:
              raise SystemExit('expected one sequential-regex assertion block')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply assertion-heavy transformer
        run: python scripts/apply_request_scoped_us_alias_fix.py

      - name: Compile patched files
        run: |
          python -m py_compile \
            scripts/run_dashboard_sync.py \
            scripts/concurrent_batch_fetch.py \
            tests/test_concurrent_batch_fetch.py \
            tests/test_critical_symbol_identity.py

      - name: Run focused regression tests
        run: |
          python -m pip install -q pytest httpx
          PYTHONPATH="$GITHUB_WORKSPACE" python -m unittest \
            tests/test_concurrent_batch_fetch.py \
            tests/test_critical_symbol_identity.py \
            tests/test_provider_symbol_recovery.py \
            tests/test_backend_symbol_capabilities.py \
            -v

      - name: Commit patched sources
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            scripts/run_dashboard_sync.py \
            scripts/concurrent_batch_fetch.py \
            tests/test_concurrent_batch_fetch.py \
            tests/test_critical_symbol_identity.py; then
            echo 'No source changes produced.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/run_dashboard_sync.py \
            scripts/concurrent_batch_fetch.py \
            tests/test_concurrent_batch_fetch.py \
            tests/test_critical_symbol_identity.py
          git commit -m 'fix: accept request-scoped US suffix response aliases'
          git push origin "HEAD:${HEAD_BRANCH}"
