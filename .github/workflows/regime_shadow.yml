# =============================================================================
# 🧭 Regime Shadow - the shadow regime rule's label of each close, frozen once
# -----------------------------------------------------------------------------
# VERSION 1.0.0 (2026-11-28)
#
# WHY: week plan of 23 Nov 2026, package 6 (the audit's bull / choppy /
# risk-off regime and TFB's adverse-state count as one shadow rule; exit
# test "regime labels are logged daily"). v_regime_shadow recomputes every
# label from an archive that is reloaded every night, so a label read later
# can differ from the label given on the day. The rule was fixed on 28 Nov
# 2026; its forward record starts with the next close.
#
# WHEN: after every run of the BigQuery Symbol Deep Data workflow (the bars
# behind the breadth) and of the BigQuery Market Series workflow (the index
# closes), whatever its result - a run with nothing new freezes nothing. No
# cron: GitHub's schedule starts this repository's runs hours late. A manual
# dispatch is a dry run unless write=true.
#
# READS: v_regime_shadow, the archived index closes and the frozen keys
# (SELECT only). WRITES: BigQuery regime_shadow_log (append-only, one
# partition per close date). Nothing reads it yet; nothing changes a
# recommendation, a gate or an order. Logs: market, date, label and its
# reasons - never a symbol.
# Rollback: repository Variable TFB_REGIME_SHADOW=off.
# =============================================================================
name: 🧭 Regime Shadow
run-name: ${{ github.event_name == 'workflow_dispatch' && format('{0} (dispatch, write={1})', github.workflow, inputs.write) || github.workflow }}

on:
  workflow_run:
    workflows: ["🔬 BigQuery Symbol Deep Data", "🌍 BigQuery Market Series"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      write:
        description: "Freeze the final closes' labels into BigQuery (unticked = dry run)"
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: "3.11"
  PYTHONUNBUFFERED: 1
  TZ: Asia/Riyadh
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  freeze:
    name: 🧭 Freeze the final closes' labels
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: tfb-regime-shadow
      cancel-in-progress: false
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v6

      - name: 🐍 Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install dependencies
        run: python -m pip install --quiet "google-auth==2.49.2" "requests==2.33.1"

      - name: 🧭 Freeze the labels
        env:
          PYTHONPATH: ${{ github.workspace }}
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS != '' && secrets.GOOGLE_SHEETS_CREDENTIALS || secrets.GOOGLE_SHEETS_CREDENTIALS_B64 }}
          TFB_BQ_PROJECT: ${{ vars.TFB_BQ_PROJECT || 'project-2e3530e6-2311-4aa3-b36' }}
          TFB_BQ_DATASET: ${{ vars.TFB_BQ_DATASET || 'tfb_archive' }}
          TFB_BQ_LOCATION: ${{ vars.TFB_BQ_LOCATION || 'US' }}
          TFB_REGIME_SHADOW: ${{ vars.TFB_REGIME_SHADOW || 'observe' }}
          EVENT_NAME: ${{ github.event_name }}
          IN_WRITE: ${{ inputs.write }}
        run: |
          ARGS=()
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$IN_WRITE" != "true" ]]; then
            ARGS+=(--dry-run)
            echo "Dry-run mode - reading the labels, writing nothing (tick write=true to write)."
          fi
          python scripts/regime_shadow.py "${ARGS[@]}"
