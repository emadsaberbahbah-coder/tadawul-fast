name: 🧩 Apply Python Concurrency Integration

on:
  pull_request:
    paths:
      - 'patches/run_dashboard_sync_concurrency.patch'
      - '.github/workflows/apply_python_concurrency_integration.yml'
      - 'scripts/concurrent_batch_fetch.py'
      - 'tests/test_concurrent_batch_fetch.py'

permissions:
  contents: write

concurrency:
  group: apply-python-concurrency-integration-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ github.event.pull_request.head.ref == 'perf/python-batch-concurrency-v1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: perf/python-batch-concurrency-v1
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply and verify patch
        run: |
          set -euo pipefail
          git apply --check patches/run_dashboard_sync_concurrency.patch
          git apply patches/run_dashboard_sync_concurrency.patch
          python -m py_compile \
            scripts/run_dashboard_sync.py \
            scripts/concurrent_batch_fetch.py \
            scripts/run_dashboard_sync_fast.py \
            tests/test_concurrent_batch_fetch.py
          PYTHONPATH="$GITHUB_WORKSPACE" python -m unittest tests/test_concurrent_batch_fetch.py -v
          grep -q 'SCRIPT_VERSION = "6.31.0"' scripts/run_dashboard_sync.py
          grep -q 'batch_metrics' scripts/run_dashboard_sync.py
          grep -q 'TFB_SYNC_BATCH_CONCURRENCY' scripts/run_dashboard_sync.py
      - name: Commit integrated runner
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/run_dashboard_sync.py; then
            echo 'No runner change to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/run_dashboard_sync.py
          git commit -m 'Integrate bounded concurrency into Python runner'
          git push origin HEAD:perf/python-batch-concurrency-v1
