name: Apply deployment-gate truth fix (PR)

on:
  pull_request:
    paths:
      - 'scripts/apply_deployment_gate_truth_fix.py'
      - '.github/workflows/apply_deployment_gate_truth_fix_pr.yml'

permissions:
  contents: write

concurrency:
  group: apply-deployment-gate-truth-fix-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'perf/python-batch-concurrency-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 1
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Apply assertion-heavy transformer
        run: python scripts/apply_deployment_gate_truth_fix.py

      - name: Compile patched files
        run: |
          python -m py_compile \
            core/symbols/normalize.py \
            core/providers/eodhd_provider.py \
            routes/advanced_analysis.py \
            scripts/critical_symbol_identity.py \
            scripts/concurrent_batch_fetch.py \
            scripts/verify_backend_symbol_capabilities.py \
            tests/test_provider_symbol_recovery.py \
            tests/test_backend_symbol_capabilities.py \
            tests/test_critical_symbol_identity.py \
            tests/test_truthful_failsoft_contract.py

      - name: Run focused unit tests
        run: |
          python -m pip install -q pytest httpx
          PYTHONPATH="$GITHUB_WORKSPACE" python -m unittest \
            tests/test_provider_symbol_recovery.py \
            tests/test_backend_symbol_capabilities.py \
            tests/test_critical_symbol_identity.py \
            -v
          PYTHONPATH="$GITHUB_WORKSPACE" python -m pytest -q \
            tests/test_eodhd_http402_guard.py \
            tests/test_truthful_failsoft_contract.py

      - name: Commit patched sources
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No changes produced.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            core/symbols/normalize.py \
            core/providers/eodhd_provider.py \
            routes/advanced_analysis.py \
            scripts/critical_symbol_identity.py \
            scripts/concurrent_batch_fetch.py \
            scripts/verify_backend_symbol_capabilities.py \
            tests/test_provider_symbol_recovery.py \
            tests/test_backend_symbol_capabilities.py \
            tests/test_critical_symbol_identity.py \
            tests/test_truthful_failsoft_contract.py \
            .github/workflows/python_batch_concurrency.yml
          git commit -m 'fix: make deployment gate identity and fallback truthful'
          git push origin "HEAD:${HEAD_BRANCH}"
