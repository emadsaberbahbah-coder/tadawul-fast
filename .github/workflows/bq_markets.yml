# =============================================================================
# 🌍 BigQuery Market Series — daily bars of the world's reference markets
# =============================================================================
# VERSION 1.0.0 (2026-10-29) -- program register C8, Phase 2b (the global
#       markets page of the Looker Studio report, owner request 29 Oct).
# scripts/archive_market_series.py v1.0.0 reads the daily bars of 48
#       reference series from the Yahoo chart API (indices of the US, Europe,
#       China, Japan and Saudi Arabia; USD market ETFs incl. the Gulf; US and
#       world sector ETFs; Brent, WTI, gold) and loads them into BigQuery
#       table tfb_archive.market_series_daily (project-2e3530e6-2311-4aa3-b36,
#       US), one partition per series, WRITE_TRUNCATE: a series that cannot be
#       read keeps its rows. NOTHING is written to the workbook and the live
#       system never reads BigQuery; no decision, gate or count depends on it.
# AUTH: the archive's service account (GOOGLE_SHEETS_CREDENTIALS) with BigQuery
#       Data Editor + BigQuery Job User (granted by the owner on 27 Oct).
# GATE: armed here (TFB_BQ_MARKETS defaults to on); kill with the repository
#       Variable TFB_BQ_MARKETS=off.
# SCHEDULE: 22:35 UTC daily (after the US close; Asia not yet open). A bar of
#       a session still open when the job runs is left out until final. A
#       manual dispatch is a dry run unless write=true.
# =============================================================================
name: 🌍 BigQuery Market Series

on:
  schedule:
    # 22:35 UTC == 01:35 Asia/Riyadh (next calendar day), daily.
    - cron: "35 22 * * *"
  workflow_dispatch:
    inputs:
      write:
        description: "Load into BigQuery? (default: dry-run — reads Yahoo and prints what it would load)"
        required: false
        default: false
        type: boolean
      symbols:
        description: "Comma-separated Yahoo symbols (blank = every series)"
        required: false
        default: ""
        type: string
      days:
        description: "History window in days (30..4000)"
        required: false
        default: "1100"
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: "3.11"
  PYTHONUNBUFFERED: 1
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  markets:
    name: 🌍 Load the market series into BigQuery
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v6

      - name: 🐍 Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "google-auth==2.49.2" "requests==2.33.1"

      - name: 🌍 Run the loader
        env:
          PYTHONPATH: ${{ github.workspace }}
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS != '' && secrets.GOOGLE_SHEETS_CREDENTIALS || secrets.GOOGLE_SHEETS_CREDENTIALS_B64 }}
          TFB_BQ_MARKETS: ${{ vars.TFB_BQ_MARKETS || 'on' }}
          TFB_BQ_PROJECT: ${{ vars.TFB_BQ_PROJECT || 'project-2e3530e6-2311-4aa3-b36' }}
          TFB_BQ_DATASET: ${{ vars.TFB_BQ_DATASET || 'tfb_archive' }}
          TFB_BQ_LOCATION: "US"
          INPUT_SYMBOLS: ${{ github.event.inputs.symbols }}
          INPUT_DAYS: ${{ github.event.inputs.days }}
        run: |
          # Schedule always writes; a manual dispatch writes ONLY when
          # write=true was explicitly ticked (dry run otherwise).
          MODE="--write"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.write }}" != "true" ]]; then
            MODE="--dry-run"
            echo "Dry-run mode — reading Yahoo, loading nothing (tick write=true to load)."
          fi
          DAYS="${INPUT_DAYS:-1100}"
          if [[ ! "$DAYS" =~ ^[0-9]+$ ]]; then
            echo "::error::days must be a whole number, got '${DAYS}'"
            exit 2
          fi
          python scripts/archive_market_series.py $MODE --days "$DAYS" --symbols "${INPUT_SYMBOLS:-}" 2>&1 | tee market_series.log
          rc=${PIPESTATUS[0]}
          {
            echo "### 🌍 BigQuery Market Series (${MODE#--})"
            echo ""
            echo '```'
            tail -n 60 market_series.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
