name: "💾 TFB Workbook Backup"

# v1.0.0 (W-4, Execution Plan v2.1; Gate & Evidence Register §8).
# Nightly full-workbook xlsx into the operator's Drive backup folder:
# RPO ≤24h · retention 30 daily + 12 monthly · restore-test on dispatch.
# Scope: workbook DATA only — credentials/config are excluded by design.
# Alerting: any failure writes an ERROR row to _Run_Log (seven-gate audit
# reads it daily) AND turns this workflow red (GitHub failure e-mail).
#
# ============================================================================
# v1.1.0 (2026-10-01) — [M04 HARDENING] config only: backup_workbook.py,
# the schedule, the destination logic and every Variable/secret name are
# byte-untouched. Red-team 2026-10-01 M04 (adjudicated ACCEPTED as hygiene):
#   1. PINNED INSTALLS: the four packages were installed unpinned, so a new
#      upstream release changed the backup code path on the next night with
#      no review. Pins = requirements.txt on main (gspread 6.2.1,
#      google-auth 2.49.2, requests 2.33.1 — the versions Render runs);
#      openpyxl is not in requirements.txt and is pinned to 3.1.5 (the
#      version the restore-test xlsx reader is exercised with).
#   2. CREDENTIAL FILE: written under umask 077 + chmod 600 and REMOVED in an
#      `if: always()` step, so the key file never outlives the job even on a
#      failed step (runners are ephemeral; this is defence in depth, the
#      pit_snapshot.yml v1.1.0 pattern).
#   3. INPUTS VIA ENV: the two dispatch inputs reach the shell through env
#      vars instead of `${{ }}` interpolation inside `run:` (script-injection
#      hardening). Semantics preserved exactly: a SCHEDULED run carries no
#      inputs -> full backup; dry_run=true wins over restore_test=true (the
#      v1.0.0 assignment order).
#   4. CHECKOUT PINNED TO main with persist-credentials: false — a dispatch
#      from another branch can no longer run unreviewed backup code with the
#      production credentials.
#   5. CONCURRENCY: one lease (tfb-workbook-backup), never cancel in progress
#      — two overlapping exports could race the retention prune.
# ROLLBACK: revert this file (each item is independent).
# ============================================================================
# v1.2.0 (2026-10-11) — [WP-0] SAME-JOB WORKBOOK DQ AUDIT.
# WHY: the audit framework's 75-check catalogue (DQ-01..DQ-75) was measured by
# hand on the 2026-10-11 export; nothing in CI produced the numbers daily. The
# 2026-10-10 export (22,487,265 bytes, 50 tabs, 9,791 live rows) showed 275
# rows without a price, 153 ROI-12M soft-cap breaches, 2,618 F-7 flips, 21,670
# duplicate Signal_History keys and a 4/4 BLOCK portfolio page on 3 consecutive
# runs — invisible to every workflow because no step ever held the exported
# bytes (backup_workbook.py keeps them in memory; there is no upload-artifact).
# GATE: repo Variable TFB_DQ_AUDIT_MODE = off | observe | enforce.
#   off -> TFB_BACKUP_LOCAL_COPY resolves to '' (backup
#       script v1.5.0 behaves exactly as v1.4.0), the two new steps are skipped
#       by their `if:` -> the workflow is byte-equivalent in effect to v1.1.0.
#   observe -> backup_workbook.py v1.5.0 also writes the export to
#       $RUNNER_TEMP/tfb_export.xlsx; scripts/tfb_workbook_dq_audit.py runs on
#       it with the committed baseline fixture; continue-on-error keeps the
#       nightly backup green (an amber annotation only); the scorecard goes to
#       the step summary and dq_report.json + dq_scorecard.md (counts, symbols,
#       dates — redaction-guarded, never a balance or quantity) are uploaded as
#       artifact tfb-dq-audit-<run_id> (30 days).
#   enforce -> same, but a decision-critical regression vs the baseline
#       reddens the job (the backup itself has already succeeded by then).
# THE XLSX IS NEVER UPLOADED: it stays on the runner and is removed in the
# always() cleanup step together with the credentials file.
# (2026-10-12) Operator-authorized initial rollout: unset/empty Variables
# select observe; explicit off and invalid values still disable the audit.
# Keep observe while DQ failures remain. ROLLBACK: set the Variable to off
# or restore the workflow fallback to off; unsetting reactivates observe.
# v1.2.1 (2026-10-13) -- RUNNER IMAGE PIN. WHY: runs-on pinned to ubuntu-24.04 before
# ubuntu-latest moves to a newer image on 19 Oct 2026; labels only (ci.yml v1.1.13).
# v1.3.0 (2026-10-15) -- DQ SCORECARD TO THE PRIVATE BACKUP FOLDER. WHY: the three
# DQ reports reached only the 30-day artifact and the step summary, both behind a
# GitHub sign-in, so the morning DQ review was still done by hand. New step
# "Publish DQ report to Drive" runs backup_workbook.py v1.6.0 --attach (upload-only,
# same destination and credentials as the backup, dated DAILY_TFB_DQ_* names,
# 30-day pruning). Never the xlsx; never on dry_run or restore_test;
# continue-on-error so a report upload can never fail the backup. The artifact
# upload stays as the CI-side copy. Not committed to the (public) repo.
# ============================================================================

on:
  schedule:
    - cron: "30 23 * * *"     # ~02:30 Riyadh — quiet window after all syncs
  workflow_dispatch:
    inputs:
      restore_test:
        description: "true = download newest daily, open it, assert core tabs (Register §8 acceptance)"
        default: "false"
      dry_run:
        description: "true = export + verify only, upload nothing"
        default: "false"
      dq_audit_mode:
        description: "DQ for this run: inherit repository setting, off, or observe"
        type: choice
        required: false
        default: inherit
        options: ["inherit", "off", "observe"]

concurrency:
  group: tfb-workbook-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DEFAULT_SPREADSHEET_ID: ${{ vars.DEFAULT_SPREADSHEET_ID }}
      TFB_BACKUP_FOLDER_ID: ${{ vars.TFB_BACKUP_FOLDER_ID }}
      # (2026-07-26) backup_workbook v1.3.0 destination switch. Drive is
      # architecturally impossible for a bare service account — Google returns
      # storageQuotaExceeded because a service account owns no Drive storage.
      # Unset => "drive" => v1.2.0 behaviour verbatim, so adding these lines
      # changes nothing until the Variables are set.
      TFB_BACKUP_DEST: ${{ vars.TFB_BACKUP_DEST }}
      TFB_BACKUP_GCS_BUCKET: ${{ vars.TFB_BACKUP_GCS_BUCKET }}
      TFB_BACKUP_GCS_PREFIX: ${{ vars.TFB_BACKUP_GCS_PREFIX }}
      # (2026-07-26) v1.4.0 operator-delegated Drive ("oauth"). These are the
      # OPERATOR's credentials, scoped to drive.file — the app can only touch
      # files it creates itself, never the rest of the Drive. Empty secrets =>
      # dest stays "drive" => nothing changes.
      TFB_BACKUP_OAUTH_CLIENT_ID: ${{ secrets.TFB_BACKUP_OAUTH_CLIENT_ID }}
      TFB_BACKUP_OAUTH_CLIENT_SECRET: ${{ secrets.TFB_BACKUP_OAUTH_CLIENT_SECRET }}
      TFB_BACKUP_OAUTH_REFRESH_TOKEN: ${{ secrets.TFB_BACKUP_OAUTH_REFRESH_TOKEN }}
      TFB_BACKUP_DRIVE_FOLDER_NAME: ${{ vars.TFB_BACKUP_DRIVE_FOLDER_NAME }}
    steps:
      # v1.1.0: pinned to main; the job token is not persisted into .git.
      - uses: actions/checkout@v6
        id: source_checkout
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # v1.1.0: pinned — keep in step with requirements.txt on main.
      - name: Install deps
        run: pip install --quiet "gspread==6.2.1" "google-auth==2.49.2" "requests==2.33.1" "openpyxl==3.1.5"

      # (2026-10-12) Scheduled/inherit runs observe by default under the
      # operator-authorized rollout; explicit Variables and manual off win.
      - name: Resolve this run's DQ mode
        id: dq_mode
        env:
          INPUT_DQ_MODE: ${{ github.event.inputs.dq_audit_mode }}
          REPOSITORY_DQ_MODE: ${{ vars.TFB_DQ_AUDIT_MODE || 'observe' }}
        run: |
          set -euo pipefail
          case "${INPUT_DQ_MODE:-inherit}" in
            inherit)
              MODE="${REPOSITORY_DQ_MODE:-off}"
              case "$MODE" in observe|enforce) ;; *) MODE=off ;; esac
              ;;
            off|observe) MODE="$INPUT_DQ_MODE" ;;
            *) echo '::error::Manual DQ mode must be inherit, off or observe.'; exit 2 ;;
          esac
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "DQ effective mode for this run: $MODE"

      - name: Materialize Google credentials
        env:
          SECRET_CREDS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          SECRET_CREDS_B64: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS_B64 }}
        run: |
          set -euo pipefail
          umask 077
          CREDS_PATH="$RUNNER_TEMP/gcreds.json"
          if [[ -n "${SECRET_CREDS:-}" ]]; then
            printf '%s' "$SECRET_CREDS" > "$CREDS_PATH"
          elif [[ -n "${SECRET_CREDS_B64:-}" ]]; then
            printf '%s' "$SECRET_CREDS_B64" | base64 -d > "$CREDS_PATH"
          else
            echo "::error::No Google credentials secret present."; exit 1
          fi
          chmod 600 "$CREDS_PATH"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CREDS_PATH" >> "$GITHUB_ENV"

      - name: Run backup
        env:
          # v1.1.0: dispatch inputs read through the environment, never
          # interpolated into the shell line. Scheduled runs: both empty.
          INPUT_RESTORE_TEST: ${{ github.event.inputs.restore_test }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          # v1.2.0 [WP-0]: empty unless TFB_DQ_AUDIT_MODE is observe/enforce, so
          # backup_workbook.py v1.5.0 behaves exactly as v1.4.0 by default.
          TFB_BACKUP_LOCAL_COPY: ${{ (steps.dq_mode.outputs.mode == 'observe' || steps.dq_mode.outputs.mode == 'enforce') && format('{0}/tfb_export.xlsx', runner.temp) || '' }}
        run: |
          set -euo pipefail
          EXTRA=""
          if [[ "${INPUT_RESTORE_TEST:-}" == "true" ]]; then EXTRA="--restore-test"; fi
          if [[ "${INPUT_DRY_RUN:-}" == "true" ]]; then EXTRA="--dry-run"; fi
          echo "restore_test='${INPUT_RESTORE_TEST:-<scheduled: none>}' dry_run='${INPUT_DRY_RUN:-<scheduled: none>}' -> args='${EXTRA:-<full backup>}'"
          python scripts/backup_workbook.py $EXTRA

      # v1.2.0 [WP-0]: offline DQ-01..DQ-75 audit of the bytes just exported.
      # Skipped unless this run's resolved DQ mode is observe/enforce;
      # observe never reddens the backup (continue-on-error). The xlsx is read
      # from the runner and is never uploaded. Exit 1 = decision-critical
      # regression vs the committed baseline fixture.
      - name: Workbook DQ audit (WP-0)
        if: ${{ success() && (steps.dq_mode.outputs.mode == 'observe' || steps.dq_mode.outputs.mode == 'enforce') && github.event.inputs.restore_test != 'true' }}
        continue-on-error: ${{ steps.dq_mode.outputs.mode != 'enforce' }}
        env:
          TFB_DQ_AUDIT_MODE: ${{ steps.dq_mode.outputs.mode }}
          TFB_CHECKOUT_SHA: ${{ steps.source_checkout.outputs.commit }}
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/tfb_export.xlsx"
          code=0
          python scripts/tfb_workbook_dq_audit.py "$RUNNER_TEMP/tfb_export.xlsx" \
            --json dq_report.json --md dq_scorecard.md \
            --baseline tests/fixtures/dq_baseline_2026-10-10.json --quiet | tee -a "$GITHUB_STEP_SUMMARY" || code=$?
          python scripts/workflow_activation_receipt.py dq --exit-code "$code" \
            --receipt dq_activation_receipt.json
          if [ -f dq_scorecard.md ]; then cat dq_scorecard.md >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$code"

      # v1.2.0 [WP-0]: only the redacted report and scorecard — never the xlsx.
      - name: Upload DQ report
        if: ${{ always() && (steps.dq_mode.outputs.mode == 'observe' || steps.dq_mode.outputs.mode == 'enforce') && github.event.inputs.restore_test != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: tfb-dq-audit-${{ github.run_id }}
          path: |
            dq_report.json
            dq_scorecard.md
            dq_activation_receipt.json
          retention-days: 30
          if-no-files-found: warn

      # v1.3.0: the same three reports into the operator's PRIVATE backup folder,
      # beside the workbook, so the morning review needs no GitHub sign-in.
      # Upload-only (no export); the credentials are still materialised here.
      # A dry run or restore test publishes nothing; a missing report is
      # skipped; a failed upload never fails the backup (continue-on-error).
      - name: Publish DQ report to Drive
        if: ${{ always() && (steps.dq_mode.outputs.mode == 'observe' || steps.dq_mode.outputs.mode == 'enforce') && github.event.inputs.restore_test != 'true' && github.event.inputs.dry_run != 'true' }}
        continue-on-error: true
        env:
          # Same env block as "Run backup". TFB_BACKUP_LOCAL_COPY lets --attach
          # refuse the export path itself; the inputs are informational.
          INPUT_RESTORE_TEST: ${{ github.event.inputs.restore_test }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          TFB_BACKUP_LOCAL_COPY: ${{ (steps.dq_mode.outputs.mode == 'observe' || steps.dq_mode.outputs.mode == 'enforce') && format('{0}/tfb_export.xlsx', runner.temp) || '' }}
        run: |
          set -euo pipefail
          python scripts/backup_workbook.py --attach dq_scorecard.md dq_report.json dq_activation_receipt.json

      # v1.1.0: the key file never outlives the job, whatever failed above.
      # v1.2.0 [WP-0]: the local export copy never outlives the job either.
      - name: Remove Google credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/gcreds.json" "$RUNNER_TEMP/tfb_export.xlsx"
