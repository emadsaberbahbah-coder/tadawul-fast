# =============================================================================
# Provider Identity Probe - read-only provider read-back (manual only)
# =============================================================================
# VERSION 1.0.0 (2026-10-28) -- NEW WORKFLOW (WP-05 read-back, P1-5)
# WHY: the 28 Oct morning board was WITHHELD because Commodities_FX was fresh
#       on 430 of 453 rows (94.9 % < 95 %). 17 rows fail every day: 7 crypto
#       pairs on the wrong coin at a zero price (short-ticker collisions),
#       gold spot and 7 exotic crosses with no price, LBS=F and DX=F. The
#       WP-05 fix TFB_EODHD_CRYPTO_MAP=1 is default off and must be armed
#       "only after a provider read-back"; the build container cannot reach
#       the providers. scripts/provider_identity_probe.py v1.0.0 asks EODHD
#       (real-time + search) and Yahoo (chart) for explicit candidate codes
#       and prints CONFIRMED / AVAILABLE / NAME_MISMATCH / DEAD per row.
# READ-ONLY: no workbook, no Render, no state. Dispatch only (no schedule).
# SECRETS: EODHD_API_KEY (existing; scrubbed from every message).
# =============================================================================
name: 🔎 Provider Identity Probe

on:
  workflow_dispatch:
    inputs:
      spec:
        description: "Spec path in the repo or inline JSON (blank = data/provider_probe_cfx_2026-10-28.json)"
        required: false
        default: ""
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: "3.11"
  PYTHONUNBUFFERED: 1
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  probe:
    name: 🔎 Probe candidate provider codes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v6

      - name: 🐍 Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "requests==2.33.1"

      - name: 🔎 Run the probe
        env:
          PYTHONPATH: ${{ github.workspace }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          TFB_PROBE_SPEC: ${{ github.event.inputs.spec }}
          TFB_PROBE_EVIDENCE_DIR: probe-evidence
        run: python scripts/provider_identity_probe.py

      - name: 📎 Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: provider-probe-${{ github.run_id }}
          path: probe-evidence
          if-no-files-found: ignore
          retention-days: 30
