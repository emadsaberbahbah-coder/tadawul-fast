name: ⚡ Python Batch Concurrency

on:
  pull_request:
    paths:
      - 'core/symbols/normalize.py'
      - 'core/providers/eodhd_provider.py'
      - 'scripts/critical_symbol_identity.py'
      - 'scripts/run_dashboard_sync.py'
      - 'scripts/concurrent_batch_fetch.py'
      - 'scripts/run_dashboard_sync_fast.py'
      - 'scripts/benchmark_dashboard_fetch.py'
      - 'scripts/verify_backend_symbol_capabilities.py'
      - 'tests/test_concurrent_batch_fetch.py'
      - 'tests/test_provider_symbol_recovery.py'
      - 'tests/test_benchmark_dashboard_fetch.py'
      - 'tests/test_backend_symbol_capabilities.py'
      - 'tests/test_eodhd_http402_guard.py'
      - 'patches/eodhd_http402_circuit_hotfix.patch'
      - '.github/workflows/python_batch_concurrency.yml'
  push:
    branches: [main]
    paths:
      - 'core/symbols/normalize.py'
      - 'core/providers/eodhd_provider.py'
      - 'scripts/critical_symbol_identity.py'
      - 'scripts/run_dashboard_sync.py'
      - 'scripts/concurrent_batch_fetch.py'
      - 'scripts/run_dashboard_sync_fast.py'
      - 'scripts/benchmark_dashboard_fetch.py'
      - 'scripts/verify_backend_symbol_capabilities.py'
      - 'tests/test_concurrent_batch_fetch.py'
      - 'tests/test_provider_symbol_recovery.py'
      - 'tests/test_benchmark_dashboard_fetch.py'
      - 'tests/test_backend_symbol_capabilities.py'
      - 'tests/test_eodhd_http402_guard.py'
      - '.github/workflows/python_batch_concurrency.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: python-batch-concurrency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test bounded batch concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Compile and test
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python -m py_compile \
            core/symbols/normalize.py \
            scripts/critical_symbol_identity.py \
            scripts/run_dashboard_sync.py \
            scripts/concurrent_batch_fetch.py \
            scripts/run_dashboard_sync_fast.py \
            scripts/benchmark_dashboard_fetch.py \
            scripts/verify_backend_symbol_capabilities.py \
            tests/test_concurrent_batch_fetch.py \
            tests/test_provider_symbol_recovery.py \
            tests/test_benchmark_dashboard_fetch.py \
            tests/test_backend_symbol_capabilities.py
          python -m unittest \
            tests/test_concurrent_batch_fetch.py \
            tests/test_provider_symbol_recovery.py \
            tests/test_benchmark_dashboard_fetch.py \
            tests/test_backend_symbol_capabilities.py \
            tests/test_critical_symbol_identity.py \
            -v
      - name: Verify production-runner integration contract
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from core.symbols.normalize import to_eodhd_symbol, to_yahoo_symbol
          from scripts import run_dashboard_sync as sync
          from scripts.concurrent_batch_fetch import build, concurrency, provider_recovery_variants
          from scripts.benchmark_dashboard_fetch import NoWriteSheets
          from scripts.critical_symbol_identity import canonicalize_symbol
          from scripts.verify_backend_symbol_capabilities import RULES, evaluate_table

          assert sync.SCRIPT_VERSION == "6.31.0"
          assert callable(sync._fetch_market_rows_batched)
          assert callable(build(sync))
          assert to_eodhd_symbol("ADNOCDIST.AB") == "ADNOCDIST.ADX"
          assert to_eodhd_symbol("BPI.PS") == "BPI.PSE"
          assert to_yahoo_symbol("ADNOCDIST.ADX") == "ADNOCDIST.AB"
          assert canonicalize_symbol("NZYM-B.CO") == "NSIS-B.CO"
          assert provider_recovery_variants("BK.US") == ["BK.US", "BK"]
          assert len(RULES) == 3
          bk_rule = next(rule for rule in RULES if rule.requested_symbol == "BK.US")
          bk_check = evaluate_table(
              bk_rule,
              ["Symbol", "Name", "Current Price", "Data Provider"],
              [["BK.US", "The Bank of New York Mellon Corporation", 71.2, "eodhd"]],
          )
          assert bk_check["passed"] is True
          result = sync.TaskResult(
              key="GLOBAL_MARKETS",
              sheet_name="Global_Markets",
              status="pending",
              start_utc="2026-07-30T00:00:00+00:00",
          )
          payload = result.to_dict()
          assert "batch_metrics" in payload
          assert isinstance(payload["batch_metrics"], dict)
          assert 1 <= concurrency() <= 6
          sink = NoWriteSheets()
          assert sink.write_table("sid", "P", "A1", ["Symbol"], [["A"]]) == 1
          assert sink.planned_writes[0]["rows"] == 1
          print("production-runner concurrency + provider mapping + deployment gate + no-write contract: PASS")
          PY

  apply-http402-hotfix:
    name: Apply EODHD HTTP 402 hotfix
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR branch with write credentials
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          persist-credentials: true

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.render.txt
            requirements.txt

      - name: Apply staged provider patch exactly once
        shell: bash
        run: |
          set -euo pipefail
          PATCH="patches/eodhd_http402_circuit_hotfix.patch"
          test -f "$PATCH"
          if git apply --check "$PATCH"; then
            git apply "$PATCH"
          elif git apply --reverse --check "$PATCH"; then
            echo "Patch is already applied."
          else
            echo "::error::HTTP 402 patch neither applies cleanly nor appears already applied."
            exit 1
          fi

      - name: Install focused test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          if [[ -f requirements.render.txt ]]; then
            python -m pip install -r requirements.render.txt
          elif [[ -f requirements.txt ]]; then
            python -m pip install -r requirements.txt
          fi
          python -m pip install -q pytest

      - name: Compile and test HTTP 402 provider behavior
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python -m compileall -q core/providers/eodhd_provider.py tests/test_eodhd_http402_guard.py
          python -m pytest -q tests/test_eodhd_http402_guard.py
          python -m pytest -q tests/test_provider_symbol_recovery.py tests/test_backend_symbol_capabilities.py

      - name: Commit tested hotfix to PR branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- core/providers/eodhd_provider.py tests/test_eodhd_http402_guard.py; then
            echo "No provider changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/providers/eodhd_provider.py tests/test_eodhd_http402_guard.py
          git commit -m "fix(provider): circuit-break EODHD HTTP 402 failures"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
