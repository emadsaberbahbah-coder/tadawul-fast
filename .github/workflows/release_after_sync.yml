# =============================================================================
# Release After Sync (P0-1 timing) - .github/workflows/release_after_sync.yml
# =============================================================================
# VERSION 1.0.0 (2026-10-29) -- NEW WORKFLOW: release as soon as the cockpits
# consumed a completed production sync, instead of at the next late slot.
#
# WHY: release_decision_feed.yml is the only path that can promote the
# decision feed to EXECUTABLE, on six fixed slots or by hand. On 28 Oct GitHub
# delivered this repository's crons 1-6 hours late, so a cohort that both
# cockpits had consumed waited for a late slot or an operator: sync
# 40744567865 completed 19:31Z and was released by hand at 21:07Z
# (40769338335), 96 minutes of its 480-minute window spent showing FEED NOT
# ACTIONABLE for a cohort that passed every strict audit.
# WHAT: on workflow_run 'completed' of the Advanced Sync, for a run on main
# whose event was schedule or workflow_dispatch and whose conclusion was
# success or failure (the final job vetoes pre-render, so a healthy sync
# still ends failure), and only while vars.TFB_RELEASE_AFTER_SYNC is armed
# (1/true/yes/on; DEFAULT OFF = the job is skipped, nothing runs):
# scripts/await_cockpit_receipts.py checks the run's provenance with the
# release script's own rule, waits READ-ONLY (bounded by
# vars.TFB_RELEASE_AFTER_SYNC_WAIT_MIN, default 45, cap 55 minutes) for both
# cockpit receipts 'source readiness VERIFIED (run <that run>)', stops early
# only when the feeds name another run (or the feed is already EXECUTABLE),
# never dispatches while a production writer or any release run (a running
# slot, a pending kill) is not completed, and then dispatches
# release_decision_feed.yml on main with source_run_id=<that run> and
# mode=release.
# UNCHANGED: release_decision_feed.yml and its script are byte-identical. The
# release stays the only production entry that can write EXECUTABLE: every
# gate (TFB_DECISION_RELEASE, the sticky TFB_DECISION_RELEASE_KILL, read when
# the dispatched run starts, i.e. after this wait), the strict audits, the
# in-flight probe and compare-and-set run there, in its private group. A
# dispatched release that exits non-zero (deferred, not accepted, refused)
# ends red, as every dispatched release does (an accepted dry run with the
# release gate off ends green); a stop or a timeout here ends green with a
# warning.
# PERMISSIONS: actions: write for the one POST .../dispatches
# (workflow_dispatch is the event a GITHUB_TOKEN may create); reads of run
# provenance and the in-flight listing use the same token. The Sheets
# credentials are used for reads only: this workflow never writes the
# workbook.
# CONCURRENCY: a private JOB-level group, so a run whose job is skipped (every
# PR/push validation run of the sync triggers this workflow too) never enters
# it and can never cancel a pending real attempt. It joins neither
# tadawul-production-write-* (a new member cancels a pending production sync)
# nor tfb-decision-release (the wait must never delay a kill, a sweep or a
# scheduled release).
# ROLLBACK: unset vars.TFB_RELEASE_AFTER_SYNC (the job is skipped), or delete
# this file and scripts/await_cockpit_receipts.py.
# =============================================================================
name: Release After Sync (P0-1)

on:
  workflow_run:
    workflows: ["🏦 Tadawul Dashboard Advanced Sync"]
    types: [completed]

permissions:
  contents: read
  actions: write

defaults:
  run:
    shell: bash

jobs:
  await-receipts-then-release:
    name: Await cockpit receipts, then dispatch the release
    if: >-
      ${{
        github.event.workflow_run.head_branch == 'main' &&
        (
          github.event.workflow_run.event == 'schedule' ||
          github.event.workflow_run.event == 'workflow_dispatch'
        ) &&
        (
          github.event.workflow_run.conclusion == 'success' ||
          github.event.workflow_run.conclusion == 'failure'
        ) &&
        contains(fromJSON('["1", "true", "yes", "on"]'), vars.TFB_RELEASE_AFTER_SYNC)
      }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 65
    concurrency:
      group: tfb-release-after-sync
      cancel-in-progress: false
    env:
      PYTHONPATH: ${{ github.workspace }}
      TARGET_SHEET_ID: ${{ vars.DEFAULT_SPREADSHEET_ID }}
      TFB_RELEASE_AFTER_SYNC: ${{ vars.TFB_RELEASE_AFTER_SYNC || '0' }}
      TFB_RELEASE_AFTER_SYNC_WAIT_MIN: ${{ vars.TFB_RELEASE_AFTER_SYNC_WAIT_MIN || '45' }}
    steps:
      - name: Checkout this workflow's ref
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.render.txt
            requirements.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          if [[ -f requirements.render.txt ]]; then
            python -m pip install -r requirements.render.txt
          else
            python -m pip install -r requirements.txt
          fi

      - name: Configure read-only audit credentials
        env:
          SECRET_CREDS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          SECRET_CREDS_B64: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS_B64 }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os
          from pathlib import Path
          if not os.environ.get('TARGET_SHEET_ID', '').strip():
              raise SystemExit('::error::Spreadsheet ID is missing.')
          raw = os.environ.get('SECRET_CREDS', '')
          if not raw:
              try:
                  raw = base64.b64decode(os.environ.get('SECRET_CREDS_B64', ''), validate=True).decode()
              except Exception:
                  raise SystemExit('::error::Google Sheets credentials are invalid.')
          try:
              credentials = json.loads(raw)
              valid = isinstance(credentials, dict) and credentials.get('type') == 'service_account'
              valid = valid and credentials.get('client_email') and credentials.get('private_key')
              if not valid:
                  raise ValueError('invalid service-account structure')
          except Exception:
              raise SystemExit('::error::Google Sheets credentials are invalid.')
          path = Path(os.environ['RUNNER_TEMP']) / 'final_publication_credentials.json'
          fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
          os.fchmod(fd, 0o600)
          with os.fdopen(fd, 'w') as handle:
              handle.write(raw)
          print('::add-mask::' + credentials['client_email'])
          with open(os.environ['GITHUB_ENV'], 'a') as handle:
              handle.write('GOOGLE_APPLICATION_CREDENTIALS=' + str(path) + '\n')
          PY

      - name: Await cockpit receipts and dispatch the release
        id: await
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code=0
          python scripts/await_cockpit_receipts.py \
            --sheet-id "$TARGET_SHEET_ID" \
            --source-run-id "$SOURCE_RUN_ID" \
            --wait-min "$TFB_RELEASE_AFTER_SYNC_WAIT_MIN" \
            --json-out await_cockpit_receipts.json || code=$?
          echo "await_exit=$code" >> "$GITHUB_OUTPUT"
          if [[ "$code" -ne 0 ]]; then
            echo "::error::After-sync release attempt failed (exit $code); see the artifact."
            exit "$code"
          fi

      - name: Publish after-sync summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('await_cockpit_receipts.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as handle:
              handle.write('## After-sync release attempt\n\n')
              if not path.exists():
                  handle.write('The attempt did not complete. Nothing was dispatched.\n')
                  raise SystemExit(0)
              result = json.loads(path.read_text())
              last = result.get('last') or {}
              rows = [(key, result.get(key)) for key in (
                  'outcome', 'exit_code', 'reasons', 'source_run_id', 'source_completed_utc',
                  'polls', 'waited_s', 'first_seen_s', 'dispatched', 'dispatch_status',
                  'dispatch_error', 'faults', 'last_fault', 'provenance')]
              rows += [('last.' + key, last.get(key)) for key in (
                  'state', 'reason', 'in_flight', 'gm_run', 'decision_run', 'decision_executable',
                  'pf', 't10')]
              handle.write('| Check | Result |\n|---|---|\n')
              for key, value in rows:
                  handle.write('| ' + key + ' | ' + json.dumps(value) + ' |\n')
              if result.get('dispatched'):
                  handle.write('\nThe release run re-audits the cohort; its own summary carries the verdict.\n')
          if result.get('outcome') in ('stopped', 'timeout'):
              print('::warning::After-sync attempt: no release dispatched (' +
                    ','.join(str(item) for item in result.get('reasons') or []) + '); the scheduled slots still apply.')
          PY

      - name: Upload after-sync evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-after-sync-${{ github.run_id }}
          path: await_cockpit_receipts.json
          retention-days: 30
          if-no-files-found: warn

      - name: Secure credential cleanup
        if: always()
        run: |
          CREDS_PATH="$RUNNER_TEMP/final_publication_credentials.json"
          if [[ -f "$CREDS_PATH" ]]; then
            shred -u -z "$CREDS_PATH" 2>/dev/null || rm -f "$CREDS_PATH"
          fi
