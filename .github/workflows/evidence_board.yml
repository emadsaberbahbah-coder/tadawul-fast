# =============================================================================
# 🔬 Evidence Board - what the archive says works, measured again every day
# -----------------------------------------------------------------------------
# VERSION 1.0.0 (2026-11-12)
#
# WHY: the reviews of 12 Nov 2026 (project doc
# TFB_Consolidated_Plan_Claude_and_ChatGPT_Reviews_2026-11-12) found that the
# overall score shows no reliable link to later returns and that most forecasts
# are synthetic. The owner asked for the improved analysis to be in the scripts
# now. scripts/evidence_board.py re-runs that review's measurements on the
# BigQuery archive and publishes one page: market state per market, a shadow
# score, a historical chance of finishing up and a price range per name, the
# factor edge table and the label-stability comparison.
#
# WHEN: 07:40 and 16:40 Riyadh (04:40 and 13:40 UTC), after the morning and
# afternoon archives. GitHub may start a scheduled run late; the page states its
# build time and the last bar date of each market.
#
# WRITES: only its own tab (Evidence_Board). BigQuery: SELECT only. SHADOW: no
# recommendation changes and no order is placed.
# Rollback: repository variable TFB_EVIDENCE=off.
# =============================================================================
name: 🔬 Evidence Board

on:
  schedule:
    - cron: "40 4,13 * * *"         # 07:40 and 16:40 Riyadh
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Compute and print only (write nothing)"
        type: boolean
        default: false

concurrency:
  group: tfb-evidence-board
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: "3.11"
  PYTHONUNBUFFERED: 1
  TZ: Asia/Riyadh
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  evidence:
    name: 🔬 Measure and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v6

      - name: 🐍 Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install dependencies
        run: python -m pip install --quiet gspread==6.2.1 google-auth requests

      - name: 🔎 Resolve spreadsheet id
        id: sheet
        env:
          VAR_SHEET: ${{ vars.DEFAULT_SPREADSHEET_ID }}
        run: |
          SID="${VAR_SHEET:-}"
          if [[ -z "$SID" ]]; then
            echo "::error::Spreadsheet ID empty. Set repository variable DEFAULT_SPREADSHEET_ID."
            exit 1
          fi
          echo "sid=$SID" >> "$GITHUB_OUTPUT"

      - name: 🔬 Run the evidence board
        env:
          PYTHONPATH: ${{ github.workspace }}
          DEFAULT_SPREADSHEET_ID: ${{ steps.sheet.outputs.sid }}
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS != '' && secrets.GOOGLE_SHEETS_CREDENTIALS || secrets.GOOGLE_SHEETS_CREDENTIALS_B64 }}
          TFB_BQ_PROJECT: ${{ vars.TFB_BQ_PROJECT || 'project-2e3530e6-2311-4aa3-b36' }}
          TFB_BQ_DATASET: ${{ vars.TFB_BQ_DATASET || 'tfb_archive' }}
          TFB_BQ_LOCATION: ${{ vars.TFB_BQ_LOCATION || 'US' }}
          TFB_EVIDENCE: ${{ vars.TFB_EVIDENCE || 'on' }}
          TFB_EVIDENCE_ENTER: ${{ vars.TFB_EVIDENCE_ENTER || '72' }}
          TFB_EVIDENCE_EXIT: ${{ vars.TFB_EVIDENCE_EXIT || '67' }}
          TFB_EVIDENCE_MIN_WEEKS: ${{ vars.TFB_EVIDENCE_MIN_WEEKS || '4' }}
          EVENT_NAME: ${{ github.event_name }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=()
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$IN_DRY_RUN" == "true" ]]; then
            ARGS+=(--dry-run)
          fi
          python scripts/evidence_board.py "${ARGS[@]}"
