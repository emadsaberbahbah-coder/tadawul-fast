# =============================================================================
# 🧮 Consistency Check - the same figure on every page
# -----------------------------------------------------------------------------
# VERSION 1.1.0 (2026-11-11)
#
# 1.1.0: HOURLY at minute 50 (after the Daily Plan at :20 and the Exit Plan at
# :35); the after-run triggers are dropped (the hourly run covers them). C11
# reports how old each output page is (owner, 11 Nov 12:52).
#
# WHY: on 11 Nov the main page, the Daily Plan, the v2 pages, the portfolio
# pages and the Exit Plan disagreed on the day's tickets, on stops, on the USD
# rate and on freshness, and nothing compared them (owner request 11:24).
# WHAT: scripts/consistency_check.py reads the decision pages and writes one
# page, Consistency_Check. It changes no other page and decides nothing.
# WHEN: every hour (1.1.0).
# Rollback: repository variable TFB_CONSISTENCY=off.
# =============================================================================
name: 🧮 Consistency Check

on:
  schedule:
    - cron: "50 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Compute and print only (write nothing)"
        type: boolean
        default: false

concurrency:
  group: tfb-consistency-check
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: "3.11"
  PYTHONUNBUFFERED: 1
  TZ: Asia/Riyadh
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  consistency:
    name: 🧮 Compare the pages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v6

      - name: 🐍 Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install dependencies
        run: python -m pip install --quiet gspread==6.2.1 google-auth

      - name: 🔎 Resolve spreadsheet id
        id: sheet
        env:
          VAR_SHEET: ${{ vars.DEFAULT_SPREADSHEET_ID }}
        run: |
          SID="${VAR_SHEET:-}"
          if [[ -z "$SID" ]]; then
            echo "::error::Spreadsheet ID empty. Set repository variable DEFAULT_SPREADSHEET_ID."
            exit 1
          fi
          echo "sid=$SID" >> "$GITHUB_OUTPUT"

      - name: 🧮 Run the consistency check
        env:
          PYTHONPATH: ${{ github.workspace }}
          DEFAULT_SPREADSHEET_ID: ${{ steps.sheet.outputs.sid }}
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS != '' && secrets.GOOGLE_SHEETS_CREDENTIALS || secrets.GOOGLE_SHEETS_CREDENTIALS_B64 }}
          TFB_CONSISTENCY: ${{ vars.TFB_CONSISTENCY || 'on' }}
          TFB_CONS_PRICE_TOL_PCT: ${{ vars.TFB_CONS_PRICE_TOL_PCT || '0.5' }}
          TFB_CONS_STALE_H: ${{ vars.TFB_CONS_STALE_H || '3' }}
          TFB_CONS_FX_TOL_PCT: ${{ vars.TFB_CONS_FX_TOL_PCT || '0.05' }}
          TFB_CONS_STOP_TOL_PCT: ${{ vars.TFB_CONS_STOP_TOL_PCT || '1' }}
          TFB_CONS_SAR_TOL: ${{ vars.TFB_CONS_SAR_TOL || '50' }}
          TFB_CONS_PAGE_MAX_AGE_H: ${{ vars.TFB_CONS_PAGE_MAX_AGE_H || '2' }}
          TFB_PLAN_EARN_DAYS: ${{ vars.TFB_PLAN_EARN_DAYS || '7' }}
          EVENT_NAME: ${{ github.event_name }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=()
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$IN_DRY_RUN" == "true" ]]; then
            ARGS+=(--dry-run)
          fi
          python scripts/consistency_check.py "${ARGS[@]}"
