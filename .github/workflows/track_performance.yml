name: 📈 TFB Performance Clock (record + audit + calibrate)

# VERSION 1.0.8 (2026-10-27) -- WHY DUE RECORDS DID NOT MATURE (OWNER OPT-IN)
# WHY (2026-10-27): the audit counts every reason a due record stays
# unmatured but never prints it, so the 25 Oct Sunday audits' 0 maturities
# (many .SR records targeted that session) could not be explained.
# WHAT: the 'Run performance clock' step maps repository Variable
# TRACK_OUTCOME_TALLY (default 'off' = 1.0.5 behaviour) to track_performance
# v6.52.0: 'observe' logs '[v6.52.0 OUTCOME-TALLY]' lines per audit (totals,
# then one per exchange calendar) and changes nothing else. daily_sync's
# tracker step maps the same Variable
# (ENV PARITY). Numbered 1.0.8 because open #841 / #845 claim 1.0.6 / 1.0.7.
# Rollback: unset TRACK_OUTCOME_TALLY (or set off).
# VERSION 1.0.5 (2026-10-24) -- CANONICAL PROSPECTIVE TARGETS
# New rows use forecast-price-derived percentage points and schema receipts.
# Historical rows and promotion thresholds are unchanged; criterion4 now
# enforces the stricter canonical forecast-provenance basis. Set the repository
# TRACK_CANONICAL_TARGETS variable to '0' to restore legacy creation.
# VERSION 1.0.4 (2026-10-21) -- HISTORICAL TARGET-SESSION CLOSE (OWNER OPT-IN)
# WHY (2026-10-21): 1.0.3 stops new losses only when a run lands inside a
# record's target session; records whose session already passed stay ACTIVE for
# good (acceptance D10-3b: 3,208 overdue, matured flat at 11,791 since ~10 Oct).
# WHAT: the 'Run performance clock' step maps repository Variable
# TRACK_HIST_TARGET_CLOSE (default 'off' = 1.0.3 behaviour) to track_performance
# v6.47.0: 'observe' logs one [HIST-CLOSE v6.47.0] line counting the overdue
# records whose exact target-session close was witnessed; 'enforce' matures them
# on that close through the unchanged CA-GUARD path. TRACK_HIST_CLOSE_BUDGET
# (default '60' symbols) and TRACK_HIST_CLOSE_TIME_SEC (default '240') bound the
# daily-bar pulls per audit pass; both defaults equal the script's own. It only
# acts in an audit pass (run_audit=true, or TRACK_SCHEDULED_AUDIT=1 from 1.0.3).
# Only this lane is mapped; daily_sync's tracker step is unchanged.
# Rollback: unset TRACK_HIST_TARGET_CLOSE (or set off).
# VERSION 1.0.3 (2026-10-20) -- OWNER OPT-IN SCHEDULED MATURITY AUDIT
# WHY (2026-10-20 export): a record matures only on a quote from its exact
# target session (track_performance _outcome_target_session: "never use a later
# session"), so a target session this clock does not audit within about a day is
# never measured. Since 1.0.1 schedules record only: no record has matured since
# 2026-10-10, 3,208 ACTIVE records are past their target date, and the S-1
# criterion-4 row (written only under --audit) has been stale since 11 Oct, so
# S-1 cannot pass. WHAT: repository Variable TRACK_SCHEDULED_AUDIT (default '0'
# = 1.0.2 behaviour). '1' makes a SCHEDULED run pass --audit, and only while the
# matured-duplicate guard measures or enforces (TRACK_DEDUP_MATURED observe |
# enforce), the guard 1.0.1 waited for; otherwise the run stays record-only and
# warns. Manual dispatch is unchanged (run_audit=true still required). Only this
# lane audits on schedule; daily_sync's tracker step stays record-only.
# Rollback: unset TRACK_SCHEDULED_AUDIT (or set 0).
# VERSION 1.0.2 (2026-10-13) -- RUNNER IMAGE PINNED TO ubuntu-24.04
# WHY (2026-10-13): pinned before ubuntu-latest moves on 19 Oct 2026; labels only (ci.yml v1.1.13).
# VERSION 1.0.1 (2026-10-12) -- SCHEDULED RECORDING WITHOUT HISTORICAL AUDIT
# Historical maturity auditing requires explicit manual opt-in; schedules
# keep recording/analyzing/exporting with old-grid publication disabled.
# WHY: the 2026-10-10 export still has 27 duplicate matured keys and 11,791
# matured rows with zero-valued risk placeholders. Existing v6.41.0 guards
# could not run because their repository Variables were never mapped here.
# Defaults remain off/0; mirror both mappings in daily_sync's tracker step.

# =============================================================================
# WHY THIS EXISTS
# -----------------------------------------------------------------------------
# scripts/track_performance.py is the project's performance / action-trend /
# reliability-calibration engine (v6.9.0). It only does useful work when it is
# RUN on a schedule: --record captures each decision symbol's daily pick +
# verdict snapshot (Performance_Log + Signal_History), --audit matures active
# picks against realized prices, and --analyze/--calibrate read those matured
# records back to measure stated-vs-realized reliability.
#
# The existing daily_sync workflow runs ONLY scripts/run_dashboard_sync.py — it
# never calls track_performance. So the clock was never started: Performance_Log
# and Signal_History stay empty, every action-trend reads "NEW", and calibration
# reads "INSUFFICIENT EVIDENCE — start the clock." This workflow starts it.
#
# CADENCE: ONCE DAILY (14:00 UTC = 17:00 Riyadh, after the Tadawul close). The
# tracker is idempotent per day — PerformanceRecord.key is symbol|horizon|YYYYMMDD
# and SignalSnapshot.key is symbol|YYYYMMDD, so a same-day re-run writes nothing
# new. It is therefore safe to re-run manually, and a daily (not 15-minute)
# cadence is deliberate: each calendar day contributes exactly one snapshot, and
# the ~50-90s cold Top_10 build is not worth running 96×/day.
#
# This workflow does NOT touch the 15-minute dashboard sync and changes no
# application code. It is fully reversible: disable or delete this file and the
# clock simply stops advancing (existing records are untouched).
#
# (2026-10-11) CORRECTION + FLAG MAPPING. The Signal_History half of the
# idempotency claim above has never held on the live sheet:
# SignalHistoryStore.append_snapshots dedups against an in-memory cache that
# only load_snapshots fills, and run_once appends before it loads, so every
# --record run (this clock x2 + daily_sync x3 per day) appends the whole
# snapshot set again (10-10 export: 21,670 of 29,471 rows are same-day
# repeats, max 19 per Symbol|Date key). Performance_Log keys ARE idempotent
# (append_records filters against the primed load_records cache).
# track_performance v6.44.0 measures the repeats under
# TRACK_DEDUP_SIGNAL_HISTORY=observe; the run step below now maps it together
# with TRACK_DEDUP_MATURED and TRACK_RISK_BLANK (v6.41.0, unmapped until
# today). (2026-10-12) Operator-authorized initial rollout observes signal
# repeats when its Variable is unset/empty; the script default stays off.
# Rollback: set TRACK_DEDUP_SIGNAL_HISTORY to off; unsetting restores observe.
# =============================================================================

on:
  # Production scheduler - twice daily after the Riyadh close.
  #
  # (2026-10-06) TWO SLOTS, OFF THE HOUR. Evidence: the last 12 scheduled runs
  # of this workflow NEVER started within 3 h of the nominal 14:00 UTC - the
  # measured run_started_at values were 17:44, 17:57, 18:02, 18:48, 18:57,
  # 19:05, 19:15, 20:22 and, on 2026-10-05, 21:20:52Z. GitHub's scheduler is
  # delivering every cron in this repository 3-7 h late (daily_sync's
  # "17 4,12,20" slots fired 09:55-11:36 / 16:28-19:42 / 23:07-00:24 and the
  # 12:17 slot did not fire at all on 10-05), and minute 0 is the worst
  # contended minute of the hour.
  #
  # WHY IT MATTERS FOR THE OUTCOME EVIDENCE: the record key is the WALL-CLOCK
  # Riyadh date (track_performance.py: key = symbol|horizon|YYYYMMDD built from
  # date_recorded = RiyadhTime.now()), so a run that lands after 21:00 UTC is
  # keyed to the NEXT Riyadh day - the 21:20:52Z run on 10-05 recorded under
  # 20261006. A day whose global-markets sync leg also failed then carries NO
  # --record at all for that Riyadh date, and days that were never sampled
  # cannot be recovered later.
  #
  # Both slots are safe to fire: the tracker is idempotent per day
  # (PerformanceRecord.key is symbol|horizon|YYYYMMDD, SignalSnapshot.key is
  # symbol|YYYYMMDD), so the second run writes nothing new once the first
  # succeeded. Two earlier slots raise the probability that at least one lands
  # inside the intended Riyadh day under the observed drift.
  # Rollback: restore the single `- cron: "0 14 * * *"` line.
  schedule:
    - cron: "47 11 * * *"   # 14:47 Riyadh - after the Tadawul close
    - cron: "47 15 * * *"   # 18:47 Riyadh - backstop before Riyadh midnight

  # Manual trigger — use this to START THE CLOCK immediately and to verify the
  # wiring without waiting for 14:00 UTC.
  workflow_dispatch:
    inputs:
      backend_url:
        description: "🌐 Backend URL override (optional)"
        required: false
        type: string
      sheet_id:
        description: "📊 Spreadsheet ID override (optional)"
        required: false
        type: string
      run_audit:
        description: "Allow historical maturity audit (explicit opt-in)"
        required: false
        default: false
        type: boolean
      enable_debug:
        description: "🐛 LOG_LEVEL=DEBUG"
        required: false
        default: false
        type: boolean
      signal_history_mode:
        description: "Same-day repetition measurement for this run (observe does not deduplicate)"
        required: false
        type: choice
        default: inherit
        options: ["inherit", "off", "observe"]

# Never overlap two clock runs (a cold Top_10 build can take ~90s).
#
# (2026-10-06) THIS GROUP STAYS PRIVATE. A first attempt moved it to the
# production write lease ('tadawul-production-write-<ref>') to stop this clock
# interleaving with daily_sync's own tracker step. Review caught that this is
# ACTIVELY DANGEROUS: with the default single queue GitHub keeps at most ONE
# pending run per concurrency group, and a newly queued run CANCELS the
# existing pending one. `cancel-in-progress: false` protects only the RUNNING
# item. So with a sync running and the next sync already queued, either clock
# slot would have evicted that pending sync - recreating the very
# missing-sync, missing-outcome failure this file is trying to mitigate.
# The overlap is instead prevented by the preflight step below, which SKIPS
# the clock run when a production write is in flight. A skip costs nothing
# (the tracker is idempotent per Riyadh day and this workflow now has two
# slots) and, unlike a shared lease, it can never cancel anything.
concurrency:
  group: tfb-performance-clock
  cancel-in-progress: false

permissions:
  contents: read
  # (2026-10-06) the preflight overlap check reads the Actions API.
  actions: read

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: "3.11"
  PYTHONUNBUFFERED: 1
  TZ: Asia/Riyadh
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  performance-clock:
    name: 📈 Record · Audit · Calibrate
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout
        id: source_checkout
        # (2026-10-06) v4 -> v6: scripts/audit_repository_workflows.py reports
        # OUTDATED_ACTION_MAJOR on this pin, and every other production
        # workflow in this repository already runs checkout@v6. Same inputs.
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
        # (2026-10-06) v5 -> v6: same OUTDATED_ACTION_MAJOR finding; the
        # `cache: pip` input is unchanged in v6.
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            requirements.render.txt
            requirements.txt
            requirements.ml.txt

      - name: 📦 Install Dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          if [ -f "requirements.render.txt" ]; then
            python -m pip install -r requirements.render.txt
          elif [ -f "requirements.txt" ]; then
            python -m pip install -r requirements.txt
          else
            echo "::error::No requirements file found (requirements.render.txt or requirements.txt)."
            exit 1
          fi

      - name: 🚦 Skip if a production write is in flight
        id: overlap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # (2026-10-06) WHY THIS EXISTS. This clock and daily_sync's own
          # "📈 Track Performance" step run the SAME script against the SAME
          # Performance_Log. daily_sync.yml:1131-1135 records what an overlap
          # already cost once: "overlapping trackers append and rewrite
          # Performance_Log from different in-memory copies (23,799 duplicate
          # cohorts by 08-31)", and track_performance v6.41.0 still finds 27
          # matured/matured duplicate Keys counted twice by analyze. The two
          # workflows hold different concurrency groups by design (sharing one
          # would let a queued clock run cancel a PENDING sync), so the
          # overlap is prevented here instead: if a Daily Sync is queued or
          # running, this run exits 0 WITHOUT recording.
          # Safe to skip: the tracker is idempotent per Riyadh day
          # (PerformanceRecord.key is symbol|horizon|YYYYMMDD), the sync's own
          # leg records the same keys, and this workflow has a second slot.
          # Fail-OPEN: any API problem proceeds with the run and warns. A
          # missing day is worse than a rare overlap, and the overlap is the
          # condition this step merely makes less likely, not a correctness
          # guarantee.
          RUNNING="$(curl -sS --max-time 25 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/daily_sync.yml/runs?per_page=20" \
            | jq -r '[.workflow_runs[] | select(.status=="in_progress" or .status=="queued" or .status=="waiting" or .status=="pending")] | length' 2>/dev/null || echo "ERR")"

          if [[ "$RUNNING" == "ERR" || -z "${RUNNING:-}" || ! "$RUNNING" =~ ^[0-9]+$ ]]; then
            echo "::warning::Could not read Daily Sync state; proceeding (fail-open)."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$RUNNING" -gt 0 ]]; then
            echo "::notice::${RUNNING} Daily Sync run(s) queued or in progress - skipping this Performance Clock run to avoid two writers on Performance_Log. The sync's own tracker step records the same keys; the next clock slot will cover it if it does not."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "✅ No Daily Sync in flight."
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: 🔎 Resolve configuration
        id: cfg
        if: steps.overlap.outputs.skip != 'true'
        env:
          INPUT_URL: ${{ github.event.inputs.backend_url }}
          INPUT_SHEET: ${{ github.event.inputs.sheet_id }}
          VAR_URL: ${{ vars.BACKEND_BASE_URL }}
          VAR_SHEET: ${{ vars.DEFAULT_SPREADSHEET_ID }}
        run: |
          set -euo pipefail
          get_val() { for v in "$@"; do if [[ -n "${v:-}" && "$v" != "null" ]]; then echo "$v"; return 0; fi; done; return 0; }

          URL="$(get_val "${INPUT_URL:-}" "${VAR_URL:-}" "https://tadawul-fast-bridge.onrender.com")"
          URL="${URL%/}"
          if [[ ! "$URL" =~ ^https?:// ]]; then echo "::error::Invalid backend URL: $URL"; exit 1; fi
          echo "TARGET_URL=$URL" >> "$GITHUB_ENV"

          SHEET="$(get_val "${INPUT_SHEET:-}" "${VAR_SHEET:-}")"
          if [[ -z "${SHEET:-}" ]]; then
            echo "::error::Spreadsheet ID empty. Set vars.DEFAULT_SPREADSHEET_ID or pass the sheet_id input."
            exit 1
          fi
          echo "TARGET_SHEET_ID=$SHEET" >> "$GITHUB_ENV"
          echo "✅ Backend: $URL"
          echo "✅ Sheet:   $SHEET"

      - name: 💓 Backend readiness (best-effort)
        if: steps.overlap.outputs.skip != 'true'
        run: |
          set -euo pipefail
          for ep in /readyz /health /livez; do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$TARGET_URL$ep" || echo 000)"
            if [[ "$code" =~ ^2 ]]; then echo "✅ Healthy via $ep ($code)"; exit 0; fi
          done
          echo "::warning::Backend health probe did not return 2xx — a cold Render dyno may still wake on the first call."

      - name: 📈 Run performance clock
        id: run_clock
        if: steps.overlap.outputs.skip != 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}
          TFB_CHECKOUT_SHA: ${{ steps.source_checkout.outputs.commit }}
          INPUT_SIGNAL_HISTORY_MODE: ${{ github.event.inputs.signal_history_mode }}
          INPUT_RUN_AUDIT: ${{ github.event.inputs.run_audit }}
          # (2026-10-20) 1.0.3: owner opt-in scheduled maturity audit; '0' = record-only schedules (1.0.2).
          TRACK_SCHEDULED_AUDIT: ${{ vars.TRACK_SCHEDULED_AUDIT || '0' }}
          # (2026-10-21) 1.0.4: v6.47.0 historical target-session close; 'off' = v6.45.0 maturation.
          TRACK_HIST_TARGET_CLOSE: ${{ vars.TRACK_HIST_TARGET_CLOSE || 'off' }}
          TRACK_HIST_CLOSE_BUDGET: ${{ vars.TRACK_HIST_CLOSE_BUDGET || '60' }}
          TRACK_HIST_CLOSE_TIME_SEC: ${{ vars.TRACK_HIST_CLOSE_TIME_SEC || '240' }}
          # The tracker reads these directly (BackendClient + best-effort SA auth):
          BACKEND_BASE_URL: ${{ env.TARGET_URL }}
          # (2026-07-26) Backend auth wall (main.py v8.13.0): the tracker's
          # backend HTTP fetches must carry the token once Render arms
          # APP_TOKEN. track_performance.py already reads BACKEND_TOKEN and
          # sends X-APP-TOKEN + Bearer; empty secret = today's behavior.
          BACKEND_TOKEN: ${{ secrets.BACKEND_TOKEN }}
          DEFAULT_SPREADSHEET_ID: ${{ env.TARGET_SHEET_ID }}
          TRACK_SHEET_ID: ${{ env.TARGET_SHEET_ID }}
          # 2026-09-01: one-shot opt-in (v6.38.0) — set the repo Variable to 1 for ONE run, then remove it
          TRACK_DROP_DUPLICATE_ROWS: ${{ vars.TRACK_DROP_DUPLICATE_ROWS || '0' }}
          # (2026-10-11) P-189b / P-188 / P-191 FLAG MAPPING - the kill-switch-without-
          # mapping class (daily_sync.yml W1A-6g). track_performance v6.41.0 shipped
          # TRACK_DEDUP_MATURED and TRACK_RISK_BLANK on 2026-10-01 and named THIS step
          # as their env lane, but no workflow ever mapped them, so a repo Variable
          # never reached os.getenv: the 2026-10-10 export still holds the same 27
          # MATURED/MATURED duplicate Keys (20 W/W, 7 L/L), all 11,791 matured rows
          # carry 0.0 in Volatility / Max Drawdown % / Sharpe Ratio, and none of the
          # 284 [PERF-VERDICT] _Run_Log lines carries 'dedup_matured'. v6.44.0 adds
          # TRACK_DEDUP_SIGNAL_HISTORY (Signal_History same-day repeats: 21,670 of
          # 29,471 rows on 10-10, max 19 per Symbol|Date key; in v6.44.0 'enforce' is
          # parsed but MEASURE-ONLY and says so in its token). Matured/risk
          # defaults remain off/0. Operator contract: observe
          # for >= 1 run and read the [DEDUP-MATURED] / [DEDUP-SIGNAL] job-log lines
          # and the [PERF-VERDICT] tokens in _Run_Log, then arm per read-back. MUST
          # stay identical to the daily_sync.yml tracker step (ENV PARITY rule
          # below; tests/test_track_flags_mapped.py pins it): TRACK_RISK_BLANK in one
          # lane only would be rewritten to 0.0 by the other lane's next save.
          # (2026-10-12) Operator-authorized signal-repeat observation: absent
          # Variables select observe; explicit off/invalid still reach the parser.
          # ROLLBACK: set TRACK_DEDUP_SIGNAL_HISTORY to off; unsetting
          # reactivates observe. No historical deduplication is performed.
          TRACK_DEDUP_MATURED: ${{ vars.TRACK_DEDUP_MATURED || 'off' }}
          TRACK_RISK_BLANK: ${{ vars.TRACK_RISK_BLANK || '0' }}
          TRACK_DEDUP_SIGNAL_HISTORY: ${{ vars.TRACK_DEDUP_SIGNAL_HISTORY || 'observe' }}
          # (2026-10-11) v6.45.0 prospective schema / publication identities.
          # Defaults off: arm one measured lane-consistent feature at a time.
          # Immutable snapshots retain first and subsequent daily publications;
          # reruns use the same run ID. Canonical targets require price evidence.
          # Read-back: SIGNAL-PUBLICATION logs and canonical_performance export.
          # Rollback: off/0; historical target values and publications stay.
          TRACK_CANONICAL_TARGETS: ${{ vars.TRACK_CANONICAL_TARGETS || '1' }}
          TRACK_SIGNAL_PUBLICATION_MODE: ${{ vars.TRACK_SIGNAL_PUBLICATION_MODE || 'off' }}
          TRACK_PUBLICATION_ID: ${{ github.run_id }}
          # v6.13.0 ACTIVATION — surface the action-trend trajectory to a
          # user-visible Signal_Trends tab (one row per decision symbol:
          # Direction STRENGTHENING/WEAKENING/STABLE/FLIPPED, Days In Action,
          # Score Slope, Stability). The feature is default-OFF in the script;
          # this single line turns it ON for the daily Performance Clock only
          # (the correct cadence -- the 15-min sync would rewrite identical
          # daily values 96x/day). Revert by removing this line or setting "0".
          TFB_SIGNAL_TRENDS_TAB: "1"
          # ── (2026-10-06) ENV PARITY WITH THE IN-SYNC TRACKER ────────────────
          # WHY: this clock and daily_sync.yml's "📈 Track Performance" step run
          # the SAME script against the SAME Performance_Log, but the sync step
          # carried three settings this block did not, so whichever lane
          # happened to record a given Riyadh day decided the COHORT SHAPE of
          # that day's evidence. The three lines below are mirrored verbatim
          # from daily_sync.yml (lines 1152, 328 and 1164) and the two blocks
          # MUST stay identical - if you change one, change the other.
          #
          # track_performance v6.23.0+ records "1W"/"2W" as CHECKPOINTS, not
          # maturities: a time-scaled slice of the 1M thesis used to measure
          # whether a position is TRACKING its forecast. Gate S-1 criterion 4
          # ("calibration error within band on 7D/14D checkpoints") has no
          # other input, and checkpoints need ELAPSED time - days not sampled
          # cannot be recovered later. Default is "1M,3M".
          # KILL-SWITCH: delete this line -> v6.22.0 behaviour exactly.
          TRACK_HORIZONS: "1W,2W,1M,3M"
          # v6.33.0 SHADOW/REGRET. ARMED ("1") - operator Option B, 2026-08-09:
          # every Performance_Log record stamps 'Entry Selected' (col 32)
          # YES/NO from the live board's executable tickets, and the calibrate
          # report gains the BOARD_EXEC vs ALT_TOPK split plus the regret
          # headline. Without it this lane writes an EMPTY stamp, which lands
          # in NEITHER the champion nor the alternates bucket and is therefore
          # invisible to the regret split.
          TFB_TRACK_SHADOW_COHORTS: "1"
          # v6.48.0: criterion4 uses canonical forecast provenance and pp.
          # Unproven, ambiguous or duplicate targets cannot supply a sample.
          # Historical target cells and S1 thresholds remain unchanged.
          # Rollback: set both workflow lines to observe; legacy stays diagnostic.
          TFB_PERF_TARGET_UNIT_SENTRY: "enforce"
          # (2026-10-25) v6.49.0 [BOARD-COVERAGE]: the live Top_10_Investments
          # board's seated symbols (incl. GRACE ghosts) join the forced-coverage
          # set, so Signal_History / Performance_Log record the recommendations
          # the Apps Script board actually publishes (24 Oct: none of the 10
          # seated names had a snapshot). Default off = v6.48.0 byte-identical.
          # Mirrored VERBATIM in daily_sync.yml (ENV PARITY). Read-back: the
          # '[v6.49.0 BOARD-COVERAGE] board=n new=k ghosts=g' job-log line and
          # Origin Tab 'Decision_Board' in Signal_History. ROLLBACK: unset / 0.
          TFB_TRACK_BOARD_SYMBOLS: ${{ vars.TFB_TRACK_BOARD_SYMBOLS || 'off' }}
          # (2026-10-27) 1.0.8: v6.52.0 [OUTCOME-TALLY] observe logs, per audit,
          # why due records did not mature: a totals line, then one per exchange
          # calendar (and, for quote_session_unknown, minutes after the close). Measures
          # only. 'off' = v6.49.0. Mirrored in daily_sync.yml (ENV PARITY).
          # ROLLBACK: unset or off.
          TRACK_OUTCOME_TALLY: ${{ vars.TRACK_OUTCOME_TALLY || 'off' }}
          # GOOGLE_SHEETS_CREDENTIALS accepts JSON *or* base64(JSON); prefer the
          # plain secret, fall back to the _B64 variant if that is the one set.
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS != '' && secrets.GOOGLE_SHEETS_CREDENTIALS || secrets.GOOGLE_SHEETS_CREDENTIALS_B64 }}
        run: |
          set -euo pipefail

          if [ ! -f "scripts/track_performance.py" ]; then
            echo "::error::Missing scripts/track_performance.py"
            exit 1
          fi
          if [[ -z "${GOOGLE_SHEETS_CREDENTIALS:-}" ]]; then
            echo "::error::No Google credentials. Set secret GOOGLE_SHEETS_CREDENTIALS (JSON) or GOOGLE_SHEETS_CREDENTIALS_B64."
            exit 1
          fi

          if [[ "${{ github.event.inputs.enable_debug }}" == "true" ]]; then
            export LOG_LEVEL=DEBUG
          fi
          # (2026-10-12) Explicit per-run observation; inherit leaves both
          # scheduled defaults and repository Variables unchanged.
          case "${INPUT_SIGNAL_HISTORY_MODE:-inherit}" in
            inherit) ;;
            off|observe) export TRACK_DEDUP_SIGNAL_HISTORY="$INPUT_SIGNAL_HISTORY_MODE" ;;
            *) echo '::error::Manual signal mode must be inherit, off or observe.'; exit 2 ;;
          esac

          # --record : capture today's picks + per-symbol verdict snapshots
          # --audit  : historical maturity audit; explicit manual opt-in only.
          #            The audit clears and reserializes old Performance rows.
          # --analyze: action-trend block + reliability calibration (calibration
          #            also runs here unless TRACK_CALIBRATION=0)
          # --export : write <base>_*.json (perf / signal_trends / calibration)
          AUDIT_FLAG=""
          AUDIT_ENABLED=false
          if [[ "${GITHUB_EVENT_NAME:-}" == "workflow_dispatch" && "${INPUT_RUN_AUDIT:-}" == "true" ]]; then
            AUDIT_FLAG="--audit"
            AUDIT_ENABLED=true
          elif [[ "${GITHUB_EVENT_NAME:-}" == "schedule" && "${TRACK_SCHEDULED_AUDIT:-0}" == "1" && ( "${TRACK_DEDUP_MATURED:-off}" == "observe" || "${TRACK_DEDUP_MATURED:-off}" == "enforce" ) ]]; then
            # 1.0.3: owner opt-in scheduled maturity audit (see the header).
            AUDIT_FLAG="--audit"
            AUDIT_ENABLED=true
            echo "::notice::Scheduled maturity audit: TRACK_SCHEDULED_AUDIT=1, TRACK_DEDUP_MATURED=${TRACK_DEDUP_MATURED}."
          else
            if [[ "${GITHUB_EVENT_NAME:-}" == "schedule" && "${TRACK_SCHEDULED_AUDIT:-0}" == "1" ]]; then
              echo "::warning::TRACK_SCHEDULED_AUDIT=1 ignored: set TRACK_DEDUP_MATURED to observe (or enforce) first."
            fi
            # Schedules and absent/false inputs record prospectively. Override
            # inherited app defaults so --analyze cannot publish old outcomes.
            export TRACK_AUDIT=0
            export TRACK_PUBLISH_CALIBRATION=0
            export TFB_SIGNAL_TRENDS_TAB=0
            export TFB_TRACK_SUMMARY_SIDE=1
          fi

          # Genuine CLI version witness, without initializing a Sheet store.
          python scripts/track_performance.py --help > tracker_cli_help.txt

          CMD=(python scripts/track_performance.py
               --sheet-id "$TARGET_SHEET_ID"
               --record $AUDIT_FLAG --analyze --export)

          echo "📋 ${CMD[*]}"
          TS="$(date +%Y%m%d_%H%M%S)"
          LOG="perf_clock_${TS}.log"
          set -o pipefail
          code=0
          "${CMD[@]}" 2>&1 | tee "$LOG" || code=$?
          python scripts/workflow_activation_receipt.py tracker --exit-code "$code" \
            --log "$LOG" --help-witness tracker_cli_help.txt \
            --audit-enabled "$AUDIT_ENABLED" --receipt tracker_activation_receipt.json
          if [[ "$code" -ne 0 ]]; then exit "$code"; fi

          # Surface the honest "start the clock" / "insufficient evidence" lines
          # in the job log so a non-technical owner can see the clock state.
          if grep -qiE "INSUFFICIENT EVIDENCE|start the clock" "$LOG"; then
            echo "::notice::Calibration says INSUFFICIENT EVIDENCE — expected until enough matured records accumulate (first 1M cohort ~30 days after the first --record)."
          fi

      - name: 📤 Upload reports + log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tfb-performance-clock-${{ github.run_id }}
          path: |
            perf_clock_*.log
            tracker_activation_receipt.json
            tracker_cli_help.txt
            *_performance*.json
            *_signal_trends.json
            *_signal_publications.json
            *_calibration.json
            dropped_duplicates_*.csv
          retention-days: 14
          if-no-files-found: warn

      - name: 📝 Summary
        if: always()
        run: |
          set -euo pipefail
          RIYADH="$(TZ=Asia/Riyadh date '+%Y-%m-%d %H:%M:%S %Z')"
          ICON="$([[ "${{ job.status }}" == "success" ]] && echo '✅ SUCCESS' || echo '❌ FAILED')"
          {
            echo "# 📈 TFB Performance Clock"
            echo ""
            echo "| Field | Value |"
            echo "| :--- | :--- |"
            echo "| Status | $ICON |"
            echo "| Trigger | \`${{ github.event_name }}\` |"
            echo "| Time (Riyadh) | \`$RIYADH\` |"
            echo "| Backend | \`${TARGET_URL:-?}\` |"
            echo "| Sheet | \`${TARGET_SHEET_ID:-?}\` |"
            echo ""
            echo "Signal-history observe measures repeated day keys; it does not deduplicate them."
          } >> "$GITHUB_STEP_SUMMARY"
