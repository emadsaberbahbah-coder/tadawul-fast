name: Apply critical identity fix

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/_apply_critical_identity_fix.yml'
      - 'scripts/_apply_critical_identity_fix.py'
      - 'scripts/_apply_critical_identity_fix_v2.py'
      - 'scripts/critical_symbol_identity.py'
      - 'tests/test_critical_symbol_identity.py'

permissions:
  contents: read

jobs:
  apply:
    if: ${{ github.head_ref == 'fix/critical-symbol-identity-2026-07-29' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
          persist-credentials: true
          token: ${{ secrets.WORKFLOW_UPDATE_TOKEN }}

      - name: Verify workflow update token
        env:
          WORKFLOW_UPDATE_TOKEN: ${{ secrets.WORKFLOW_UPDATE_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${WORKFLOW_UPDATE_TOKEN:-}" ]]; then
            echo "::error::WORKFLOW_UPDATE_TOKEN is missing."
            exit 1
          fi

          echo "WORKFLOW_UPDATE_TOKEN is available."

      - name: Apply critical symbol identity integration
        run: |
          set -euo pipefail
          python scripts/_apply_critical_identity_fix_v2.py

      - name: Compile and test identity protection
        run: |
          set -euo pipefail

          python -m py_compile \
            scripts/run_dashboard_sync.py \
            scripts/critical_symbol_identity.py \
            tests/test_critical_symbol_identity.py \
            tests/test_recent_fixes.py

          python -m unittest tests/test_critical_symbol_identity.py

          git diff --check

          test ! -e scripts/_apply_critical_identity_fix.py
          test ! -e scripts/_apply_critical_identity_fix_v2.py
          test ! -e .github/workflows/_apply_critical_identity_fix.yml

      - name: Commit integrated fix
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "::notice::No integration changes were generated."
            exit 0
          fi

          git commit -m "Integrate critical symbol identity firewall"
          git push origin "HEAD:${{ github.head_ref }}"
