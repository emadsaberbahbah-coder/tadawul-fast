name: Full System Audit Evidence Bundle

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'apps_script/**'
      - 'core/**'
      - 'routes/**'
      - 'scripts/**'
      - 'tests/test_full_system_audit.py'
      - 'Procfile'
      - 'requirements.txt'
  workflow_dispatch:
    inputs:
      mode:
        description: 'repo = source-only; all = include optional Render/Sheets evidence when secrets are configured'
        required: true
        default: repo
        type: choice
        options:
          - repo
          - all
      strict:
        description: 'Fail the job when warnings or critical skips remain'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

concurrency:
  group: full-system-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Build cross-stack evidence bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Secrets are optional. The repo audit still runs without them.
      TFB_RENDER_BASE_URL: ${{ secrets.TFB_RENDER_BASE_URL }}
      TFB_AUDIT_TOKEN: ${{ secrets.TFB_AUDIT_TOKEN }}
      GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
      VALIDATE_SHEET_ID: ${{ secrets.TFB_SPREADSHEET_ID }}
      GITHUB_REF_PROTECTED: ${{ github.ref_protected }}
      GITHUB_REF_NAME: ${{ github.ref_name }}
      GITHUB_BASE_REF: ${{ github.base_ref }}

    steps:
      - name: Checkout audited release
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Compile audit pack
        run: |
          python -m py_compile \
            scripts/full_system_audit.py \
            tests/test_full_system_audit.py

      - name: Run audit unit tests
        run: python -m unittest tests/test_full_system_audit.py

      - name: Install project dependencies for optional production probes
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'all' }}
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run repository audit
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'repo' }}
        run: |
          STRICT_FLAG=''
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.strict }}" = 'true' ]; then
            STRICT_FLAG='--strict'
          fi
          python scripts/full_system_audit.py \
            --mode repo \
            --output-dir audit-artifacts/full-system \
            ${STRICT_FLAG}

      - name: Run full production-evidence audit
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'all' }}
        run: |
          STRICT_FLAG=''
          if [ "${{ inputs.strict }}" = 'true' ]; then
            STRICT_FLAG='--strict'
          fi
          python scripts/full_system_audit.py \
            --mode all \
            --output-dir audit-artifacts/full-system \
            ${STRICT_FLAG}

      - name: Upload evidence bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tfb-full-system-audit-${{ github.sha }}
          path: audit-artifacts/full-system
          if-no-files-found: warn
          retention-days: 30
