name: Apply BNY CI expectation fix

on:
  pull_request:
    paths:
      - 'scripts/apply_bny_ci_expectation_fix.py'
      - '.github/workflows/apply_bny_ci_expectation_fix.yml'

permissions:
  contents: write

concurrency:
  group: apply-bny-ci-expectation-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'perf/python-batch-concurrency-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 1
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Update stale expectations
        run: python scripts/apply_bny_ci_expectation_fix.py

      - name: Run focused regression tests
        run: |
          python -m pip install -q pytest numpy
          PYTHONPATH="$GITHUB_WORKSPACE" python -m pytest -q \
            tests/test_recent_fixes.py \
            tests/test_critical_symbol_identity.py

      - name: Commit test correction
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- tests/test_recent_fixes.py; then
            echo 'No test update produced.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_recent_fixes.py
          git commit -m 'test: align critical identity expectations with BNY ticker'
          git push origin "HEAD:${HEAD_BRANCH}"
