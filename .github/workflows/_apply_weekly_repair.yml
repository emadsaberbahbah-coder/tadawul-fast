name: Apply tested weekly audit repair

on:
  push:
    branches: ['fix/actions-health-20260917']
    paths: ['.github/workflows/_apply_weekly_repair.yml']

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.ref == 'refs/heads/fix/actions-health-20260917' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify reviewed bases and apply exact patch
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          expected = {
              'scripts/audit_provider_target_coverage.py': 'eade6f7075afa4b35853e97bdf71202d7b13cc90',
              'scripts/audit_full_refresh_coverage.py': '96ec75465fab28e3ef1aa6f94c46eec1968c8ac2',
              '.github/workflows/provider_target_coverage.yml': 'a0a9ba3fc8793c68661c145a711e0565b053ccb4',
              '.github/workflows/full_refresh_coverage.yml': '5da807f7f48de1ef27405f0063e7e2126ba2a31b',
              '.github/workflows/decision_surface_freshness.yml': 'c807bdd027fd06318241378ee2bd924865847aee',
          }
          for path, sha in expected.items():
              actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              if actual != sha:
                  raise SystemExit(f'Reviewed base changed: {path}')
          PY
          git apply --check scripts/_weekly_repair.patch
          git apply scripts/_weekly_repair.patch
      - name: Verify shipped regression contracts
        run: |
          set -euo pipefail
          python scripts/audit_provider_target_coverage.py --selftest
          python scripts/audit_decision_surface_freshness.py --selftest
          python -m unittest tests/test_full_refresh_coverage.py tests/test_decision_surface_freshness.py tests/test_workflow_audit_repairs.py -v
          python scripts/audit_repository_workflows.py
      - name: Commit verified repair and remove one-shot applicator
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/_weekly_repair.patch .github/workflows/_apply_weekly_repair.yml
          git add scripts/audit_provider_target_coverage.py scripts/audit_full_refresh_coverage.py .github/workflows/provider_target_coverage.yml .github/workflows/full_refresh_coverage.yml .github/workflows/decision_surface_freshness.yml
          git diff --cached --stat
          git commit -m 'fix: preserve audit time precision and fail-closed provider baseline lifecycle'
          git push origin HEAD:refs/heads/fix/actions-health-20260917
