# =============================================================================
# 🧪 Trial Labels - what the open trials would do with each stock, observe-only
# -----------------------------------------------------------------------------
# VERSION 1.1.0 (2026-11-21) -- CHAIN: THE LABELS NO LONGER WAIT FOR GITHUB'S SCHEDULE
# WHY: owner, 21 Nov 2026 02:20 Riyadh (in Arabic: review the updates and see
#       the updates they need). The first scheduled slot (20 Nov 14:05 UTC,
#       17:05 Riyadh) started at 21:45 UTC, 7 h 40 min late - the same delay
#       as every scheduled page of this repository (News Board about 8 h,
#       Pre-Open Check always after the US close) - so the labels in the rows
#       of Top_10_Investments and Portfolio_Decision would stand still.
# WHAT: the labels also run after the Exit Plan workflow, which the workbook
#       dispatches every hour at :35 (apps_script/29_Page_Refresh_Dispatch.gs),
#       when the UTC hour is one of TFB_TRIAL_LABELS_CHAIN_HOURS (repository
#       Variable; default "5 9 14" = about 08:40, 12:40 and 17:40 Riyadh; "off"
#       = cron only). A chained run writes, like a scheduled one. The cron
#       entries stay. Same rule as News & Macro Gate 1.1.0.
# VERSION 1.0.0 (2026-11-19)
#
# WHY: owner, 19 Nov 2026 18:46 Riyadh ("This new updat for news is linked
# with the recommdadtions pages like protofilo or investment pages"; 18:50,
# in Arabic: "do the best and most suitable for the project"). The two trials of
# that day - C-2 (v_trial_c2) and the news overlay (v_trial_news_overlay) -
# stood only in BigQuery and on News_Board. scripts/trial_labels.py writes the
# Trial_Labels tab: for each stock of Final_Decisions, each holding and each
# buy call of the latest call day, what C-2 and the news would do with it and
# why. 31_Final_Decision_Column.gs 1.4.0 shows the two labels in the row of
# each stock on Top_10_Investments and Portfolio_Decision.
#
# WHEN: 08:05, 12:05 and 17:05 Riyadh (05:05, 09:05 and 14:05 UTC): after the
# morning BigQuery archive (the day's buy calls are recorded around 01:00 -
# 02:00 Riyadh) and the News Board runs. A run reads about 1.5 GB in BigQuery.
#
# WRITES: only its own tab (Trial_Labels). BigQuery: SELECT only. Reads
# Final_Decisions!A1:B400 and My_Portfolio!A1:B200. No decision, score, list
# or order changes; only the Today Action Plan gives orders.
# Rollback: repository variable TFB_TRIAL_LABELS=off.
# =============================================================================
name: 🧪 Trial Labels

on:
  schedule:
    - cron: "5 5,9,14 * * *"        # 08:05, 12:05 and 17:05 Riyadh
  workflow_run:
    workflows: ["🎯 Exit Plan"]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Compute and print counts only (write nothing)"
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: "3.11"
  PYTHONUNBUFFERED: 1
  TZ: Asia/Riyadh
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  due:
    name: 🕒 Is a chained run due this hour?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.due.outputs.run }}
    steps:
      - name: 🕒 Is a chained run due this hour?
        id: due
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHAIN_HOURS: ${{ vars.TFB_TRIAL_LABELS_CHAIN_HOURS || '5 9 14' }}
        run: |
          # CHAIN (2026-11-21): a run chained to the hourly Exit Plan works only in the listed UTC hours;
          # schedule and dispatch always. "off" (or no number) = no chained run, cron only.
          RUN=true
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            HOUR=$((10#$(date -u +%H)))
            RUN=false
            for h in $CHAIN_HOURS; do
              if [[ "$h" =~ ^[0-9]+$ ]] && (( 10#$h == HOUR )); then RUN=true; fi
            done
            echo "Chained run at UTC hour $HOUR (hours: $CHAIN_HOURS): run=$RUN"
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

  labels:
    # CHAIN fix (Codex P2, PR 1043): the gate is its own job, so a chained run that is not
    # due never enters this job's concurrency group and cannot cancel or replace a run that publishes.
    needs: due
    if: needs.due.outputs.run == 'true'
    concurrency:
      group: tfb-trial-labels
      cancel-in-progress: false
    name: 🧪 Read the trial views and label each stock
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v6

      - name: 🐍 Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install dependencies
        run: python -m pip install --quiet gspread==6.2.1 google-auth requests

      - name: 🔎 Resolve spreadsheet id
        id: sheet
        env:
          VAR_SHEET: ${{ vars.DEFAULT_SPREADSHEET_ID }}
        run: |
          SID="${VAR_SHEET:-}"
          if [[ -z "$SID" ]]; then
            echo "::error::Spreadsheet ID empty. Set repository variable DEFAULT_SPREADSHEET_ID."
            exit 1
          fi
          echo "sid=$SID" >> "$GITHUB_OUTPUT"

      - name: 🧪 Write the trial labels
        env:
          PYTHONPATH: ${{ github.workspace }}
          DEFAULT_SPREADSHEET_ID: ${{ steps.sheet.outputs.sid }}
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS != '' && secrets.GOOGLE_SHEETS_CREDENTIALS || secrets.GOOGLE_SHEETS_CREDENTIALS_B64 }}
          TFB_BQ_PROJECT: ${{ vars.TFB_BQ_PROJECT || 'project-2e3530e6-2311-4aa3-b36' }}
          TFB_BQ_DATASET: ${{ vars.TFB_BQ_DATASET || 'tfb_archive' }}
          TFB_BQ_LOCATION: ${{ vars.TFB_BQ_LOCATION || 'US' }}
          TFB_TRIAL_LABELS: ${{ vars.TFB_TRIAL_LABELS || 'on' }}
          EVENT_NAME: ${{ github.event_name }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=()
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$IN_DRY_RUN" == "true" ]]; then
            ARGS+=(--dry-run)
          fi
          python scripts/trial_labels.py "${ARGS[@]}"
