name: 📰 Holding Read

# VERSION 1.0.0 (2026-11-18) -- WHAT MOVED EACH HOLDING, AND THE NEXT-SESSION READ
# WHY (owner, 18 Nov 09:36 Riyadh): after two losing sessions no page said what
# each holding's fall followed (its own news, its group or the market), and no
# page gave a view of the next session.
# WHAT: scripts/holding_read.py 1.0.0 writes the Holding_Read page (one row per
# holding: the last session's move against its market and its group, the main
# news, and the next-session read counted from the stock's own history) and the
# _Holding_Read ledger, where every read is marked HIT or MISS once the next
# session closes. Analysis only: no order follows from it.
# WHEN: after the US close, twice before the Riyadh morning, and after the
# Tadawul close. GitHub delivers schedules late; each run reads the last
# completed session, so a late run writes the same rows.
# Rollback: repository variable TFB_HOLDING_READ=off.

on:
  schedule:
    - cron: "40 21 * * 1-5"         # 00:40 Riyadh Tue-Sat: after the US close
    - cron: "10 2 * * *"            # 05:10 Riyadh
    - cron: "10 5 * * *"            # 08:10 Riyadh: the morning read, with news since the close
    - cron: "40 12 * * 0-4"         # 15:40 Riyadh Sun-Thu: after the Tadawul close
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Compute and print only (write nothing)"
        type: boolean
        default: false

concurrency:
  group: tfb-holding-read
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: "3.11"
  PYTHONUNBUFFERED: 1
  TZ: Asia/Riyadh
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  holding_read:
    name: 📰 Read each holding's last session
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v6

      - name: 🐍 Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install dependencies
        run: python -m pip install --quiet gspread==6.2.1 google-auth requests

      - name: 🔎 Resolve spreadsheet id
        id: sheet
        env:
          VAR_SHEET: ${{ vars.DEFAULT_SPREADSHEET_ID }}
        run: |
          SID="${VAR_SHEET:-}"
          if [[ -z "$SID" ]]; then
            echo "::error::Spreadsheet ID empty. Set repository variable DEFAULT_SPREADSHEET_ID."
            exit 1
          fi
          echo "sid=$SID" >> "$GITHUB_OUTPUT"

      - name: 📰 Run the holding read
        env:
          PYTHONPATH: ${{ github.workspace }}
          DEFAULT_SPREADSHEET_ID: ${{ steps.sheet.outputs.sid }}
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS != '' && secrets.GOOGLE_SHEETS_CREDENTIALS || secrets.GOOGLE_SHEETS_CREDENTIALS_B64 }}
          TFB_HOLDING_READ: ${{ vars.TFB_HOLDING_READ || 'on' }}
          TFB_HREAD_RANGE: ${{ vars.TFB_HREAD_RANGE || '5y' }}
          TFB_HREAD_VOL_WIN: ${{ vars.TFB_HREAD_VOL_WIN || '60' }}
          TFB_HREAD_MIN_N: ${{ vars.TFB_HREAD_MIN_N || '30' }}
          TFB_HREAD_EDGE_PTS: ${{ vars.TFB_HREAD_EDGE_PTS || '5' }}
          TFB_HREAD_Z: ${{ vars.TFB_HREAD_Z || '1.64' }}
          TFB_HREAD_PIN_PCT: ${{ vars.TFB_HREAD_PIN_PCT || '0.6' }}
          TFB_HREAD_SECTOR_MAP: ${{ vars.TFB_HREAD_SECTOR_MAP || '' }}
          EVENT_NAME: ${{ github.event_name }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=()
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$IN_DRY_RUN" == "true" ]]; then
            ARGS+=(--dry-run)
          fi
          python scripts/holding_read.py "${ARGS[@]}"
