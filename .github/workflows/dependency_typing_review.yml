name: Dependency security and typed-module review

# VERSION 1.1.0 (2026-10-19) -- COMPLETE INSTALLED DEPENDENCY AUDIT
# Install production pins in their own Python3.11 environment, then audit its
# resolved distributions with an isolated tool. URL pins and transitive
# dependencies must appear in the exact inventory receipt. Dependency errors
# fail the workflow; the typed baseline remains advisory. No credentials or
# production writer is available to either job.
#
# VERSION 1.0.1 (2026-10-13) -- RUNNER IMAGE PINNED TO ubuntu-24.04
# WHY (2026-10-13): pinned before ubuntu-latest moves on 19 Oct 2026; labels only (ci.yml v1.1.13).
# VERSION 1.0.0 (2026-10-11, WP-12)
# WHY: the 2026-10-10 brief found exact dependency pins but no CVE review or
# typed baseline. These read-only checks are advisory while their baseline is
# reviewed. They install no credentials, write no workbook and arm no flags.

on:
  pull_request:
    paths: ['requirements.txt', 'core/sheets/**', 'core/symbols/**', 'core/portfolio_reconciliation.py', 'core/execution_accounting.py', 'scripts/performance_math.py', 'scripts/verify_dependency_audit.py', 'tests/test_dependency_audit_receipt.py', 'pyrightconfig.json', '.github/workflows/dependency_typing_review.yml']
  schedule:
    - cron: '43 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install the production dependency environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv --without-pip "$RUNNER_TEMP/tfb-production"
          python -m pip --python "$RUNNER_TEMP/tfb-production" install -r requirements.txt
          python -m pip --python "$RUNNER_TEMP/tfb-production" check
          mkdir -p artifacts/dependency-audit
          python -m pip --python "$RUNNER_TEMP/tfb-production" list --format=json > artifacts/dependency-audit/installed.json
      - name: Install the isolated audit tool
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/tfb-auditor"
          "$RUNNER_TEMP/tfb-auditor/bin/python" -m pip install 'pip-audit==2.9.0'
      - name: Audit every installed production distribution
        shell: bash
        run: |
          set -euo pipefail
          TFB_AUDIT_PATH=$("$RUNNER_TEMP/tfb-production/bin/python" -c 'import sysconfig; print(sysconfig.get_path("purelib"))')
          "$RUNNER_TEMP/tfb-auditor/bin/python" -m pip_audit \
            --path "$TFB_AUDIT_PATH" --strict --format json \
            --output artifacts/dependency-audit/audit.json --progress-spinner off
      - name: Require exact inventory coverage and no skipped dependencies
        if: ${{ always() && !cancelled() }}
        run: >-
          python scripts/verify_dependency_audit.py
          --installed artifacts/dependency-audit/installed.json
          --audit artifacts/dependency-audit/audit.json
          --output artifacts/dependency-audit/receipt.json
      - name: Preserve dependency audit evidence
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: dependency-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/dependency-audit/
          if-no-files-found: error
          retention-days: 7
  typed-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Check the initial typed-module scope
        run: |
          python -m pip install 'pyright==1.1.405'
          pyright --project pyrightconfig.json --level error
