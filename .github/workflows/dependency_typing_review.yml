name: Dependency and typed-module review (advisory)

# VERSION 1.0.1 (2026-10-13) -- RUNNER IMAGE PINNED TO ubuntu-24.04
# WHY (2026-10-13): pinned before ubuntu-latest moves on 19 Oct 2026; labels only (ci.yml v1.1.13).
# VERSION 1.0.0 (2026-10-11, WP-12)
# WHY: the 2026-10-10 brief found exact dependency pins but no CVE review or
# typed baseline. These read-only checks are advisory while their baseline is
# reviewed. They install no credentials, write no workbook and arm no flags.

on:
  pull_request:
    paths: ['requirements.txt', 'core/sheets/**', 'core/symbols/**', 'core/portfolio_reconciliation.py', 'core/execution_accounting.py', 'scripts/performance_math.py', 'pyrightconfig.json', '.github/workflows/dependency_typing_review.yml']
  schedule:
    - cron: '43 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Audit exact dependency pins
        id: audit
        run: |
          python -m pip install 'pip-audit==2.9.0'
          code=0
          pip-audit --requirement requirements.txt --no-deps --disable-pip \
            --format json --output dependency-audit.json || code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Summarize the retained direct-pin audit
        if: always()
        env:
          AUDIT_EXIT: ${{ steps.audit.outputs.exit_code }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          try:
              report = json.loads(Path('dependency-audit.json').read_text())
              rows = report['dependencies']
              if not isinstance(rows, list) or not rows:
                  raise ValueError('dependency list unavailable')
              findings = sum(len(row.get('vulns', [])) for row in rows)
              skipped = [row['name'] for row in rows if row.get('skip_reason')]
              code = os.environ.get('AUDIT_EXIT', '')
              if code != ('1' if findings else '0'):
                  raise ValueError('process/report outcome differs or is unavailable')
              text = f'Direct pins: {findings} known advisories; {len(skipped)} skipped entries; audit exit {code}.\n'
              if skipped:
                  text += 'Skipped entries: ' + ', '.join(skipped) + '.\n'
          except Exception as exc:
              text = 'UNKNOWN: dependency audit evidence unavailable (' + type(exc).__name__ + ').\n'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as handle:
              handle.write('### Dependency review (advisory)\n\n' + text)
              handle.write('\nThis audit covers direct pins; it does not certify resolved transitive dependencies.\n')
          PY
      - name: Retain dependency audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-audit-${{ github.run_id }}
          path: dependency-audit.json
          if-no-files-found: warn
          retention-days: 30
  typed-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Check the initial typed-module scope
        run: |
          python -m pip install 'pyright==1.1.405'
          pyright --project pyrightconfig.json --level error
