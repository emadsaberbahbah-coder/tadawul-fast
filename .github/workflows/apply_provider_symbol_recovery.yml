name: 🧩 Apply Provider Symbol Recovery

on:
  pull_request:
    paths:
      - 'tmp/apply_provider_symbol_recovery.py'
      - '.github/workflows/apply_provider_symbol_recovery.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: apply-provider-symbol-recovery-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.head_ref == 'perf/python-batch-concurrency-v1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || 'perf/python-batch-concurrency-v1' }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply deterministic changes
        id: patch
        run: |
          set -euo pipefail
          python tmp/apply_provider_symbol_recovery.py
          CHANGED="$(git status --porcelain -- \
            core/symbols/normalize.py \
            scripts/critical_symbol_identity.py \
            scripts/concurrent_batch_fetch.py \
            tests/test_provider_symbol_recovery.py)"
          if [[ -n "$CHANGED" ]]; then
            echo "changed=1" >> "$GITHUB_OUTPUT"
          else
            echo "Provider recovery changes are already applied."
            echo "changed=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Compile changed Python
        if: steps.patch.outputs.changed == '1'
        run: |
          set -euo pipefail
          python -m py_compile \
            core/symbols/normalize.py \
            scripts/critical_symbol_identity.py \
            scripts/concurrent_batch_fetch.py \
            tests/test_provider_symbol_recovery.py

      - name: Run focused regression tests
        if: steps.patch.outputs.changed == '1'
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python -m unittest \
            tests/test_concurrent_batch_fetch.py \
            tests/test_provider_symbol_recovery.py \
            tests/test_critical_symbol_identity.py -v

      - name: Commit verified changes
        if: steps.patch.outputs.changed == '1'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            core/symbols/normalize.py \
            scripts/critical_symbol_identity.py \
            scripts/concurrent_batch_fetch.py \
            tests/test_provider_symbol_recovery.py
          git commit -m 'Recover provider-specific market symbols'
          git push origin HEAD:${{ github.head_ref || 'perf/python-batch-concurrency-v1' }}
