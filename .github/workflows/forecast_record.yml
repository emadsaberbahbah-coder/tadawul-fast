# =============================================================================
# 📏 Forecast Record - what the buy calls delivered against their promise, in the workbook
# -----------------------------------------------------------------------------
# VERSION 1.0.0 (2026-11-28)
#
# WHY: owner, 28 Nov 2026 01:02 Riyadh (in Arabic: at least 5 % a month on the
# capital, in all cases, or stop before the losses grow) and 01:30 ("Try to
# make full review and engening restructured looking for better results").
# The pages show each name's promise; what such promises delivered stood in
# BigQuery only (v_forecast_record, views 1.39.0: the US one-month buy calls
# promised +3.66 % and delivered +1.13 %, the Saudi ones promised +4.64 % and
# delivered -4.37 %). scripts/forecast_record.py copies the record into the
# Forecast_Record tab, which the Daily Plan (daily_plan 1.12.0,
# TFB_PLAN_HONEST observe) reads once per cut to label every name with its
# honest forecast.
#
# WHEN: after every successful run on main of the two archives the record is
# scored from - "🔬 BigQuery Symbol Deep Data" (the bars) and "🌍 BigQuery
# Market Series" (the indices) - and on dispatch. No cron: this repository's
# schedules start 6 to 8 hours late, chained runs do not.
#
# WRITES: only its own tab (Forecast_Record). BigQuery: one SELECT of
# v_forecast_record (about 0.6 GB a run). No symbol, amount or holding in the
# tab or the run log. No decision, score, list or order changes.
# Rollback: repository variable TFB_FORECAST_RECORD=off.
# =============================================================================
name: 📏 Forecast Record

on:
  workflow_run:
    workflows: ["🔬 BigQuery Symbol Deep Data", "🌍 BigQuery Market Series"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Compute and print counts only (write nothing)"
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: "3.11"
  PYTHONUNBUFFERED: 1
  TZ: Asia/Riyadh
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  record:
    # a failed archive run leaves nothing new to copy
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    name: 📏 Copy the forecast record into the workbook
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: tfb-forecast-record
      cancel-in-progress: false
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v6

      - name: 🐍 Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install dependencies
        run: python -m pip install --quiet gspread==6.2.1 google-auth requests

      - name: 🔎 Resolve spreadsheet id
        id: sheet
        env:
          VAR_SHEET: ${{ vars.DEFAULT_SPREADSHEET_ID }}
        run: |
          SID="${VAR_SHEET:-}"
          if [[ -z "$SID" ]]; then
            echo "::error::Spreadsheet ID empty. Set repository variable DEFAULT_SPREADSHEET_ID."
            exit 1
          fi
          echo "sid=$SID" >> "$GITHUB_OUTPUT"

      - name: 📏 Write the forecast record
        env:
          PYTHONPATH: ${{ github.workspace }}
          DEFAULT_SPREADSHEET_ID: ${{ steps.sheet.outputs.sid }}
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS != '' && secrets.GOOGLE_SHEETS_CREDENTIALS || secrets.GOOGLE_SHEETS_CREDENTIALS_B64 }}
          TFB_BQ_PROJECT: ${{ vars.TFB_BQ_PROJECT || 'project-2e3530e6-2311-4aa3-b36' }}
          TFB_BQ_DATASET: ${{ vars.TFB_BQ_DATASET || 'tfb_archive' }}
          TFB_BQ_LOCATION: ${{ vars.TFB_BQ_LOCATION || 'US' }}
          TFB_FORECAST_RECORD: ${{ vars.TFB_FORECAST_RECORD || 'on' }}
          EVENT_NAME: ${{ github.event_name }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=()
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$IN_DRY_RUN" == "true" ]]; then
            ARGS+=(--dry-run)
          fi
          python scripts/forecast_record.py "${ARGS[@]}"
