name: Actions Health Review

on:
  workflow_dispatch:
    inputs:
      since:
        description: 'Optional ISO UTC start (default: Sunday 00:00 Asia/Riyadh)'
        required: false
        type: string
  push:
    branches: ['fix/actions-health-20260917']
    paths: ['.github/workflows/actions_health_review.yml']

permissions:
  contents: read
  actions: read
  checks: read

concurrency:
  group: actions-health-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Inventory this week's runs and failure evidence
        uses: actions/github-script@v9
        env:
          AUDIT_SINCE: ${{ inputs.since }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const now = new Date();
            const riyadh = new Date(now.getTime() + 3 * 3600000);
            riyadh.setUTCDate(riyadh.getUTCDate() - riyadh.getUTCDay());
            riyadh.setUTCHours(0, 0, 0, 0);
            const since = process.env.AUDIT_SINCE || new Date(riyadh.getTime() - 3 * 3600000).toISOString();
            if (!Number.isFinite(Date.parse(since)) || Date.parse(since) > now.getTime()) throw new Error('Invalid audit start');
            const start = new Date(since).toISOString();
            const end = now.toISOString();
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {owner, repo, created: `${start}..${end}`, per_page: 100});
            if (runs.length >= 1000) throw new Error('Run window reaches API 1000-result limit; use a narrower since interval');
            const workflows = await github.paginate(github.rest.actions.listRepoWorkflows, {owner, repo, per_page: 100});
            const files = await github.rest.repos.getContent({owner, repo, path: '.github/workflows', ref: context.sha});
            console.log('CURRENT_FILES ' + JSON.stringify(files.data.map(f => f.name)));
            console.log('WINDOW ' + start + ' .. ' + end);
            console.log('TOTAL_RUNS ' + runs.length);
            const totals = {};
            const grouped = new Map();
            for (const r of runs) {
              const status = r.conclusion || r.status;
              totals[status] = (totals[status] || 0) + 1;
              if (!grouped.has(r.workflow_id)) grouped.set(r.workflow_id, []);
              grouped.get(r.workflow_id).push(r);
            }
            console.log('TOTALS ' + JSON.stringify(totals));
            const bad = new Set(['failure', 'timed_out', 'action_required', 'startup_failure']);
            const missing = [];
            let summary = '| Workflow | Runs | Outcomes | Latest |\n|---|---:|---|---|\n';
            const known = new Map(workflows.map(w => [w.id, w]));
            for (const r of runs) if (!known.has(r.workflow_id)) known.set(r.workflow_id, {id:r.workflow_id, name:r.name, path:r.path, state:'not_in_current_inventory'});
            for (const w of known.values()) {
              const wr = (grouped.get(w.id) || []).sort((a,b) => b.created_at.localeCompare(a.created_at));
              const counts = {};
              for (const r of wr) { const s = r.conclusion || r.status; counts[s] = (counts[s] || 0) + 1; }
              const latest = wr[0];
              console.log('WORKFLOW ' + JSON.stringify({name:w.name, path:w.path, state:w.state, runs:wr.length, outcomes:counts, latest:latest ? {id:latest.id, status:latest.conclusion || latest.status, sha:latest.head_sha} : null}));
              summary += `| ${w.name.replace(/\|/g, '/')} | ${wr.length} | ${JSON.stringify(counts)} | ${latest ? latest.conclusion || latest.status : 'not run'} |\n`;
              const failures = wr.filter(r => bad.has(r.conclusion));
              for (const r of failures) {
                const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {owner,repo,run_id:r.id,filter:'latest',per_page:100});
                const failed = jobs.filter(j => bad.has(j.conclusion));
                console.log('FAILED_RUN ' + JSON.stringify({id:r.id,path:r.path,created:r.created_at,attempt:r.run_attempt,sha:r.head_sha,jobs:failed.map(j => ({id:j.id,name:j.name,steps:(j.steps||[]).filter(s => bad.has(s.conclusion)).map(s => s.name)}))}));
                if (r.id !== failures[0].id || r.id === context.runId) continue;
                for (const j of failed) {
                  try {
                    const response = await github.request('GET /repos/{owner}/{repo}/actions/jobs/{job_id}/logs', {owner,repo,job_id:j.id});
                    const text = typeof response.data === 'string' ? response.data : Buffer.from(response.data).toString('utf8');
                    const clean = text.replace(/\u001b\[[0-9;]*m/g, '').replace(/##\[([a-z]+)\]/gi, '[$1]').replace(/::/g, ': :');
                    const lines = clean.split('\n').filter(x => /\[error\]|Traceback|Error:|Exception:|FAILED|FATAL|SyntaxError|ModuleNotFoundError|AssertionError|PermissionError|below minimum|coverage.*below|not found|No module named/i.test(x));
                    console.log('FAILURE_LOG ' + JSON.stringify({run:r.id,job:j.id,matched:lines.length,lines:lines.slice(-60)}));
                  } catch (e) {
                    if (e.status !== 404 && e.status !== 410) throw e;
                    missing.push({run:r.id,job:j.id,status:e.status});
                    console.log('LOG_UNAVAILABLE ' + JSON.stringify(missing[missing.length - 1]));
                    if (j.check_run_url) {
                      const checkId = Number(j.check_run_url.split('/').pop());
                      const annotations = await github.paginate(github.rest.checks.listAnnotations, {owner,repo,check_run_id:checkId,per_page:100});
                      console.log('CHECK_ANNOTATIONS ' + JSON.stringify({run:r.id,job:j.id,annotations:annotations.map(a => ({level:a.annotation_level,message:a.message}))}));
                    }
                  }
                }
              }
            }
            console.log('MISSING_LOGS ' + JSON.stringify(missing));
            await core.summary.addHeading('Weekly Actions inventory').addRaw(`Window: ${start} through ${end}\n\nRuns: ${runs.length}. Historical log gaps: ${missing.length}; original run outcomes preserved.\n\n${summary}`).write();
