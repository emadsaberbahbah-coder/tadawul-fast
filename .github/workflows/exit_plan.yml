# =============================================================================
# 🎯 Exit Plan - the stop and the target of every holding, reviewed every morning
# -----------------------------------------------------------------------------
# VERSION 1.3.0 (2026-11-11)
#
# 1.3.0: maps TFB_EXIT_LOT_CARRY (scripts/exit_plan.py 1.2.0 [LOT-CARRY],
# default 'off' = byte-identical). When on, a holding whose lots change (part
# of one lot sold, or a lot closed) keeps its stop ratchet and its once-only
# TAKE PROFIT flag. No schedule, trigger or concurrency change. Rollback:
# unset or off.
#
# VERSION 1.2.0 (2026-11-11)
#
# 1.2.0: ACTIVE HOURS (owner, 11 Nov 14:16). 07:30 (with the e-mail), then
# minute 35 from 08:35 to 00:35 Riyadh: 18 runs; the 00:35 run reads the US
# close. Nothing runs from 01:00 to 07:00, when both markets are shut.
#
# 1.1.0: HOURLY (owner, 11 Nov 12:52: the outcome pages refresh at least every
# hour, automatically). The page and the ledger are refreshed every hour on
# completed daily bars (exit_plan 1.1.0); the e-mail still goes once a day,
# after the 07:30 run (cron '30 4 * * *') or on a manual run with send_mail.
#
# WHY: fixed stops and targets do not fit every stock; the owner asked for
# levels per stock (its own volatility, forecast, confidence and news) that
# are reviewed and raised after every close, shown in the workbook and sent by
# e-mail each morning (11 Nov 2026). Evidence: project doc
# TFB_Stop_Loss_and_Take_Profit_Review_2026-11-11.
#
# WHEN: 07:30 Riyadh every day (04:30 UTC): after the US close of the night
# and before the Tadawul open. GitHub may start a scheduled run late; the
# result reads "daily bars to <date>" so a late start is visible.
#
# WRITES: only its own two tabs (_Exit_Plan, Exit_Plan) and one e-mail.
# Advisory only - no order is placed, changed or cancelled.
# Rollback: repository variable TFB_EXIT_PLAN=off (TFB_EXIT_MAIL=0 stops the
# e-mail only).
# =============================================================================
name: 🎯 Exit Plan

on:
  schedule:
    - cron: "30 4 * * *"            # 07:30 Riyadh: the morning run, with the e-mail
    - cron: "35 5-21 * * *"         # 08:35-00:35 Riyadh at minute 35: page and ledger, no e-mail
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Compute and print only (write and send nothing)"
        type: boolean
        default: false
      send_mail:
        description: "Send the e-mail on this manual run"
        type: boolean
        default: false

concurrency:
  group: tfb-exit-plan
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: "3.11"
  PYTHONUNBUFFERED: 1
  TZ: Asia/Riyadh
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  exit_plan:
    name: 🎯 Review stops and targets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v6

      - name: 🐍 Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install dependencies
        run: python -m pip install --quiet gspread==6.2.1 google-auth

      - name: 🔎 Resolve spreadsheet id
        id: sheet
        env:
          VAR_SHEET: ${{ vars.DEFAULT_SPREADSHEET_ID }}
        run: |
          SID="${VAR_SHEET:-}"
          if [[ -z "$SID" ]]; then
            echo "::error::Spreadsheet ID empty. Set repository variable DEFAULT_SPREADSHEET_ID."
            exit 1
          fi
          echo "sid=$SID" >> "$GITHUB_OUTPUT"

      - name: 🎯 Run the exit plan
        env:
          PYTHONPATH: ${{ github.workspace }}
          DEFAULT_SPREADSHEET_ID: ${{ steps.sheet.outputs.sid }}
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS != '' && secrets.GOOGLE_SHEETS_CREDENTIALS || secrets.GOOGLE_SHEETS_CREDENTIALS_B64 }}
          TFB_MAIL_FROM: ${{ secrets.TFB_MAIL_FROM }}
          TFB_MAIL_PASSWORD: ${{ secrets.TFB_MAIL_PASSWORD }}
          TFB_MAIL_TO: ${{ secrets.TFB_MAIL_TO }}
          TFB_EXIT_PLAN: ${{ vars.TFB_EXIT_PLAN || 'on' }}
          TFB_EXIT_MAIL: ${{ vars.TFB_EXIT_MAIL || '1' }}
          TFB_EXIT_ATR_INIT: ${{ vars.TFB_EXIT_ATR_INIT || '3' }}
          TFB_EXIT_MIN_PCT: ${{ vars.TFB_EXIT_MIN_PCT || '8' }}
          TFB_EXIT_MAX_PCT: ${{ vars.TFB_EXIT_MAX_PCT || '12' }}
          TFB_EXIT_SR_MAX_PCT: ${{ vars.TFB_EXIT_SR_MAX_PCT || '8' }}
          TFB_EXIT_TRAIL_ATR: ${{ vars.TFB_EXIT_TRAIL_ATR || '3' }}
          TFB_EXIT_TRAIL_TIGHT_ATR: ${{ vars.TFB_EXIT_TRAIL_TIGHT_ATR || '2' }}
          TFB_EXIT_BE_PCT: ${{ vars.TFB_EXIT_BE_PCT || '0.3' }}
          TFB_EXIT_TIME_SESSIONS: ${{ vars.TFB_EXIT_TIME_SESSIONS || '45' }}
          TFB_EXIT_NEWS_DAYS: ${{ vars.TFB_EXIT_NEWS_DAYS || '3' }}
          TFB_EXIT_FC_REL_MIN: ${{ vars.TFB_EXIT_FC_REL_MIN || '70' }}
          TFB_EXIT_EARN_WARN_DAYS: ${{ vars.TFB_EXIT_EARN_WARN_DAYS || '5' }}
          TFB_EXIT_LOT_CARRY: ${{ vars.TFB_EXIT_LOT_CARRY || 'off' }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_CRON: ${{ github.event.schedule }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
          IN_SEND: ${{ inputs.send_mail }}
        run: |
          ARGS=()
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$IN_DRY_RUN" == "true" ]]; then
            ARGS+=(--dry-run)
          fi
          # the e-mail: the 07:30 run only (or a manual run that asks for it); the hourly runs refresh the page
          if [[ ( "$EVENT_NAME" == "schedule" && "$EVENT_CRON" == "30 4 * * *" ) || "$IN_SEND" == "true" ]]; then
            ARGS+=(--send)
          fi
          python scripts/exit_plan.py "${ARGS[@]}"
