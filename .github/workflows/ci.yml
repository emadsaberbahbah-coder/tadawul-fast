# VERSION 1.1.13 (2026-10-13) -- RUNNER IMAGE PINNED TO ubuntu-24.04
#
# v1.1.13: every job here (and in every other workflow) runs on the explicit
# ubuntu-24.04 label instead of ubuntu-latest. Pure label substitution: 55
# labels in 34 files; no job, step, dependency, gate or verdict moved. The
# lean lane also runs tests/test_runner_pin_ubuntu2404.py, which keeps the
# pin and, given the dda1211 base copies, proves by yaml.safe_load equality
# that nothing but the labels changed. A new manual-only workflow,
# runner_image_canary.yml, tests a candidate image without touching this one.
#
# WHY v1.1.13 (2026-10-13): GitHub is moving the ubuntu-latest label to a
# newer Ubuntu image (26.04) from 19 Oct 2026. Every scheduled lane depends on
# what the image ships: daily_sync preflight uses the image's own curl, jq,
# python3 and pip3; lean-unit and several Python tests start the image's
# node; and setup-python needs a Python 3.11 build for the image's Ubuntu
# release. A silent image swap would change all of that at once, unreviewed. ubuntu-24.04 is the image
# ubuntu-latest resolves to today, so the pin changes nothing now; it only
# stops the swap. The pin freezes the OS release, not tool versions: GitHub
# keeps updating the 24.04 image weekly.
# UN-PIN (owner): when GitHub offers the ubuntu-26.04 label, dispatch
# .github/workflows/runner_image_canary.yml with runner_image=ubuntu-26.04.
# Only after a green canary, flip the labels (preferably to the explicit
# ubuntu-26.04, not back to ubuntu-latest) in one reviewed commit and update
# PINNED_LABEL in tests/test_runner_pin_ubuntu2404.py in the same commit.
# ROLLBACK (date-dependent): a full revert is neutral only BEFORE 19 Oct
# 2026, while ubuntu-latest still resolves to ubuntu-24.04. From 19 Oct 2026
# a revert would move all 55 jobs, every scheduled writer included, onto the
# unverified new image at once - the swap this pin exists to prevent. After
# that date roll back with a forward edit instead: remove the canary
# workflow, the pin harness and the harness's lean-list line together (each
# references the other), keep every runs-on on the explicit ubuntu-24.04,
# and never return a label to ubuntu-latest without a green canary on the
# image ubuntu-latest then points to.
#
