#   waits forever. v1.0.2 patched one instance (integrations/**); this closes
#   the class. push: keeps its filter; workflow_dispatch unchanged; every job,
#   step and pin below is byte-identical to v1.0.4.
#
# VERSION 1.0.4 (2026-08-23) — FIX v1.0.3'S OWN DEFECT + LANDING-ORDER PROOFING
#
# v1.0.4:
# - FIX (v1.0.3 shipped broken, caught live): the previous last pytest
#   argument (tests/test_learning_guards.py) carried no trailing backslash,
#   so v1.0.3's appended entry became a SEPARATE SHELL COMMAND — the runner
#   executed the test file as a program and failed with Permission denied.
#   The lesson is now protocol: workflow run-blocks are executed as-written
#   in the proof battery, in every relevant repo state.
# - HARDEN: the fixtures file participates via an existence gate ($EXTRA),
#   so this workflow can NEVER red on the landing order of a sibling file
#   (the PR-#248 / two-route commit class). File absent => the suite is
