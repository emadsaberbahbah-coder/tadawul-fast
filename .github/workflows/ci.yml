            tests/test_news_lifecycle.py \
            tests/test_engine_cache_expiry.py \
            tests/test_insights_cohort_receipt.py \
            tests/test_portfolio_membership_reader.py \
            tests/test_calendar_sticky_contracts.py \
            tests/test_tfb_backtest_rank_evidence.py \
            tests/test_ci_required_verdict.py \
            tests/test_secret_redaction.py \
            tests/test_task_error_redaction.py \
            tests/test_de_forecast_score_basis.py \
            tests/test_portfolio_fee_basis.py \
            tests/test_execution_accounting.py \
            tests/test_portfolio_reconciliation.py \
            tests/test_portfolio_action_reconciliation.py \
            tests/test_pf_research_view_p06.py \
            tests/test_portfolio_exact_funding.py \
            tests/test_portfolio_reconciliation_cli.py \
            tests/test_ob_quote_evidence.py \
            tests/test_executable_quote_conflicts.py \
            tests/test_ob_portfolio_certification.py \
            tests/test_sheet_presentation_contract.py \
            tests/test_sync_sheet_presentation.py \
