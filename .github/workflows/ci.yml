            tests/test_full_refresh_coverage.py \
            tests/test_github_workflow_run_window.py \
            tests/test_monitor_recovery_guidance.py \
            tests/test_render_audit_summary.py \
            tests/test_approved_universe_scope.py \
            tests/test_approved_universe_workflow.py \
            tests/test_approved_scope_native_binding.py \
            tests/test_workflow_activation_observe.py \
            tests/test_activation_rollout_evidence_workflows.py \
            tests/test_name_identity_evidence.py \
            tests/test_name_identity_workflow.py \
            tests/test_decision_surface_freshness.py \
            tests/test_final_decision_publication.py \
            tests/test_final_publication_workflow.py \
            tests/test_matrix_validation_scope.py \
            tests/test_release_decision_feed.py \
            tests/test_sync_fetchfail_truth_p162.py \
            tests/test_sync_insights_publication.py \
            tests/test_sync_publication_clock.py \
            tests/test_shadow_scorer_regret_read_failure.py \
            tests/test_opportunity_builder.py \
            tests/test_ob_board_funding.py \
            tests/test_ob_research_diversify.py \
            tests/test_core_repair_readback.py \
            tests/test_recent_fixes.py \
            tests/test_portfolio_actions.py \
            tests/test_pf_confirm_calendar_failclosed.py \
            tests/test_pf_confirm_session_p168b.py \
            tests/test_scoring_engine_contract.py \
            tests/test_top10_selector.py \
            tests/test_top10_kpi_label_compat.py \
            tests/test_learning_guards.py \
            tests/test_sync_outcome_audit.py \
            tests/test_sync_audit_cancelled_source.py \
            tests/test_verify_manifest_pins.py \
            tests/test_security_pins_20261013.py \
            tests/test_de_roi12_ceiling_tuple_noise_wp3ab.py \
            tests/test_de_fc_tuple_coherence_p102.py \
            tests/test_de_eq_roi_backfill_sentry_p143.py \
            tests/test_de_margin_publish_p152.py \
            tests/test_de_f7_settle_unresolved.py \
            tests/test_sync_rank_overall_page.py \
            tests/test_verified_name_labels.py \
            tests/test_renew_verified_name_labels.py \
            tests/test_universe_maintenance.py \
            tests/test_sheet_payload_digest.py \
            tests/test_ob_settle_unresolved.py \
            tests/test_workflow_flag_mappings.py \
            tests/test_verify_optional_rollout_flags.py \
            tests/test_runner_pin_ubuntu2404.py \
            tests/test_tp_target_unit_sentry_p158.py \
            tests/test_track_force_coverage_p180.py \
            tests/test_track_board_coverage.py \
            tests/test_tp_dedup_matured_p189b.py \
            tests/test_tp_dedup_signal_p191.py \
            tests/test_track_flags_mapped.py \
            tests/test_tracker_canonical_publications.py \
            tests/test_tp_zero_baseline_p201.py \
            tests/test_learning_metric_fixes.py \
            tests/test_performance_summary_integrity.py \
            tests/test_argaam_loopguard_b6.py \
            tests/test_ycp_quote_breaker_isolation.py \
            tests/test_ycp_singleflight_cancellation.py \
            tests/test_ycp_loopguard_b6.py \
            tests/test_backup_upload_resume.py \
            tests/test_release_auto_source.py \
            tests/test_ob_conviction_sizing.py $EXTRA
          echo "::endgroup::"

      - name: 🧪 Work-brief capture, repair and pure contract regressions
        run: |
          python -m pytest -q \
            tests/test_capture_evidence.py \
            tests/test_pit_repair.py \
            tests/test_ob_usx_subunit.py \
            tests/test_performance_math_extraction.py \
