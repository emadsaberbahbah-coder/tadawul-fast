  # ==========================================================================
  # JOB 3 — schema / route contract (BLOCKING)
  # ==========================================================================
  # test_schema_alignment.py builds a FastAPI TestClient. Keep this lean, but
  # pin the framework stack to the exact production versions in requirements.txt
  # so the contract gate validates what Render actually deploys.
  contract:
    name: 📐 Schema & route contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install production-pinned contract deps
        run: |
          python -m pip install -U pip
          python -m pip install \
            "numpy==1.26.4" \
            pytest \
            "fastapi==0.115.14" \
            "starlette==0.41.3" \
            "httpx==0.27.2" \
            "pydantic==2.13.2" \
            "pydantic-core==2.46.2" \
            "anyio==4.13.0"

      - name: 📐 Run schema alignment
        run: |
          echo "::group::pytest (contract)"
          # PY-4 (2026-07-26): the exact current-schema contract is now an
          # UNCONDITIONAL gate — previously only the legacy alignment test
          # ran here, and tests.yml guards the exact test behind a path
          # filter that omits schema_registry.py, so a registry change
          # could dodge the strongest check entirely.
          python -m pytest -q \
            tests/test_schema_alignment.py \
            tests/test_current_schema_contract.py \
            tests/test_opportunity_blocked_invariant.py \
            tests/test_board_funding_route.py \
            tests/test_insights_cohort_route.py \
            tests/test_portfolio_reconciliation_route.py \
            tests/test_calendar_completeness.py \
            tests/test_calendar_partial_fill.py \
            tests/test_quote_epoch_producer.py \
            tests/test_redaction_boundaries.py \
            tests/test_route_error_redaction.py \
            tests/test_eodhd_error_redaction.py \
            tests/test_margin_unit_cache_contract.py \
            tests/test_analysis_fallback_publication.py \
            tests/test_analysis_sheet_rows_rank_withheld.py \
            tests/test_route_mount_compat.py
          echo "::endgroup::"

  # ==========================================================================
  # JOB 4 — deterministic data engine suite (BLOCKING)
  # ==========================================================================
  # The engine tests classify synthetic rows and inspect engine contracts;
  # they do not fetch provider data or require credentials. All 39 pass offline.
  # Keep the full requirements.txt install so this gate exercises the production
  # dependency stack. Dependency-install failures also block the final verdict.
  heavy:
    name: ⚙️ Data engine suite (blocking)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install full requirements
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt
          python -m pip install pytest "openpyxl==3.1.5" "reportlab==5.0.1" "pypdf==6.20.0"

      - name: ⚙️ Run data engine suite
        run: |
          echo "::group::pytest (heavy)"
          python -m pytest -q tests/test_data_engine_v2.py
          echo "::endgroup::"

      - name: ⚙️ Run scoring-settle and news cancellation regressions
        run: |
          python -m pytest -q \
            tests/test_de_f7_scoring_settle.py \
            tests/test_de_f7_intrinsic_display_basis.py \
            tests/test_news_singleflight_cancellation.py

      - name: 🧪 Daily brief unavailable-evidence and blocked-decision regressions
        run: python -m pytest -q tests/test_daily_brief_blocked_inputs.py

      - name: 💵 Run exported-workbook cash certification regressions
        run: python -m pytest -q tests/test_cash_snapshot_certification.py

      - name: 📊 Run workbook DQ audit harness (WP-0)
        # The golden run on the real export (P12) is skipped here: the export is
        # never committed. P1-P11 exercise the checks on synthetic workbooks.
        run: python -m pytest -q tests/test_workbook_dq_audit.py

      - name: ⚙️ Run outcome evidence with production calendars
        run: python -m pytest -q tests/test_outcome_price_evidence.py

      - name: 📐 Run supplier and scoring margin unit regressions
        run: |
          python -m pytest -q \
            tests/test_margin_scoring_unit_contract.py \
            tests/test_margin_producer_unit_receipts.py

      - name: 🧪 Work-brief publication, policy and workbook regressions
        # Full production dependencies exercise the real engine/provider
        # modules; installed openpyxl keeps export/calibration suites active.
        run: |
          python -m pytest -q \
            tests/test_forecast_precision_settlement_integration.py \
            tests/test_de_price_precision.py \
            tests/test_usx_currency_lockstep.py \
            tests/test_identity_guard.py \
            tests/test_crypto_provider_identity.py \
            tests/test_sync_klg_crypto_name_p192.py \
            tests/test_de_horizon_coherence_f6.py \
            tests/test_de_strict_invest_gate_fixp.py \
            tests/test_export_audit_v120.py \
            tests/test_calibration_report.py \
            tests/test_eq_roi_unit_sentry.py \
            tests/test_pf_dd_fee_guards.py \
            tests/test_no_import_side_effects.py

      - name: 🛡️ Run isolated Yahoo fundamentals loop-guard regression
        run: python -m pytest -q tests/test_yf_loopguard_p203.py

  # ==========================================================================
  # JOB 5 — gate summary
  # ==========================================================================
  # Single line in the Actions tab answering 'did the things that guard money
  # actually run', so the answer never has to be reconstructed from four
  # separate job logs. Every required job, including the engine, must succeed.
  summary:
    name: 📋 CI verdict
    runs-on: ubuntu-24.04
    needs: [compile, lean-unit, contract, heavy]
    if: always()
    steps:
      - name: 📋 Print verdict
        run: |
          echo "compile   : ${{ needs.compile.result }}"
          echo "lean-unit : ${{ needs.lean-unit.result }}"
          echo "contract  : ${{ needs.contract.result }}"
          echo "heavy     : ${{ needs.heavy.result }}"
          if [ "${{ needs.compile.result }}" = "success" ] \
          && [ "${{ needs.lean-unit.result }}" = "success" ] \
          && [ "${{ needs.contract.result }}" = "success" ] \
          && [ "${{ needs.heavy.result }}" = "success" ]; then
            echo "VERDICT: CLEAN — decision layer verified on this commit."
          else
            echo "VERDICT: FAIL — do not deploy this commit."
            exit 1
          fi
