# VERSION 1.0.2 (2026-08-23) — IR-095: integrations/** JOINS THE PATH FILTER
#
# v1.0.2:
# - FIX: both trigger path filters omitted 'integrations/**'. Consequence,
#   observed live on PR #248 (integrations/google_sheets_service.py v6.2.0):
#   this workflow never fires, so the REQUIRED '📋 CI verdict' status sits
#   "Expected — waiting" forever and the merge button is permanently dead.
#   Any integrations-only change was structurally unmergeable via PR — the
#   exact orphaned-path class the WHY section below documents, still living
#   in this file's own trigger block. Two additive lines; nothing else moves.
#
# VERSION 1.0.1 (2026-07-29) — CONTRACT ENVIRONMENT PIN
#
# v1.0.1:
# - FIX: the schema/route contract job previously installed unconstrained latest
#   FastAPI, Starlette, httpx and Pydantic. On 2026-07-29 that resolved to
#   FastAPI 0.140.13 / Starlette 1.3.1 / httpx 0.28.1, while production is
#   exactly pinned in requirements.txt to FastAPI 0.115.14 / Starlette 0.41.3 /
#   httpx 0.27.2 / Pydantic 2.13.2. The version drift changed router/TestClient
#   behaviour and made the contract job report that mounted /sheet-rows routes
#   did not exist even though all router imports and mounts completed cleanly.
# - Contract dependencies now match the production pins exactly. This keeps the
#   blocking API-contract gate reproducible and tests the framework actually
#   deployed on Render, rather than an unreviewed future framework release.
#
# WHY THIS EXISTS (root-cause evidence, verified live on main 2026-07-24):
#
#   1. tests/test_portfolio_actions.py EXISTS in the repository (527 lines,
#      pure stdlib + unittest) and NOTHING RUNS IT.
#        - tests.yml path filter covers only core/stats.py, core/quality_gates.py,
#          core/analysis/opportunity_builder.py and three test files. A commit
#          touching ONLY core/analysis/portfolio_actions.py matches nothing, so
#          the workflow never fires. Its py_compile step on line 41 does list
#          portfolio_actions.py — but that line is unreachable for exactly the
#          commits that need it.
#        - daily_sync.yml DOES fire on every push, but its ci-tests job runs only
#          test_scoring_engine_contract.py, test_schema_alignment.py and
#          test_recent_fixes.py. None of them import portfolio_actions.
#      Net effect: portfolio_actions.py went 1.4.0 -> 1.7.1 in three days — the
#      module that decides EXIT / TRIM / ADD on live capital — with ZERO of its
#      own tests ever executing. The suite was written, committed, and orphaned.
#
#   2. The same hole covers main.py, routes/advanced_analysis.py,
#      scripts/verify_deployment.py, scripts/run_dashboard_sync.py,
#      scripts/track_performance.py and scripts/run_daily_brief.py.
#
#   Under the Gate & Evidence Register §5, a defect shipped into the decision
#   layer during the window is an engine-caused integrity failure: TAINTED day
#   -> window RESTART (~4 weeks). This workflow is the cheapest available
#   insurance against that outcome, and it changes ZERO production behaviour:
#   it reads the repository and runs tests. It writes nothing, deploys nothing,
#   touches no workbook, needs no secrets, and requires no ENV change.
#
# WHY IT IS A SEPARATE FILE AND NOT AN EDIT TO daily_sync.yml
#   daily_sync.yml now holds a single write lease on the production workbook
#   (concurrency fix, same date). CI living inside that workflow would queue
#   behind a 115-minute sync before reporting. As its own workflow with its own
#   concurrency group, CI reports in ~2 minutes regardless of what the sync is
#   doing. The two changes are designed to compose.
#
# Enumerated lanes retain their fast, dependency-specific checks. Whole-suite
# discovery below now runs every repository test on the pinned full stack.
# Live endpoint requests remain in scripts/smoke_endpoints.py and are never
# triggered by pytest discovery.
#
# RELATIONSHIP TO tests.yml
#   tests.yml (foundations-tests) is left untouched and now overlaps this file.
#   That redundancy is accepted on purpose: nothing working gets modified inside
#   the evidence window. Retiring it is a post-2026-08-16 cleanup item.
#
# ROLLBACK: restore v1.0.0. No production file depends on this workflow.
# ============================================================================

name: ✅ CI

on:
  push:
    paths:
      - 'main.py'
      - 'config/approved_universe_scope_v1.json'
      - 'core/**'
      - 'routes/**'
      - 'scripts/**'
      - 'integrations/**'
      - 'apps_script/**'
      - 'tests/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - '.github/workflows/**'
  # v1.0.5 (2026-08-31): pull_request is UNFILTERED on purpose. The required
  # '📋 CI verdict' status can only exist when this workflow runs; a paths
  # filter here made every PR outside the list (docs/evidence JSON, PR #322/
  # #324/#325 today; integrations/** on PR #248 before v1.0.2) permanently
  # "Expected — waiting" and unmergeable. push: stays filtered so the expensive
  # jobs still skip unrelated pushes. A docs-only PR now costs one clean run.
  pull_request:
  workflow_dispatch:

# Own group, deliberately NOT shared with the sync workflow's workbook lease.
# cancel-in-progress is safe here: CI writes nothing, so pre-empting a
# superseded run costs nothing and gives faster feedback on the newest commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:

  # Advisory for one green week; making it required is a repo-settings action.
  whole-suite:
    name: 🧪 Whole suite (pinned Python 3.11)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install production pins and test-only workbook dependency
        run: python -m pip install -r requirements.txt pytest "openpyxl==3.1.5" "reportlab==5.0.1" "pypdf==6.20.0"
      - name: Discover every offline regression
        run: python -m pytest -q tests

  framework-drift:
    name: 🔭 Python 3.13 and latest FastAPI (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install current contract framework in its own job
        run: >-
          python -m pip install --upgrade fastapi starlette httpx pydantic
          pydantic-settings python-dotenv pytest numpy prometheus-client requests
          PyYAML anyio aiohttp gspread google-auth tenacity
      - name: Verify real mounted families and their response contracts
        run: python -m pytest -q tests/test_schema_alignment.py tests/test_route_mount_compat.py


  # ==========================================================================
  # JOB 1 — syntax floor across the ENTIRE codebase (BLOCKING)
  # ==========================================================================
  # compileall imports nothing, so it needs no dependencies and cannot be
  # defeated by a missing provider or absent credentials. It is the one check
  # that covers all 111 Python files including the ones no suite touches.
  compile:
    name: 🧱 Compile all production code
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🧱 compileall — main.py, core/, routes/, scripts/
        run: |
          echo "::group::compileall"
          python -m compileall -q main.py core routes scripts
          echo "::endgroup::"
          echo "✅ every production file parses"

      - name: 🧱 compileall — tests/
        run: |
          python -m compileall -q tests
          echo "✅ every test file parses"

      - name: 🔎 ruff — syntax errors and undefined names (whole tree)
        run: |
          # v1.1.4: E9 = syntax/io errors, F63 = invalid comparisons, F7 = misplaced
          # statements, F82 = undefined names. No style rules; nothing here can
          # fail on formatting. Exact pin, matching requirements.txt convention.
          python -m pip install -q "ruff==0.16.8"
          ruff check --select E9,F63,F7,F82 --output-format concise .
          echo "✅ no syntax errors or undefined names"

  # ==========================================================================
  # JOB 2 — decision-layer unit suites (BLOCKING)
  # ==========================================================================
  # Lean install (numpy + pytest, with PyYAML for workflow mapping tests)
  # preserves the deliberately small image inherited from tests.yml:
  # it forces the pure-numpy statistical fallbacks and the graceful-degradation
  # paths (gspread/pandas absent) to be exercised, exactly as they run in the
  # lean web image. If these pass on numpy alone, they pass everywhere.
  #
  # tests/conftest.py bootstraps the repo root onto sys.path (line 48), and
  # `python -m pytest` is used rather than bare `pytest` so the working
  # directory is importable. Both are required for `from core...` to resolve.
  lean-unit:
    name: 🧪 Decision-layer suites (lean)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install minimal deps (numpy + pytest + workflow YAML parser)
        run: |
          python -m pip install -U pip
          python -m pip install "numpy>=1.26.4,<2.0.0" pytest "PyYAML==6.0.3"

      - name: 🎯 py_compile the decision layer
        run: |
          python -m py_compile \
            core/stats.py \
            core/quality_gates.py \
            core/scoring.py \
            core/analysis/opportunity_builder.py \
            core/analysis/portfolio_actions.py \
            core/analysis/top10_selector.py

      - name: 🧪 Run decision-layer suites
        run: |
          echo "::group::pytest (lean)"
          # v1.0.4: existence-gated — see header. Unquoted $EXTRA vanishes
          # when empty; single-token path, no word-splitting risk.
          EXTRA=""
          if [ -f tests/test_sai_falsegreen_fixtures.py ]; then
            EXTRA="tests/test_sai_falsegreen_fixtures.py"
          fi
          python -m pytest -q \
            tests/test_stats.py \
            tests/test_quality_gates.py \
            tests/test_provider_capability_routing.py \
            tests/test_successful_acquisition_freshness.py \
            tests/test_data_validity_token_anchor.py \
            tests/test_portfolio_acquisition_census.py \
            tests/test_portfolio_active_targets.py \
            tests/test_portfolio_ledger_labels.py \
            tests/test_pf_minor_unit_ccy_guard.py \
            tests/test_scheduled_portfolio_refresh.py \
            tests/test_news_intelligence_contracts.py \
            tests/test_insights_cohort_receipt.py \
            tests/test_portfolio_membership_reader.py \
            tests/test_calendar_sticky_contracts.py \
            tests/test_tfb_backtest_rank_evidence.py \
            tests/test_ci_required_verdict.py \
            tests/test_secret_redaction.py \
            tests/test_task_error_redaction.py \
            tests/test_de_forecast_score_basis.py \
            tests/test_portfolio_fee_basis.py \
            tests/test_execution_accounting.py \
            tests/test_portfolio_reconciliation.py \
            tests/test_portfolio_action_reconciliation.py \
            tests/test_portfolio_exact_funding.py \
            tests/test_portfolio_reconciliation_cli.py \
            tests/test_ob_quote_evidence.py \
            tests/test_executable_quote_conflicts.py \
            tests/test_ob_portfolio_certification.py \
            tests/test_sheet_presentation_contract.py \
            tests/test_sync_sheet_presentation.py \
            tests/test_sync_warnings_compact_wp6.py \
            tests/test_intraday_quote_refresh_contract.py \
            tests/test_calendar_completeness.py \
            tests/test_calendar_atomic_publication.py \
            tests/test_outcome_price_evidence.py \
            tests/test_portfolio_blank_fee_witness.py \
            tests/test_checkpoint_target_contract.py \
            tests/test_margin_unit_cache_contract.py \
            tests/test_full_refresh_coverage.py \
            tests/test_approved_universe_scope.py \
            tests/test_approved_universe_workflow.py \
            tests/test_approved_scope_native_binding.py \
            tests/test_workflow_activation_observe.py \
            tests/test_activation_rollout_evidence_workflows.py \
            tests/test_name_identity_evidence.py \
            tests/test_name_identity_workflow.py \
            tests/test_decision_surface_freshness.py \
            tests/test_final_decision_publication.py \
            tests/test_final_publication_workflow.py \
            tests/test_release_decision_feed.py \
            tests/test_sync_fetchfail_truth_p162.py \
            tests/test_sync_insights_publication.py \
