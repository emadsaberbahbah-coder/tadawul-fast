# .github/workflows/ci.yml
# ============================================================================
# TFB UNIVERSAL CI -- every production-critical file, every push
# ============================================================================
# VERSION 1.0.11 (2026-10-08) -- EXECUTION REPLAY AND MARGIN UNIT CONTRACTS
#
# v1.0.11:
# - Require offline execution replay tests in the lean job.
# - Require supplier-to-scoring margin unit tests in the full-dependency job.
#
# v1.0.10:
# - Promote the existing deterministic data-engine suite to blocking after
#   verifying all 39 tests pass offline. Keep its production dependency install.
# - Include heavy in the required verdict so failure, cancellation or a skipped
#   engine run cannot publish CLEAN. Add a regression executing the actual
#   verdict shell with injected job outcomes to the blocking lean suite.
# - Run scoring-settle and news shared-task cancellation regressions in the
#   same required job, where engine and provider dependencies already exist.
# - Run exported-workbook cash certification in the same job with test-only
#   openpyxl pinned to the version already used by workbook_backup.yml.
#
# v1.0.9:
# - Run the new project-review regressions in the existing blocking jobs.
#   Pure Python suites use the lean environment; HTTP and mounted-route
#   boundaries use the production-pinned contract environment.
# - Keep all existing suites and required verdicts.
#
# v1.0.8:
# - ADD the builder + mounted-route regression proving an exact engine BLOCKED
#   identity cannot receive a funded opportunity ticket, even when legacy env
#   and request criteria try to disable the invariant. The same suite proves
#   WATCHLIST remains governed by the existing broad investability policy.
# - The suite runs in the contract job because its mounted-route leg imports
#   FastAPI/TestClient; the lean-unit job deliberately installs only NumPy and
#   pytest.
#
# v1.0.7:
# - ADD the Argaam and Yahoo chart-provider loopguard regressions to the
#   blocking lean-unit job. Both suites guard production fixes delivered in
#   PR #718, but neither was referenced by any workflow after merge.
# - Both suites run without network access in the lean image; checks that
#   need a golden-tree path or optional httpx pool support skip explicitly.
# - Nothing is removed and no existing entry moves.
#
# v1.0.6:
# - ADD six suites to the blocking lean-unit job. The 2026-10-06 review found
#   67 of 91 test files run by NO workflow, which is the same orphaned-suite
#   class this file was created to close (see WHY below) - only one layer
#   down, in the harnesses rather than the unit suites. Four of the six guard
#   scripts/track_performance.py, the module that owns the OUTCOME evidence
#   (Performance_Log, maturation, the S-1 calibration block):
#     tests/test_tp_target_unit_sentry_p158.py  (P-158 target-unit sentry)
#     tests/test_track_force_coverage_p180.py   (P-180 forced coverage)
#     tests/test_tp_dedup_matured_p189b.py      (P-189b matured duplicates)
#     tests/test_tp_zero_baseline_p201.py       (P-201 zero-forecast baseline)
#     tests/test_sync_outcome_audit.py          (did the pages refresh?)
#     tests/test_sync_audit_cancelled_source.py (cancelled-source audit gate)
#     tests/test_verify_manifest_pins.py        (deployment-manifest drift)
# - WHY THEY COULD NOT BE ADDED BEFORE, and what changed: the four
#   track_performance harnesses each load the module with importlib, and the
#   module registered three Prometheus metrics UNGUARDED at import, so the
#   SECOND load in one pytest process died at collection with "Duplicated
#   timeseries in CollectorRegistry". track_performance v6.42.0 adds a
#   double-import guard (_metric()), and the four now collect together in one
#   run - measured 8 passed in 0.77s. Two of them also pinned exact version
#   strings and exact self-test counts ("PASS 18/18"), which went red on every
#   release that added a case; those are now version-tuple floors and k==k
#   assertions, so a passing suite stays passing without hand re-pinning.
# - Every suite added here is zero-network (in-memory sheet stubs) and runs in
#   the same lean numpy+pytest image as the rest of the job.
# - Nothing is removed and no existing entry moves.
#
#
# v1.0.5:
# - FIX: the pull_request trigger no longer carries a paths filter. Root cause
#   re-observed on PR #322/#324/#325 (docs/evidence/*.json): a path outside the
#   list cannot generate the REQUIRED '📋 CI verdict' status, so the ruleset
#   waits forever. v1.0.2 patched one instance (integrations/**); this closes
#   the class. push: keeps its filter; workflow_dispatch unchanged; every job,
#   step and pin below is byte-identical to v1.0.4.
#
# VERSION 1.0.4 (2026-08-23) — FIX v1.0.3'S OWN DEFECT + LANDING-ORDER PROOFING
#
# v1.0.4:
# - FIX (v1.0.3 shipped broken, caught live): the previous last pytest
#   argument (tests/test_learning_guards.py) carried no trailing backslash,
#   so v1.0.3's appended entry became a SEPARATE SHELL COMMAND — the runner
#   executed the test file as a program and failed with Permission denied.
#   The lesson is now protocol: workflow run-blocks are executed as-written
#   in the proof battery, in every relevant repo state.
# - HARDEN: the fixtures file participates via an existence gate ($EXTRA),
#   so this workflow can NEVER red on the landing order of a sibling file
#   (the PR-#248 / two-route commit class). File absent => the suite is
#   exactly the eight v1.0.2 files; present => nine.
#
# VERSION 1.0.3 (2026-08-23) — IR-092: FALSE-GREEN FIXTURES JOIN THE LEAN SUITE
#
# v1.0.3:
# - ADD tests/test_sai_falsegreen_fixtures.py to the lean decision-layer
#   suite: the four rows the 2026-08-23 review caught publishing as INVEST
#   while carrying fetch_failed (UNI.MI, KE=F, ALI=F, the Copper zombie)
#   are permanent regression cases against the REAL
#   apply_surface_action_invariants — armed => all four die with audit
#   tags; unarmed => strict no-op, same object back. One list entry;
#   nothing else moves.
#
# VERSION 1.0.2 (2026-08-23) — IR-095: integrations/** JOINS THE PATH FILTER
#
# v1.0.2:
# - FIX: both trigger path filters omitted 'integrations/**'. Consequence,
#   observed live on PR #248 (integrations/google_sheets_service.py v6.2.0):
#   this workflow never fires, so the REQUIRED '📋 CI verdict' status sits
#   "Expected — waiting" forever and the merge button is permanently dead.
#   Any integrations-only change was structurally unmergeable via PR — the
#   exact orphaned-path class the WHY section below documents, still living
#   in this file's own trigger block. Two additive lines; nothing else moves.
#
# VERSION 1.0.1 (2026-07-29) — CONTRACT ENVIRONMENT PIN
#
# v1.0.1:
# - FIX: the schema/route contract job previously installed unconstrained latest
#   FastAPI, Starlette, httpx and Pydantic. On 2026-07-29 that resolved to
#   FastAPI 0.140.13 / Starlette 1.3.1 / httpx 0.28.1, while production is
#   exactly pinned in requirements.txt to FastAPI 0.115.14 / Starlette 0.41.3 /
#   httpx 0.27.2 / Pydantic 2.13.2. The version drift changed router/TestClient
#   behaviour and made the contract job report that mounted /sheet-rows routes
#   did not exist even though all router imports and mounts completed cleanly.
# - Contract dependencies now match the production pins exactly. This keeps the
#   blocking API-contract gate reproducible and tests the framework actually
#   deployed on Render, rather than an unreviewed future framework release.
#
# WHY THIS EXISTS (root-cause evidence, verified live on main 2026-07-24):
#
#   1. tests/test_portfolio_actions.py EXISTS in the repository (527 lines,
#      pure stdlib + unittest) and NOTHING RUNS IT.
#        - tests.yml path filter covers only core/stats.py, core/quality_gates.py,
#          core/analysis/opportunity_builder.py and three test files. A commit
#          touching ONLY core/analysis/portfolio_actions.py matches nothing, so
#          the workflow never fires. Its py_compile step on line 41 does list
#          portfolio_actions.py — but that line is unreachable for exactly the
#          commits that need it.
#        - daily_sync.yml DOES fire on every push, but its ci-tests job runs only
#          test_scoring_engine_contract.py, test_schema_alignment.py and
#          test_recent_fixes.py. None of them import portfolio_actions.
#      Net effect: portfolio_actions.py went 1.4.0 -> 1.7.1 in three days — the
#      module that decides EXIT / TRIM / ADD on live capital — with ZERO of its
#      own tests ever executing. The suite was written, committed, and orphaned.
#
#   2. The same hole covers main.py, routes/advanced_analysis.py,
#      scripts/verify_deployment.py, scripts/run_dashboard_sync.py,
#      scripts/track_performance.py and scripts/run_daily_brief.py.
#
#   Under the Gate & Evidence Register §5, a defect shipped into the decision
#   layer during the window is an engine-caused integrity failure: TAINTED day
#   -> window RESTART (~4 weeks). This workflow is the cheapest available
#   insurance against that outcome, and it changes ZERO production behaviour:
#   it reads the repository and runs tests. It writes nothing, deploys nothing,
#   touches no workbook, needs no secrets, and requires no ENV change.
#
# WHY IT IS A SEPARATE FILE AND NOT AN EDIT TO daily_sync.yml
#   daily_sync.yml now holds a single write lease on the production workbook
#   (concurrency fix, same date). CI living inside that workflow would queue
#   behind a 115-minute sync before reporting. As its own workflow with its own
#   concurrency group, CI reports in ~2 minutes regardless of what the sync is
#   doing. The two changes are designed to compose.
#
# WHY THE TEST LIST IS EXPLICIT AND NOT `pytest tests/`
#   Deliberate. Two suites in tests/ cannot pass in a bare CI image and would
#   turn this gate permanently red — and a gate that cries wolf is worse than no
#   gate (the lesson verify_deployment.py v1.0.14 learned the same day):
#     - tests/test_endpoints.py is a LIVE smoke-test CLI (argparse + requests)
#       that expects a running backend. It is a tool, not a unit suite. It is
#       the natural seed for a post-window authenticated smoke workflow and is
#       intentionally excluded here.
#     - tests/test_data_engine_v2.py imports the 738 KB engine and its provider
#       stack. It runs separately in the blocking `heavy` job below using full
#       production dependencies; its deterministic tests do not call providers.
#   Adding a suite to the blocking jobs is a deliberate act with evidence, never
#   a wildcard.
#
# RELATIONSHIP TO tests.yml
#   tests.yml (foundations-tests) is left untouched and now overlaps this file.
#   That redundancy is accepted on purpose: nothing working gets modified inside
#   the evidence window. Retiring it is a post-2026-08-16 cleanup item.
#
# ROLLBACK: restore v1.0.0. No production file depends on this workflow.
# ============================================================================

name: ✅ CI

on:
  push:
    paths:
      - 'main.py'
      - 'core/**'
      - 'routes/**'
      - 'scripts/**'
      - 'integrations/**'
      - 'tests/**'
      - 'requirements*.txt'
      - '.github/workflows/**'
  # v1.0.5 (2026-08-31): pull_request is UNFILTERED on purpose. The required
  # '📋 CI verdict' status can only exist when this workflow runs; a paths
  # filter here made every PR outside the list (docs/evidence JSON, PR #322/
  # #324/#325 today; integrations/** on PR #248 before v1.0.2) permanently
  # "Expected — waiting" and unmergeable. push: stays filtered so the expensive
  # jobs still skip unrelated pushes. A docs-only PR now costs one clean run.
  pull_request:
  workflow_dispatch:

# Own group, deliberately NOT shared with the sync workflow's workbook lease.
# cancel-in-progress is safe here: CI writes nothing, so pre-empting a
# superseded run costs nothing and gives faster feedback on the newest commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:

  # ==========================================================================
  # JOB 1 — syntax floor across the ENTIRE codebase (BLOCKING)
  # ==========================================================================
  # compileall imports nothing, so it needs no dependencies and cannot be
  # defeated by a missing provider or absent credentials. It is the one check
  # that covers all 111 Python files including the ones no suite touches.
  compile:
    name: 🧱 Compile all production code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5

      - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🧱 compileall — main.py, core/, routes/, scripts/
        run: |
          echo "::group::compileall"
          python -m compileall -q main.py core routes scripts
          echo "::endgroup::"
          echo "✅ every production file parses"

      - name: 🧱 compileall — tests/
        run: |
          python -m compileall -q tests
          echo "✅ every test file parses"

  # ==========================================================================
  # JOB 2 — decision-layer unit suites (BLOCKING)
  # ==========================================================================
  # Lean install (numpy + pytest only) is inherited from tests.yml on purpose:
  # it forces the pure-numpy statistical fallbacks and the graceful-degradation
  # paths (gspread/pandas absent) to be exercised, exactly as they run in the
  # lean web image. If these pass on numpy alone, they pass everywhere.
  #
  # tests/conftest.py bootstraps the repo root onto sys.path (line 48), and
  # `python -m pytest` is used rather than bare `pytest` so the working
  # directory is importable. Both are required for `from core...` to resolve.
  lean-unit:
    name: 🧪 Decision-layer suites (lean)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5

      - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install minimal deps (numpy + pytest only)
        run: |
          python -m pip install -U pip
          python -m pip install "numpy>=1.26.4,<2.0.0" pytest

      - name: 🎯 py_compile the decision layer
        run: |
          python -m py_compile \
            core/stats.py \
            core/quality_gates.py \
            core/scoring.py \
            core/analysis/opportunity_builder.py \
            core/analysis/portfolio_actions.py \
            core/analysis/top10_selector.py

      - name: 🧪 Run decision-layer suites
        run: |
          echo "::group::pytest (lean)"
          # v1.0.4: existence-gated — see header. Unquoted $EXTRA vanishes
          # when empty; single-token path, no word-splitting risk.
          EXTRA=""
          if [ -f tests/test_sai_falsegreen_fixtures.py ]; then
            EXTRA="tests/test_sai_falsegreen_fixtures.py"
          fi
          python -m pytest -q \
            tests/test_stats.py \
            tests/test_quality_gates.py \
            tests/test_provider_capability_routing.py \
            tests/test_successful_acquisition_freshness.py \
            tests/test_data_validity_token_anchor.py \
            tests/test_portfolio_acquisition_census.py \
            tests/test_portfolio_active_targets.py \
            tests/test_portfolio_ledger_labels.py \
            tests/test_pf_minor_unit_ccy_guard.py \
            tests/test_scheduled_portfolio_refresh.py \
            tests/test_news_intelligence_contracts.py \
            tests/test_calendar_sticky_contracts.py \
            tests/test_tfb_backtest_rank_evidence.py \
            tests/test_ci_required_verdict.py \
            tests/test_secret_redaction.py \
            tests/test_task_error_redaction.py \
            tests/test_de_forecast_score_basis.py \
            tests/test_portfolio_fee_basis.py \
            tests/test_execution_accounting.py \
            tests/test_portfolio_blank_fee_witness.py \
            tests/test_checkpoint_target_contract.py \
            tests/test_margin_unit_cache_contract.py \
            tests/test_full_refresh_coverage.py \
            tests/test_decision_surface_freshness.py \
            tests/test_sync_fetchfail_truth_p162.py \
            tests/test_opportunity_builder.py \
            tests/test_ob_board_funding.py \
            tests/test_ob_research_diversify.py \
            tests/test_core_repair_readback.py \
            tests/test_recent_fixes.py \
            tests/test_portfolio_actions.py \
            tests/test_scoring_engine_contract.py \
            tests/test_top10_selector.py \
            tests/test_learning_guards.py \
            tests/test_sync_outcome_audit.py \
            tests/test_sync_audit_cancelled_source.py \
            tests/test_verify_manifest_pins.py \
            tests/test_tp_target_unit_sentry_p158.py \
            tests/test_track_force_coverage_p180.py \
            tests/test_tp_dedup_matured_p189b.py \
            tests/test_tp_zero_baseline_p201.py \
            tests/test_argaam_loopguard_b6.py \
            tests/test_ycp_quote_breaker_isolation.py \
            tests/test_ycp_singleflight_cancellation.py \
            tests/test_ycp_loopguard_b6.py $EXTRA
          echo "::endgroup::"

      - name: ✅ Coverage note
        run: |
          echo "portfolio_actions suite executed — the gap this workflow exists to close."

      - name: 🧪 Final board funding (full Apps Script source)
        run: node tests/js/decision_board_funding.test.js

  # ==========================================================================
  # JOB 3 — schema / route contract (BLOCKING)
  # ==========================================================================
  # test_schema_alignment.py builds a FastAPI TestClient. Keep this lean, but
  # pin the framework stack to the exact production versions in requirements.txt
  # so the contract gate validates what Render actually deploys.
  contract:
    name: 📐 Schema & route contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5

      - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install production-pinned contract deps
        run: |
          python -m pip install -U pip
          python -m pip install \
            "numpy==1.26.4" \
            pytest \
            "fastapi==0.115.14" \
            "starlette==0.41.3" \
            "httpx==0.27.2" \
            "pydantic==2.13.2" \
            "pydantic-core==2.46.2" \
            "anyio==4.13.0"

      - name: 📐 Run schema alignment
        run: |
          echo "::group::pytest (contract)"
          # PY-4 (2026-07-26): the exact current-schema contract is now an
          # UNCONDITIONAL gate — previously only the legacy alignment test
          # ran here, and tests.yml guards the exact test behind a path
          # filter that omits schema_registry.py, so a registry change
          # could dodge the strongest check entirely.
          python -m pytest -q \
            tests/test_schema_alignment.py \
            tests/test_current_schema_contract.py \
            tests/test_opportunity_blocked_invariant.py \
            tests/test_board_funding_route.py \
            tests/test_redaction_boundaries.py \
            tests/test_route_error_redaction.py \
            tests/test_eodhd_error_redaction.py \
            tests/test_margin_unit_cache_contract.py
          echo "::endgroup::"

  # ==========================================================================
  # JOB 4 — deterministic data engine suite (BLOCKING)
  # ==========================================================================
  # The engine tests classify synthetic rows and inspect engine contracts;
  # they do not fetch provider data or require credentials. All 39 pass offline.
  # Keep the full requirements.txt install so this gate exercises the production
  # dependency stack. Dependency-install failures also block the final verdict.
  heavy:
    name: ⚙️ Data engine suite (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5

      - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install full requirements
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt
          python -m pip install pytest "openpyxl==3.1.5"

      - name: ⚙️ Run data engine suite
        run: |
          echo "::group::pytest (heavy)"
          python -m pytest -q tests/test_data_engine_v2.py
          echo "::endgroup::"

      - name: ⚙️ Run scoring-settle and news cancellation regressions
        run: |
          python -m pytest -q \
            tests/test_de_f7_scoring_settle.py \
            tests/test_news_singleflight_cancellation.py

      - name: 💵 Run exported-workbook cash certification regressions
        run: python -m pytest -q tests/test_cash_snapshot_certification.py

      - name: 📐 Run supplier and scoring margin unit regressions
        run: |
          python -m pytest -q \
            tests/test_margin_scoring_unit_contract.py \
            tests/test_margin_producer_unit_receipts.py

  # ==========================================================================
  # JOB 5 — gate summary
  # ==========================================================================
  # Single line in the Actions tab answering 'did the things that guard money
  # actually run', so the answer never has to be reconstructed from four
  # separate job logs. Every required job, including the engine, must succeed.
  summary:
    name: 📋 CI verdict
    runs-on: ubuntu-latest
    needs: [compile, lean-unit, contract, heavy]
    if: always()
    steps:
      - name: 📋 Print verdict
        run: |
          echo "compile   : ${{ needs.compile.result }}"
          echo "lean-unit : ${{ needs.lean-unit.result }}"
          echo "contract  : ${{ needs.contract.result }}"
          echo "heavy     : ${{ needs.heavy.result }}"
          if [ "${{ needs.compile.result }}" = "success" ] \
          && [ "${{ needs.lean-unit.result }}" = "success" ] \
          && [ "${{ needs.contract.result }}" = "success" ] \
          && [ "${{ needs.heavy.result }}" = "success" ]; then
            echo "VERDICT: CLEAN — decision layer verified on this commit."
          else
            echo "VERDICT: FAIL — do not deploy this commit."
            exit 1
          fi
