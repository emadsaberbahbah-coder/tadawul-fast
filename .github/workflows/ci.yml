      - name: 🧮 Run model and display basis regressions (lean)
        run: |
          python -m pytest -q \
            tests/test_de_f7_scoring_settle.py \
            tests/test_de_f7_settle_v2.py \
            tests/test_de_f7_settle_shadow.py \
