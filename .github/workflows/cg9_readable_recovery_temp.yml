name: TEMP CG9 Readable Source Recovery

on:
  push:
    branches:
      - agent/cg9-gas-renewable-pause-lease
    paths:
      - '.github/workflows/cg9_readable_recovery_temp.yml'
      - '.tmp_cg9_readable.gs'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/upload-artifact@v7
        with:
          name: cg9-readable-${{ github.run_id }}
          path: .tmp_cg9_readable.gs
          retention-days: 1
