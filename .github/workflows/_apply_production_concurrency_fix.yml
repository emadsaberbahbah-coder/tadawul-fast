name: Apply production concurrency fix

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/_apply_production_concurrency_fix.yml'
      - 'scripts/_apply_production_concurrency_fix.py'
      - 'scripts/run_inline_page_recovery.py'
      - 'tests/test_inline_page_recovery.py'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.head_ref == 'fix/production-concurrency-inline-recovery-2026-07-29' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1

      - name: Apply fail-closed workflow redesign
        run: python scripts/_apply_production_concurrency_fix.py

      - name: Compile and test recovery code
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/run_inline_page_recovery.py \
            scripts/plan_sync_recovery.py \
            scripts/audit_sync_outcome.py \
            tests/test_inline_page_recovery.py
          python -m unittest \
            tests/test_sync_outcome_audit.py \
            tests/test_sync_recovery_plan.py \
            tests/test_inline_page_recovery.py
          git diff --check
          test ! -e scripts/_apply_production_concurrency_fix.py
          test ! -e .github/workflows/_apply_production_concurrency_fix.yml

      - name: Commit final workflow files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix production concurrency and inline page recovery"
          git push origin HEAD:${{ github.head_ref }}
