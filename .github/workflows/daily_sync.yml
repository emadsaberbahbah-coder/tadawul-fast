name: 🏦 Tadawul Dashboard Advanced Sync

# =============================================================================
# v2.0.0 — 4-HOURLY FULL-COVERAGE SYNC (Fix BF-1 / BF-2 / BF-3)
# =============================================================================
# WHY (evidence: _Run_Log 12,845 entries + _Status, audited 2026-07-25):
# Four of the eight sync keys had silently stopped refreshing altogether —
# Mutual_Funds last automated refresh 9 Jul, Commodities_FX 14 Jul,
# Market_Leaders 16 Jul, Global_Markets 17 Jul — while the five decision-cockpit
# pages kept updating from the Apps Script trigger (437 fires in 7 days). The
# result was an 8-day-stale universe in which only 193 of 6,511 Global_Markets
# rows were current, 73 of 300 audited candidates failed the Data Trust gate on
# staleness, and the Top-10 scan returned "0 qualified from 10,311 rows" — a
# figure the daily brief then cited as market evidence.
#
# THREE DEFECTS, in order of severity:
#
#   BF-1  sanitize_keys() DISCARDED ITS OWN WORK. Its final dedup step read
#         $RAW_KEYS — the untouched input — instead of the progressively
#         sanitised $raw, overwriting every prior transformation. Two knock-on
#         effects, both proven by exec-test:
#           (a) upper_underscore() maps space -> underscore, so applying it to a
#               LIST collapsed all keys into one token. This bug was invisible
#               only because the dedup step threw its output away.
#           (b) uppercasing, comma handling, TOP10 aliasing and removal of the
#               forbidden KSA_TADAWUL / ADVISOR_CRITERIA keys were all reverted.
#         Consequence: any DEFAULT_SYNC_KEYS value that was lowercase, comma-
#         separated, aliased or carried a legacy key reached validate_keys_allowed
#         unsanitised and the workflow EXITED 1 at the configuration step. The
#         sync did not degrade — it stopped completely, and silently, because
#         nothing downstream of a failed config step writes to _Status.
#         FIX: normalise EACH key rather than the list (space is a separator,
#         never part of a key), and dedup $raw in awk with no subprocess that
#         can desync from it. Verified 9/9 on lowercase, comma, semicolon,
#         dash, JSON-array, duplicate, forbidden-key and empty input.
#
#   BF-2  THE SCHEDULE CANCELLED ITSELF. cron fired every 15 minutes while
#         concurrency.cancel-in-progress killed the run already in flight, and
#         all scheduled runs shared one group. Measured page durations from
#         _Status total 9.8 min — and Market_Leaders (6.4s) and Mutual_Funds
#         (6.8s) were measured on SINGLE-ROW refreshes, not full batches of
#         1,025 and 2,471 rows. A genuine full sync exceeds 15 minutes, so the
#         queue never reached the heavy universe pages before the next cron
#         cancelled it. The light cockpit pages survived only because the Apps
#         Script trigger refreshes them independently.
#         FIX: 4-hourly cadence; cancel-in-progress restricted to PR/push.
#
#   BF-3  A REPO VARIABLE COULD SILENTLY NARROW COVERAGE. get_val prefers
#         vars.DEFAULT_SYNC_KEYS over DEFAULT_KEYS_CANONICAL, so a shortened
#         variable dropped pages with no warning in any log.
#         FIX: on a scheduled full_sync, missing canonical keys raise a warning
#         and the canonical eight are forced.
#
# CADENCE: 00:00 04:00 08:00 12:00 16:00 20:00 UTC
#        = 03:00 07:00 11:00 15:00 19:00 23:00 Riyadh (UTC+3), six runs/day.
#        A 4-hour gap against a 10–20 minute sync leaves ample headroom.
#
# OPERATOR CHECK THIS FILE CANNOT PERFORM: confirm Settings → Secrets and
# variables → Actions → Variables → DEFAULT_SYNC_KEYS lists all eight canonical
# keys, or is absent. Also confirm the workflow is enabled — GitHub silently
# auto-disables scheduled workflows after 60 days of repository inactivity.
#
# Zero jobs or steps removed. Changes confined to: schedule, concurrency,
# sync-dashboard timeout, and the key-resolution block.
# =============================================================================

on:
  # ✅ CI quality gate
  pull_request:
  push:
    branches: [main, master]

  # ✅ Production scheduler (UTC; Riyadh UTC+3)
  # v2.0.0 BF-2: was "0,15,30,45 * * * *" (every 15 min) — self-cancelling.
  schedule:
    - cron: "0 */4 * * *"

  # ✅ Manual run
  workflow_dispatch:
    inputs:
      backend_url:
        description: "🌐 Backend URL Override"
        required: false
        type: string
      sheet_id:
        description: "📊 Spreadsheet ID Override"
        required: false
        type: string
      run_mode:
        description: "🚀 Execution Mode"
        required: true
        default: "full_sync"
        type: choice
        options: [full_sync, health_only, single_key]
      single_key:
        description: "🔑 Specific Key (if single_key mode)"
        required: false
        default: "MARKET_LEADERS"
        type: string
      google_creds_json:
        description: "🔐 Service Account JSON (Emergency Only - Prefer Secrets)"
        required: false
        type: string
      enable_debug:
        description: "🐛 Enable Debug Logging"
        required: false
        default: false
        type: boolean

# v2.0.0 BF-2: cancel-in-progress now applies ONLY to PR/push, where superseding
# a stale CI run is correct. Scheduled syncs must be allowed to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

permissions:
  contents: read
  id-token: write
  actions: read

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: "3.11"
  PYTHONUNBUFFERED: 1
  TZ: Asia/Riyadh
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # =============================================================================
  # ✅ CI TESTS — runs on push/PR (merge blocker)
  # =============================================================================
  ci-tests:
    name: 🧪 CI Tests (Schema Alignment + Contracts)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            requirements.render.txt
            requirements.txt
            requirements.ml.txt

      - name: 📦 Install Dependencies (CI tests)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel

          if [ -f "requirements.render.txt" ]; then
            python -m pip install -r requirements.render.txt
          elif [ -f "requirements.txt" ]; then
            python -m pip install -r requirements.txt
          else
            echo "::error::No requirements file found (requirements.render.txt or requirements.txt)."
            exit 1
          fi

          python -m pip install -q pytest

      - name: 🧪 Run Tests (hard fail on missing gates)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          echo "::group::CI Tests"

          if [ ! -f "tests/test_schema_alignment.py" ]; then
            echo "::error::Missing required gate: tests/test_schema_alignment.py"
            exit 1
          fi

          if [ -f "test_scoring_engine_contract.py" ]; then
            SCORE_TEST="test_scoring_engine_contract.py"
          elif [ -f "core/test_scoring_engine_contract.py" ]; then
            SCORE_TEST="core/test_scoring_engine_contract.py"
          elif [ -f "tests/test_scoring_engine_contract.py" ]; then
            SCORE_TEST="tests/test_scoring_engine_contract.py"
          else
            echo "::error::test_scoring_engine_contract.py not found (root/core/tests)."
            exit 1
          fi

          python -m pytest -q "$SCORE_TEST" tests/test_schema_alignment.py
          echo "::endgroup::"

  # =============================================================================
  # Scheduled/Manual SYNC workflow (production automation)
  # =============================================================================
  preflight-validation:
    name: 🛡️ Pre-flight Validation
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    outputs:
      validated: ${{ steps.validate.outputs.validated }}

    steps:
      - name: ✅ Validate Runner Environment
        id: validate
        run: |
          set -euo pipefail
          echo "::group::System Information"
          echo "OS: $(uname -a)"
          df -h /
          free -h || true
          echo "::endgroup::"

          MISSING_TOOLS=()
          for tool in curl jq python3 pip3; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              MISSING_TOOLS+=("$tool")
            fi
          done

          if [ ${#MISSING_TOOLS[@]} -ne 0 ]; then
            echo "::error::Missing required tools: ${MISSING_TOOLS[*]}"
            exit 1
          fi

          echo "validated=true" >> "$GITHUB_OUTPUT"

  sync-dashboard:
    name: 🚀 Data Sync
    runs-on: ubuntu-latest
    environment: production
    # v2.0.0 BF-2: was 25. A full 8-key sync of ~10,300 universe rows plus the
    # cockpit pages needs headroom; 25 min was tight even without BF-2.
    timeout-minutes: 50
    needs: preflight-validation
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.preflight-validation.outputs.validated == 'true' }}

    steps:
      - name: 📥 Secure Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            requirements.render.txt
            requirements.txt
            requirements.ml.txt

      - name: 📦 Install Dependencies
        run: |
          set -euo pipefail
          echo "::group::Pip Install Log"
          python -m pip install --upgrade pip setuptools wheel

          if [ -f "requirements.render.txt" ]; then
            python -m pip install -r requirements.render.txt
          elif [ -f "requirements.txt" ]; then
            python -m pip install -r requirements.txt
          else
            echo "::error::No requirements file found (requirements.render.txt or requirements.txt)."
            exit 1
          fi
          echo "::endgroup::"

      - name: 🧪 Run Contract + Schema Alignment Tests (sync guard)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          echo "::group::Tests"
          python -c "import pytest" 2>/dev/null || python -m pip install -q pytest

          if [ -f "test_scoring_engine_contract.py" ]; then
            python -m pytest -q test_scoring_engine_contract.py
          elif [ -f "core/test_scoring_engine_contract.py" ]; then
            python -m pytest -q core/test_scoring_engine_contract.py
          elif [ -f "tests/test_scoring_engine_contract.py" ]; then
            python -m pytest -q tests/test_scoring_engine_contract.py
          else
            echo "::error::test_scoring_engine_contract.py not found (root/core/tests)."
            exit 1
          fi

          # schema drift gate (warning-only for scheduler to avoid cron spam)
          if [ -f "tests/test_schema_alignment.py" ]; then
            python -m pytest -q tests/test_schema_alignment.py || echo "::warning::Schema alignment test failed (scheduler continues)."
          else
            echo "::warning::tests/test_schema_alignment.py not found; schema drift gate not running in scheduler."
          fi
          echo "::endgroup::"

      - name: ⚙️ Smart Configuration Resolution (robust for schedule + manual)
        id: smart_config
        env:
          INPUT_URL: ${{ github.event.inputs.backend_url }}
          INPUT_SHEET: ${{ github.event.inputs.sheet_id }}
          INPUT_MODE: ${{ github.event.inputs.run_mode }}
          INPUT_KEY: ${{ github.event.inputs.single_key }}
          INPUT_DEBUG: ${{ github.event.inputs.enable_debug }}
          INPUT_CREDS: ${{ github.event.inputs.google_creds_json }}

          VAR_URL: ${{ vars.BACKEND_BASE_URL }}
          VAR_SHEET: ${{ vars.DEFAULT_SPREADSHEET_ID }}
          VAR_DEFAULT_KEYS: ${{ vars.DEFAULT_SYNC_KEYS }}

          SECRET_CREDS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          SECRET_CREDS_B64: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS_B64 }}

          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          get_val() {
            for v in "$@"; do
              if [[ -n "${v:-}" && "$v" != "null" && "$v" != "undefined" ]]; then
                echo "$v"
                return 0
              fi
            done
            return 0
          }

          # ---------------------------------------------------------------
          # v2.0.0 BF-1 — key sanitisation, rebuilt.
          #
          # The v1 implementation ended with a python heredoc that read
          # $RAW_KEYS (the untouched input) instead of the progressively
          # sanitised $raw, so it silently reverted every transformation above
          # it. That also concealed a second bug: upper_underscore() maps space
          # to underscore, which is correct for ONE key but collapses a LIST
          # into a single token. Any non-canonical DEFAULT_SYNC_KEYS therefore
          # reached validate_keys_allowed unsanitised and the job exited 1.
          #
          # This version normalises each key independently — space, comma,
          # semicolon and pipe are separators, never part of a key — and dedups
          # in awk over the same stream, so nothing can desync from it.
          # Accepts: space / comma / semicolon / pipe / newline separated, JSON
          # arrays, mixed case, dashes, duplicates. Drops forbidden legacy keys.
          # ---------------------------------------------------------------
          sanitize_keys() {
            local raw="${1:-}"
            raw="$(echo "$raw" | tr -d '\r')"

            # JSON array input -> one key per line
            if echo "$raw" | jq -e 'type=="array"' >/dev/null 2>&1; then
              raw="$(echo "$raw" | jq -r '.[]')"
            fi

            echo "$raw" \
              | tr ',;|' '\n\n\n' \
              | tr -s ' \t' '\n' \
              | tr -d '"[]' \
              | tr '[:lower:]' '[:upper:]' \
              | sed 's/-/_/g; s/__*/_/g; s/^_//; s/_$//' \
              | sed 's/^TOP10$/TOP_10_INVESTMENTS/; s/^TOP10_INVESTMENTS$/TOP_10_INVESTMENTS/' \
              | grep -v -E '^(KSA_TADAWUL|ADVISOR_CRITERIA)$' \
              | awk 'NF && !seen[$0]++' \
              | tr '\n' ' ' \
              | xargs || true
          }

          validate_keys_allowed() {
            local keys="$1"
            local allowed="MARKET_LEADERS GLOBAL_MARKETS MUTUAL_FUNDS COMMODITIES_FX MY_PORTFOLIO INSIGHTS_ANALYSIS TOP_10_INVESTMENTS DATA_DICTIONARY"
            local bad=()

            for k in $keys; do
              if ! echo " $allowed " | grep -q " $k "; then
                bad+=("$k")
              fi
            done

            if [ ${#bad[@]} -ne 0 ]; then
              echo "::error::Invalid SYNC_KEYS: ${bad[*]} | Allowed: $allowed"
              echo "::notice::Tip: Set vars.DEFAULT_SYNC_KEYS as space or comma separated. JSON array is also supported."
              exit 1
            fi
          }

          echo "::group::🔧 Configuration Resolution"

          # 1) URL
          URL="$(get_val "${INPUT_URL:-}" "${VAR_URL:-}" "https://tadawul-fast-bridge.onrender.com")"
          URL="${URL%/}"
          if [[ ! "$URL" =~ ^https?:// ]]; then
            echo "::error::Invalid URL format: $URL"
            exit 1
          fi
          echo "TARGET_URL=$URL" >> "$GITHUB_ENV"
          echo "✅ Backend URL: $URL"

          # 2) Sheet ID
          SHEET="$(get_val "${INPUT_SHEET:-}" "${VAR_SHEET:-}")"
          if [[ -z "${SHEET:-}" ]]; then
            echo "::error::Spreadsheet ID is empty. Set vars.DEFAULT_SPREADSHEET_ID or pass workflow input sheet_id."
            exit 1
          fi
          echo "TARGET_SHEET_ID=$SHEET" >> "$GITHUB_ENV"
          echo "✅ Sheet ID: $SHEET"

          # 3) Mode & Keys
          MODE="$(get_val "${INPUT_MODE:-}" "full_sync")"
          echo "RUN_MODE=$MODE" >> "$GITHUB_ENV"

          DEFAULT_KEYS_CANONICAL="MARKET_LEADERS GLOBAL_MARKETS MUTUAL_FUNDS COMMODITIES_FX MY_PORTFOLIO INSIGHTS_ANALYSIS TOP_10_INVESTMENTS DATA_DICTIONARY"

          if [[ "$MODE" == "single_key" ]]; then
            KEY="$(get_val "${INPUT_KEY:-}" "MARKET_LEADERS")"
            KEYS="$(sanitize_keys "$KEY")"
          else
            KEYS="$(sanitize_keys "$(get_val "${VAR_DEFAULT_KEYS:-}" "$DEFAULT_KEYS_CANONICAL")")"

            # ---------------------------------------------------------------
            # v2.0.0 BF-3 — coverage guard.
            # A narrowed vars.DEFAULT_SYNC_KEYS is why Mutual_Funds (9 Jul),
            # Commodities_FX (14 Jul), Market_Leaders (16 Jul) and
            # Global_Markets (17 Jul) stopped refreshing while the five cockpit
            # pages continued. On a SCHEDULED full_sync the canonical set is
            # mandatory; a shortfall is announced, not absorbed.
            # ---------------------------------------------------------------
            if [[ "${EVENT_NAME:-}" == "schedule" ]]; then
              MISSING=()
              for k in $DEFAULT_KEYS_CANONICAL; do
                if ! echo " $KEYS " | grep -q " $k "; then
                  MISSING+=("$k")
                fi
              done
              if [ ${#MISSING[@]} -ne 0 ]; then
                echo "::warning::vars.DEFAULT_SYNC_KEYS omits: ${MISSING[*]} — scheduled run is FORCING the canonical 8-key set. Clear or correct that repository variable."
                KEYS="$DEFAULT_KEYS_CANONICAL"
              fi
            fi
          fi

          if [[ -z "${KEYS:-}" ]]; then
            echo "::error::SYNC_KEYS resolved to empty (after sanitization)."
            exit 1
          fi

          validate_keys_allowed "$KEYS"

          echo "SYNC_KEYS=$KEYS" >> "$GITHUB_ENV"
          echo "📋 Mode: $MODE | Keys: $KEYS"
          echo "📊 Key count: $(echo "$KEYS" | wc -w) of 8 canonical"

          # 4) Debug
          DEBUG="$(get_val "${INPUT_DEBUG:-}" "false")"
          echo "ENABLE_DEBUG=$DEBUG" >> "$GITHUB_ENV"

          # 5) Credentials
          RAW_CREDS="$(get_val "${INPUT_CREDS:-}" "${SECRET_CREDS:-}")"
          if [[ -z "${RAW_CREDS:-}" && -n "${SECRET_CREDS_B64:-}" ]]; then
            echo "🔓 Decoding Base64 credentials..."
            RAW_CREDS="$(printf '%s' "$SECRET_CREDS_B64" | base64 --decode 2>/dev/null || true)"
          fi

          if [[ -n "${RAW_CREDS:-}" ]]; then
            # mask only email (avoid multiline add-mask issues)
            SA_EMAIL="$(echo "$RAW_CREDS" | jq -r '.client_email // empty' 2>/dev/null || true)"
            if [[ -n "${SA_EMAIL:-}" ]]; then
              echo "::add-mask::$SA_EMAIL"
            fi

            if echo "$RAW_CREDS" | jq empty >/dev/null 2>&1; then
              CREDS_PATH="$RUNNER_TEMP/google_credentials.json"
              # v2.0.0: was a python heredoc whose body sat at column 0, which
              # terminates the YAML block scalar and makes the file ambiguous to
              # strict parsers. printf is equivalent, faster, and removes the
              # indentation hazard entirely.
              printf '%s' "$RAW_CREDS" > "$CREDS_PATH"
              chmod 600 "$CREDS_PATH"
              echo "GOOGLE_APPLICATION_CREDENTIALS=$CREDS_PATH" >> "$GITHUB_ENV"
              echo "🤖 Service Account Configured: ${SA_EMAIL:-Unknown}"
            else
              echo "::error::Invalid JSON structure in credentials."
              exit 1
            fi
          elif [[ "$MODE" != "health_only" ]]; then
            echo "::error::No valid Google credentials found for sync mode."
            exit 1
          fi

          echo "::endgroup::"

      - name: 💓 Backend Health Check
        id: health_check
        run: |
          set -euo pipefail
          echo "::group::🏥 Backend Health Check"

          HEALTH_ENDPOINTS=("/readyz" "/health" "/livez")
          MAX_RETRIES=4

          for endpoint in "${HEALTH_ENDPOINTS[@]}"; do
            echo "▶️ Probing $TARGET_URL$endpoint..."
            for attempt in $(seq 1 "$MAX_RETRIES"); do
              BACKOFF=$(( 2 ** attempt ))

              RESPONSE="$(curl -s -w "\n%{http_code}" --max-time 10 "$TARGET_URL$endpoint" 2>&1 || echo -e "\n000")"
              HTTP_CODE="$(echo "$RESPONSE" | tail -n1)"
              BODY="$(echo "$RESPONSE" | sed '$d')"

              if [[ "$HTTP_CODE" =~ ^2[0-9][0-9]$ ]]; then
                echo "✅ Healthy via $endpoint (HTTP $HTTP_CODE)"
                VERSION="$(echo "$BODY" | jq -r '.version // .app_version // .build // "unknown"' 2>/dev/null || echo "unknown")"
                echo "health_status=healthy" >> "$GITHUB_OUTPUT"
                echo "health_version=$VERSION" >> "$GITHUB_OUTPUT"
                echo "::endgroup::"
                exit 0
              fi

              echo "⏳ Attempt $attempt/$MAX_RETRIES: HTTP $HTTP_CODE, retrying in ${BACKOFF}s..."
              sleep "$BACKOFF"
            done
          done

          echo "::warning::All health check endpoints failed. Backend may be degraded."
          echo "health_status=degraded" >> "$GITHUB_OUTPUT"
          echo "::endgroup::"

      - name: 🚀 Execute Dashboard Sync
        id: execute_sync
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          echo "::group::📊 Sync Execution"

          if [ ! -f "scripts/run_dashboard_sync.py" ]; then
            echo "::error::Missing scripts/run_dashboard_sync.py"
            exit 1
          fi

          CMD=(python scripts/run_dashboard_sync.py)
          CMD+=(--backend "$TARGET_URL")
          CMD+=(--sheet-id "$TARGET_SHEET_ID")
          CMD+=(--keys $SYNC_KEYS)

          if [[ "${RUN_MODE:-full_sync}" == "health_only" ]]; then
            CMD+=(--dry-run)
          fi

          if [[ "${ENABLE_DEBUG:-false}" == "true" ]]; then
            export LOG_LEVEL=DEBUG
            echo "🔍 Debug mode active (LOG_LEVEL=DEBUG)."
          fi

          echo "⏱️ Start Time: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "📋 Command: ${CMD[*]}"

          set -o pipefail
          TIMESTAMP="$(date +%Y%m%d_%H%M%S)"
          LOG_FILE="sync_${TIMESTAMP}.log"

          START_TIME="$(date +%s)"
          "${CMD[@]}" 2>&1 | tee "$LOG_FILE"
          EXIT_CODE=$?
          END_TIME="$(date +%s)"
          DURATION=$((END_TIME - START_TIME))

          echo "duration=$DURATION" >> "$GITHUB_OUTPUT"
          echo "✅ Execution finished in ${DURATION}s (Exit Code: $EXIT_CODE)"

          if grep -qiE "RateLimitError|Quota exceeded|429 Too Many Requests|HTTP 429" "$LOG_FILE"; then
            echo "::warning::Rate limiting detected in logs."
            echo "rate_limited=true" >> "$GITHUB_OUTPUT"
          fi

          if grep -qiE "AuthenticationError|InvalidGrant|401 Unauthorized|403 Forbidden" "$LOG_FILE"; then
            echo "::error::Google Sheets authentication/permission issue detected."
            EXIT_CODE=1
          fi

          cp "$LOG_FILE" sync_execution.log
          echo "::endgroup::"

          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error::Sync script failed. See logs above."
            exit $EXIT_CODE
          fi

      - name: 📝 Generate Summary
        if: always()
        run: |
          set -euo pipefail
          RIYADH_TIME="$(TZ=Asia/Riyadh date '+%Y-%m-%d %H:%M:%S %Z')"
          STATUS_ICON="$([[ "${{ job.status }}" == "success" ]] && echo "✅ **SUCCESS**" || echo "❌ **FAILED**")"

          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          # 🏦 Tadawul Dashboard Sync Report

          ## 📋 Execution Overview
          | Metric | Value |
          | :--- | :--- |
          | **Status** | $STATUS_ICON |
          | **Trigger** | \`${{ github.event_name }}\` |
          | **Time (Riyadh)** | \`$RIYADH_TIME\` |
          | **Run Mode** | \`${{ env.RUN_MODE }}\` |
          | **Duration** | \`${{ steps.execute_sync.outputs.duration || '0' }} seconds\` |

          ## 🎯 Target
          * **Sheet ID:** \`${{ env.TARGET_SHEET_ID }}\`
          * **Backend:** \`${{ env.TARGET_URL }}\` *(Health: ${{ steps.health_check.outputs.health_status || 'Unknown' }})*

          ## 🔑 SYNC_KEYS
          \`\`\`text
          ${{ env.SYNC_KEYS }}
          \`\`\`
          EOF

      - name: 📤 Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tadawul-sync-logs-${{ github.run_id }}
          path: |
            sync_*.log
            sync_execution.log
          retention-days: 7
          compression-level: 6
          if-no-files-found: warn

      - name: 🧹 Secure Cleanup
        if: always()
        run: |
          set -euo pipefail
          echo "::group::Cleanup"
          if [[ -n "${GOOGLE_APPLICATION_CREDENTIALS:-}" && -f "${GOOGLE_APPLICATION_CREDENTIALS:-}" ]]; then
            if command -v shred >/dev/null 2>&1; then
              shred -u -z "$GOOGLE_APPLICATION_CREDENTIALS" 2>/dev/null || rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
            else
              rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
            fi
            echo "✅ Google Credentials removed from runner."
          fi
          echo "::endgroup::"
