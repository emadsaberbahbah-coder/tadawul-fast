# =============================================================================
# 🧭 Markets Board - the condition of every market and their order, observe-only
# -----------------------------------------------------------------------------
# VERSION 1.1.0 (2026-11-21) -- THE READY LIST AND THE SWITCH CHECK
# WHY: owner, 21 Nov 2026 11:03 Riyadh, items 3 and 4 of the build list (a ready
#       list of the 2-3 best qualified names from the top-ranked markets, each
#       with what it is waiting for; a switch check after the costs of both
#       trades). scripts/markets_board.py 1.1.0 adds both, reads Final_Decisions
#       (the Today Action Plan's own decision per stock) and needs the live US
#       rule's settings to say what that rule does with each name: the step
#       passes TFB_PLAN_REGIME, TFB_PLAN_REGIME_BLOCK and TFB_PLAN_REGIME_CCY
#       with the Daily Plan workflow's own defaults.
# VERSION 1.0.0 (2026-11-21)
#
# WHY: owner, 21 Nov 2026 11:03 Riyadh, the build list after the voice call:
# "A condition reading for every market ... A daily ranking of the markets by
# trend and risk ... When every market is weak, cash stays cash ... Observe for
# two weeks (10 sessions), then review with the owner." The readings are the
# BigQuery views v_market_condition, v_market_rank and v_market_trial_summary
# (apply_bq_views 1.18.0); scripts/markets_board.py writes them to the
# Markets_Board tab with the scorecard of the forward test.
#
# WHEN: after each successful run of the two archives the views read - the
# market series (about 06:30 Riyadh) and the deep data with the Saudi REITs
# (about 10:30 Riyadh) - and after the Exit Plan workflow, which the workbook
# dispatches every hour at :35 (apps_script/29_Page_Refresh_Dispatch.gs), in
# the UTC hours of TFB_MARKETS_BOARD_CHAIN_HOURS (repository Variable; default
# "5 13" = about 08:40 and 16:40 Riyadh; "off" = no chained run after the
# Exit Plan). The cron at 08:45 Riyadh is the backstop: GitHub starts this
# repository's scheduled runs hours late (the rule of News Board 1.1.0).
#
# WRITES: only its own tab (Markets_Board). BigQuery: SELECT only. It reads
# Final_Decisions!A1:C400 (1.1.0). No decision, score, list or order changes;
# the Daily Plan keeps its US rule; only the Today Action Plan gives orders.
# Rollback: repository variable TFB_MARKETS_BOARD=off.
# =============================================================================
name: 🧭 Markets Board

on:
  schedule:
    - cron: "45 5 * * *"            # 08:45 Riyadh, the backstop
  workflow_run:
    workflows: ["🌍 BigQuery Market Series", "🔬 BigQuery Symbol Deep Data", "🎯 Exit Plan"]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Compute and print counts only (write nothing)"
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: "3.11"
  PYTHONUNBUFFERED: 1
  TZ: Asia/Riyadh
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  due:
    name: 🕒 Is a chained run due now?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.due.outputs.run }}
    steps:
      - name: 🕒 Is a chained run due now?
        id: due
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHAIN_HOURS: ${{ vars.TFB_MARKETS_BOARD_CHAIN_HOURS || '5 13' }}
          WR_NAME: ${{ github.event.workflow_run.name }}
          WR_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          EXIT_PLAN: "🎯 Exit Plan"
        run: |
          # After an archive: run when it succeeded (the views then read new closes).
          # After the hourly Exit Plan: run only in the listed UTC hours ("off" or no number = never).
          # Schedule and dispatch always run.
          RUN=true
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            RUN=false
            if [[ "$WR_NAME" == "$EXIT_PLAN" ]]; then
              HOUR=$((10#$(date -u +%H)))
              for h in $CHAIN_HOURS; do
                if [[ "$h" =~ ^[0-9]+$ ]] && (( 10#$h == HOUR )); then RUN=true; fi
              done
              echo "Chained run at UTC hour $HOUR (hours: $CHAIN_HOURS): run=$RUN"
            else
              if [[ "$WR_CONCLUSION" == "success" ]]; then RUN=true; fi
              echo "After an archive run ($WR_CONCLUSION): run=$RUN"
            fi
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

  board:
    # The gate is its own job (the rule of PR 1043, Codex P2): a chained run that is not due never enters
    # this job's concurrency group, so it cannot cancel or replace a run that publishes.
    needs: due
    if: needs.due.outputs.run == 'true'
    concurrency:
      group: tfb-markets-board
      cancel-in-progress: false
    name: 🧭 Read the market views and write the board
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v6

      - name: 🐍 Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install dependencies
        run: python -m pip install --quiet gspread==6.2.1 google-auth requests

      - name: 🔎 Resolve spreadsheet id
        id: sheet
        env:
          VAR_SHEET: ${{ vars.DEFAULT_SPREADSHEET_ID }}
        run: |
          SID="${VAR_SHEET:-}"
          if [[ -z "$SID" ]]; then
            echo "::error::Spreadsheet ID empty. Set repository variable DEFAULT_SPREADSHEET_ID."
            exit 1
          fi
          echo "sid=$SID" >> "$GITHUB_OUTPUT"

      - name: 🧭 Write the Markets Board
        env:
          PYTHONPATH: ${{ github.workspace }}
          DEFAULT_SPREADSHEET_ID: ${{ steps.sheet.outputs.sid }}
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS != '' && secrets.GOOGLE_SHEETS_CREDENTIALS || secrets.GOOGLE_SHEETS_CREDENTIALS_B64 }}
          TFB_BQ_PROJECT: ${{ vars.TFB_BQ_PROJECT || 'project-2e3530e6-2311-4aa3-b36' }}
          TFB_BQ_DATASET: ${{ vars.TFB_BQ_DATASET || 'tfb_archive' }}
          TFB_BQ_LOCATION: ${{ vars.TFB_BQ_LOCATION || 'US' }}
          TFB_MARKETS_BOARD: ${{ vars.TFB_MARKETS_BOARD || 'on' }}
          # 1.1.0: the live US rule's settings, with the Daily Plan workflow's own defaults (read, never changed)
          TFB_PLAN_REGIME: ${{ vars.TFB_PLAN_REGIME || 'enforce' }}
          TFB_PLAN_REGIME_BLOCK: ${{ vars.TFB_PLAN_REGIME_BLOCK || 'weak,stress,drawdown,crash_day' }}
          TFB_PLAN_REGIME_CCY: ${{ vars.TFB_PLAN_REGIME_CCY || 'USD' }}
          EVENT_NAME: ${{ github.event_name }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=()
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$IN_DRY_RUN" == "true" ]]; then
            ARGS+=(--dry-run)
          fi
          python scripts/markets_board.py "${ARGS[@]}"
