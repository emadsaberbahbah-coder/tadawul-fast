# =============================================================================
# 🧪 TFB P-169 Thesis-Exit Backtest — thesis_exit_backtest.yml
# =============================================================================
# WHY (2026-09-24): before the thesis-failure exit rule goes live in
# portfolio_actions (TFB_PF_THESIS_EXIT), the rule is replayed READ-ONLY on the
# program's own Signal_History + _Portfolio_CostBasis (scripts/
# backtest_pf_thesis_exit.py v1.0.0). Dispatch-only: no schedule, no writes,
# never a cell touched. The markdown + JSON evidence lands in the run artifact
# and the job summary. Non-blocking by design (always exit 0).
# =============================================================================
name: 🧪 TFB P-169 Thesis-Exit Backtest (read-only)
on:
  workflow_dispatch:
    inputs:
      score:
        description: "Score threshold S (exit when overall < S)"
        type: string
        default: "60"
      days:
        description: "N consecutive snapshots below S"
        type: string
        default: "5"
permissions:
  contents: read
concurrency:
  group: tfb-thesis-backtest-${{ github.ref }}
  cancel-in-progress: false
jobs:
  backtest:
    name: 🧪 Replay the exit rule on the ledger
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install --quiet gspread google-auth
      - name: Offline selftest (no credentials)
        run: python scripts/backtest_pf_thesis_exit.py --selftest
      - name: Replay on the live workbook (read-only)
        env:
          DEFAULT_SPREADSHEET_ID: ${{ vars.DEFAULT_SPREADSHEET_ID }}
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          GOOGLE_SHEETS_CREDENTIALS_B64: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS_B64 }}
        run: |
          set -o pipefail
          python scripts/backtest_pf_thesis_exit.py --live \
            --score "${{ inputs.score || '60' }}" --days "${{ inputs.days || '5' }}" \
            --out-md artifacts/thesis_exit_backtest.md \
            --out-json artifacts/thesis_exit_backtest.json | tee artifacts_console.txt
          cat artifacts/thesis_exit_backtest.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tfb-thesis-exit-backtest-${{ github.run_id }}
          path: |
            artifacts/
            artifacts_console.txt
          if-no-files-found: warn
          retention-days: 90
