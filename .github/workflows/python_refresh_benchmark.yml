name: 🧪 Python Refresh Benchmark

on:
  pull_request:
    paths:
      - 'scripts/run_dashboard_sync.py'
      - 'scripts/concurrent_batch_fetch.py'
      - 'scripts/benchmark_dashboard_fetch.py'
      - 'scripts/verify_backend_symbol_capabilities.py'
      - 'tests/test_backend_symbol_capabilities.py'
      - '.github/workflows/python_refresh_benchmark.yml'
  workflow_dispatch:
    inputs:
      page:
        description: Page/key to benchmark
        required: true
        default: Market_Leaders
        type: string
      max_symbols:
        description: Maximum symbols
        required: true
        default: '1000'
        type: string
      batch_size:
        description: Symbols per request
        required: true
        default: '25'
        type: string
      concurrency:
        description: Concurrent requests
        required: true
        default: '1'
        type: string

permissions:
  contents: read

concurrency:
  group: python-refresh-benchmark-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  live-read-only-benchmark:
    name: Benchmark 1,000 rows without Sheet writes
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        github.event.pull_request.head.ref == 'perf/python-batch-concurrency-v1'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: production
    env:
      PYTHON_VERSION: '3.11'
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ${{ github.workspace }}
      TZ: Asia/Riyadh
      TARGET_URL: ${{ vars.BACKEND_BASE_URL || 'https://tadawul-fast-bridge.onrender.com' }}
      TARGET_SHEET_ID: ${{ vars.DEFAULT_SPREADSHEET_ID }}
      BENCH_PAGE: ${{ inputs.page || 'Market_Leaders' }}
      BENCH_MAX_SYMBOLS: ${{ inputs.max_symbols || '1000' }}
      BENCH_BATCH_SIZE: ${{ inputs.batch_size || '25' }}
      BENCH_CONCURRENCY: ${{ inputs.concurrency || '1' }}
      TFB_SYNC_BATCH_OUTER_RETRIES: '1'
      TFB_SYNC_TARGET_RECOVERY: '1'
      TFB_SYNC_TARGET_RECOVERY_MAX: '120'
      TFB_SYNC_TARGET_RECOVERY_BATCH_SIZE: '10'
      TFB_SYNC_TARGET_RECOVERY_ROUNDS: '1'
      TFB_SYNC_MARKET_GATEWAY: analysis
      TFB_SYNC_MAX_SYMBOLS_MARKET: '7000'
      TFB_SYNC_UNIVERSE_CAP_V2: '1'
      TFB_SYNC_OLDEST_FIRST: '1'
      TFB_SYNC_HEAL_FIRST: '1'
      TFB_SYNC_IDFW_RUNLOG: '0'
      TFB_XPAGE_PRICE_CHECK: '0'
      BACKEND_TOKEN: ${{ secrets.BACKEND_TOKEN }}

    steps:
      - name: Checkout benchmark branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.render.txt
            requirements.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          if [[ -f requirements.render.txt ]]; then
            python -m pip install -r requirements.render.txt
          elif [[ -f requirements.txt ]]; then
            python -m pip install -r requirements.txt
          else
            echo '::error::No requirements file found.'
            exit 1
          fi

      - name: Require backend readiness
        run: |
          set -euo pipefail
          BODY=''
          READY='false'
          for attempt in 1 2 3 4 5; do
            echo "Readiness attempt ${attempt}/5"
            if BODY="$(curl -fsS \
              --retry 2 \
              --retry-all-errors \
              --retry-delay 2 \
              --connect-timeout 15 \
              --max-time 30 \
              "$TARGET_URL/readyz")"; then
              printf '%s' "$BODY" > backend_ready.json
              READY="$(printf '%s' "$BODY" | jq -r '.ready // (.status == "ok") // false' 2>/dev/null || printf false)"
              if [[ "$READY" == 'true' ]]; then
                break
              fi
            fi
            sleep $((attempt * 2))
          done
          printf '%s' "$BODY" > backend_ready.json
          if [[ "$READY" != 'true' ]]; then
            echo '::error::Render backend did not become ready after bounded retries.'
            cat backend_ready.json
            exit 1
          fi

      - name: Require deployed provider-symbol capabilities
        run: |
          set -euo pipefail
          python scripts/verify_backend_symbol_capabilities.py \
            --backend "$TARGET_URL" \
            --endpoint '/v1/analysis/sheet-rows' \
            --page 'Market_Leaders' \
            --timeout 60 \
            --json-out backend_symbol_capabilities.json

      - name: Configure read-only Google credentials
        env:
          SECRET_CREDS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          SECRET_CREDS_B64: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "${TARGET_SHEET_ID:-}" ]]; then
            echo '::error::vars.DEFAULT_SPREADSHEET_ID is empty.'
            exit 1
          fi
          RAW_CREDS="${SECRET_CREDS:-}"
          if [[ -z "$RAW_CREDS" && -n "${SECRET_CREDS_B64:-}" ]]; then
            RAW_CREDS="$(printf '%s' "$SECRET_CREDS_B64" | base64 --decode 2>/dev/null || true)"
          fi
          if [[ -z "$RAW_CREDS" ]] || ! printf '%s' "$RAW_CREDS" | jq empty >/dev/null 2>&1; then
            echo '::error::No valid Google Sheets credentials found.'
            exit 1
          fi
          CREDS_PATH="$RUNNER_TEMP/google_credentials.json"
          printf '%s' "$RAW_CREDS" > "$CREDS_PATH"
          chmod 600 "$CREDS_PATH"
          SA_EMAIL="$(jq -r '.client_email // empty' "$CREDS_PATH")"
          [[ -n "$SA_EMAIL" ]] && echo "::add-mask::$SA_EMAIL"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CREDS_PATH" >> "$GITHUB_ENV"

      - name: Run no-write 1,000-row benchmark
        id: benchmark
        run: |
          set -euo pipefail
          code=0
          python scripts/benchmark_dashboard_fetch.py \
            --page "$BENCH_PAGE" \
            --sheet-id "$TARGET_SHEET_ID" \
            --backend "$TARGET_URL" \
            --max-symbols "$BENCH_MAX_SYMBOLS" \
            --batch-size "$BENCH_BATCH_SIZE" \
            --concurrency "$BENCH_CONCURRENCY" \
            --outer-retries 1 \
            --timeout 120 \
            --time-budget 2100 \
            --json-out python_refresh_benchmark.json || code=$?
          echo "benchmark_exit=$code" >> "$GITHUB_OUTPUT"
          if [[ "$code" -eq 3 ]]; then
            echo '::error::Benchmark could not execute or produce evidence.'
            exit 3
          fi
          if [[ "$code" -eq 2 ]]; then
            echo '::warning::Benchmark completed, but the production runner rejected the page; inspect identity/data-quality evidence.'
          elif [[ "$code" -eq 1 ]]; then
            echo '::warning::Benchmark completed with partial/skipped status; evidence retained.'
          fi
          exit 0

      - name: Publish benchmark summary
        if: always()
        run: |
          {
            echo '# 🧪 Python Refresh Deployment Gate'
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -f backend_symbol_capabilities.json ]]; then
            {
              echo '## Backend capability proof'
              echo
              echo '| Capability | Passed | Reason |'
              echo '|---|---:|---|'
              jq -r '.probes[] | "| \(.capability) | \(.passed) | \(.reason) |"' backend_symbol_capabilities.json
              echo
              echo "Ready for full benchmark: $(jq -r '.ready_for_full_benchmark' backend_symbol_capabilities.json)"
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Backend capability report was not produced.' >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ ! -f python_refresh_benchmark.json ]]; then
            echo 'The 1,000-symbol benchmark did not run because an earlier deployment gate failed.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo '## 1,000-symbol no-write benchmark'
            echo
            echo '| Metric | Value |'
            echo '|---|---:|'
            echo "| Page | $(jq -r '.page' python_refresh_benchmark.json) |"
            echo "| Runner status | $(jq -r '.acceptance.runner_status' python_refresh_benchmark.json) |"
            echo "| Requested | $(jq -r '.acceptance.requested_symbols' python_refresh_benchmark.json) |"
            echo "| Returned | $(jq -r '.acceptance.returned_symbols' python_refresh_benchmark.json) |"
            echo "| Good fresh | $(jq -r '.acceptance.fresh_symbols' python_refresh_benchmark.json) |"
            echo "| Data-free stubs | $(jq -r '.acceptance.data_free_symbols' python_refresh_benchmark.json) |"
            echo "| Missing | $(jq -r '.acceptance.missing_symbols' python_refresh_benchmark.json) |"
            echo "| Fresh coverage | $(jq -r '.acceptance.fresh_coverage_pct' python_refresh_benchmark.json)% |"
            echo "| Recovery healed | $(jq -r '.acceptance.targeted_recovery_healed' python_refresh_benchmark.json) / $(jq -r '.acceptance.targeted_recovery_requested' python_refresh_benchmark.json) |"
            echo "| Unattempted | $(jq -r '.acceptance.unattempted_symbols' python_refresh_benchmark.json) |"
            echo "| HTTP 429 | $(jq -r '.acceptance.http_429' python_refresh_benchmark.json) |"
            echo "| HTTP 5xx | $(jq -r '.acceptance.http_5xx' python_refresh_benchmark.json) |"
            echo "| Elapsed | $(jq -r '.elapsed_minutes' python_refresh_benchmark.json) minutes |"
            echo "| Within 25 min | $(jq -r '.acceptance.within_25_minutes' python_refresh_benchmark.json) |"
            echo "| Complete fresh fetch | $(jq -r '.acceptance.complete_fresh_fetch' python_refresh_benchmark.json) |"
            echo "| No workbook writes | $(jq -r '.no_workbook_writes' python_refresh_benchmark.json) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-refresh-benchmark-${{ github.run_id }}
          path: |
            python_refresh_benchmark.json
            backend_ready.json
            backend_symbol_capabilities.json
          retention-days: 30
          if-no-files-found: warn

      - name: Secure cleanup
        if: always()
        run: |
          CREDS_PATH="${GOOGLE_APPLICATION_CREDENTIALS:-$RUNNER_TEMP/google_credentials.json}"
          if [[ -f "$CREDS_PATH" ]]; then
            shred -u -z "$CREDS_PATH" 2>/dev/null || rm -f "$CREDS_PATH"
          fi
