name: "📊 TFB Shadow Scorer (S-1 Gate)"

# Wave S deliverable #15 (Master Plan v2.1 §3, §15). Daily Champion-vs-
# Challenger scoring and the S-1 acceptance gate. Runs AFTER the shadow board
# so it scores the board the challenger actually published that day.
# Append-only: Shadow_History refuses duplicate dates by design.

on:
  schedule:
    # v1.8.0 (2026-09-12) SCHEDULE-RACE FIX: was "40 14" (~17:40 Riyadh),
    # only 30 min after the board's 14:10 UTC slot — GitHub cron jitter
    # routinely exceeds that (observed 2026-09-11: board COMPLETED 17:44:11,
    # after this job's scheduled start), so the scorer could read yesterday's
    # or a mid-write board and record "no-challenger". 15:20 UTC = ~18:20
    # Riyadh gives ~70 min of headroom; run_shadow_scorer.py v1.8.0 adds the
    # board-fresh guard below as the belt to this suspender.
    - cron: "20 15 * * *"     # ~18:20 Riyadh, after the 17:10 shadow board
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = compute and print, write nothing"
        default: "false"
      rollback_drill_passed:
        description: "true = record today's rollback drill (criterion 6)"
        default: "false"

permissions:
  contents: read

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_SHEET_ID: ${{ vars.DEFAULT_SPREADSHEET_ID }}
      TFB_COMPLIANCE_GATE_ENABLED: "1"
      # P-79/S-1 unblock (root cause 2026-09-09, armed 2026-09-10): the
      # retired-Shariah operator decision was never armed in THIS lane — the
      # flag was absent here entirely, so compliance_gate v1.1.0 fell back to
      # the stale authority list (as_of 2026-03-31, 120-day max age breached
      # 2026-07-29), failed every symbol, emptied the challenger basket and
      # froze the S-1 clock at 3/28 with excluded_reason=no-challenger.
      # HARDCODED like GATE_ENABLED above (a repo Variable can be silently
      # unset; git history cannot). Read-back: first nightly run with
      # "chal fresh" > 0. Rollback: delete this line.
      TFB_COMPLIANCE_SCREEN_RETIRED: "1"
      # v1.8.0 BOARD-FRESH GUARD — ARMING IS A SEPARATE EVIDENCE-RUN STEP.
      # Step 1 (this commit): cron moved + guard code deployed, gate OFF =>
      # scorer behavior byte-identical. Step 2 (next sitting): uncomment the
      # observe line, one nightly read-back = "[S1-BOARD-FRESH ...]" in the
      # verdict. Step 3 (separate sitting): switch observe -> enforce; a
      # stale read then re-polls up to TFB_S1_BOARD_WAIT_MIN (default 8) and
      # an unrecovered day records the honest reason `stale-board` instead
      # of `no-challenger`. Rollback: re-comment the line.
      # TFB_S1_BOARD_FRESH_GUARD: "observe"
      # IR-082 (external audit P0-7, adjudicated 2026-08-23): the scorer's
      # v1.3.0 EODHD rescue reads exactly these two names and was
      # structurally unreachable because neither was mapped. This mapping is
      # INERT WIRING: with the repo Variable TFB_SHADOW_EODHD unset/0 the
      # rescue stays byte-off, and the secret may not even exist yet.
      # ARMING (=1) is an S-1 EVIDENCE-WINDOW decision — record the arming
      # date as a window boundary in S1_Gate BEFORE setting the Variable,
      # and create the EODHD_API_KEY secret in the same sitting.
      TFB_SHADOW_EODHD: ${{ vars.TFB_SHADOW_EODHD }}
      TFB_EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --quiet gspread google-auth httpx yfinance

      - name: Materialize Google credentials
        env:
          SECRET_CREDS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          SECRET_CREDS_B64: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS_B64 }}
        run: |
          set -euo pipefail
          CREDS_PATH="$RUNNER_TEMP/gcreds.json"
          if [[ -n "${SECRET_CREDS:-}" ]]; then
            printf '%s' "$SECRET_CREDS" > "$CREDS_PATH"
          elif [[ -n "${SECRET_CREDS_B64:-}" ]]; then
            printf '%s' "$SECRET_CREDS_B64" | base64 -d > "$CREDS_PATH"
          else
            echo "::error::No Google credentials secret present."; exit 1
          fi
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CREDS_PATH" >> "$GITHUB_ENV"

      - name: Score shadow vs champion
        run: |
          set -euo pipefail
          EXTRA=""
          # 2026-08-25 fix: COMPOSE flags — the second assignment used to
          # OVERWRITE the first, so dry_run+rollback_drill_passed silently
          # dropped --dry-run. NOTE: composition alone does NOT guarantee a
          # zero-write dry run; run_shadow_scorer.py v1.6.0 (same delivery)
          # makes --dry-run authoritative inside the drill branch itself.
          if [[ "${{ github.event.inputs.dry_run }}" == "true" ]]; then EXTRA="$EXTRA --dry-run"; fi
          if [[ "${{ github.event.inputs.rollback_drill_passed }}" == "true" ]]; then EXTRA="$EXTRA --rollback-drill-passed"; fi
          python scripts/run_shadow_scorer.py $EXTRA
