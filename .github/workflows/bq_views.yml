# =============================================================================
# 🗄️ BigQuery Looker Views — typed views over the nightly archive
# =============================================================================
# VERSION 1.0.0 (2026-10-29) -- program register C8, Phase 2 (Looker Studio).
# scripts/apply_bq_views.py v1.0.0 applies sql/bigquery/*.sql (three helper
#       functions, ten views; since v1.1.0 also v_market_daily and the table
#       functions f_market_window / f_market_summary over market_series_daily,
#       the global markets page) to BigQuery dataset tfb_archive
#       (project-2e3530e6-2311-4aa3-b36, US), or proves the live definitions
#       equal the files. Views and functions only: no table is created,
#       changed or deleted, nothing is written to the workbook, and the live
#       system never reads BigQuery.
# AUTH: the archive's service account (GOOGLE_SHEETS_CREDENTIALS) with BigQuery
#       Data Editor + BigQuery Job User (granted by the owner on 27 Oct).
# MODES: verify (default) compares INFORMATION_SCHEMA with the files and
#       fails on any missing or different object; write creates or replaces
#       every object in file order, then verifies. Manual dispatch only.
# =============================================================================
name: 🗄️ BigQuery Looker Views

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "verify = compare the live views with sql/bigquery (default) | write = create or replace them, then verify"
        required: false
        default: verify
        type: choice
        options:
          - verify
          - write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: "3.11"
  PYTHONUNBUFFERED: 1
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  views:
    name: 🗄️ Apply or verify the Looker views
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v6

      - name: 🐍 Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "google-auth==2.49.2" "requests==2.33.1"

      - name: 🗄️ Run
        env:
          PYTHONPATH: ${{ github.workspace }}
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS != '' && secrets.GOOGLE_SHEETS_CREDENTIALS || secrets.GOOGLE_SHEETS_CREDENTIALS_B64 }}
          TFB_BQ_PROJECT: ${{ vars.TFB_BQ_PROJECT || 'project-2e3530e6-2311-4aa3-b36' }}
          TFB_BQ_DATASET: ${{ vars.TFB_BQ_DATASET || 'tfb_archive' }}
          TFB_BQ_LOCATION: "US"
          INPUT_MODE: ${{ github.event.inputs.mode }}
        run: |
          MODE="verify"
          if [[ "${INPUT_MODE:-}" == "write" ]]; then
            MODE="write"
          fi
          echo "Mode: ${MODE}"
          python scripts/apply_bq_views.py --${MODE} 2>&1 | tee bq_views.log
          rc=${PIPESTATUS[0]}
          {
            echo "### 🗄️ BigQuery Looker Views (${MODE})"
            echo ""
            echo '```'
            tail -n 40 bq_views.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
