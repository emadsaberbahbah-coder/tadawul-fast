name: "🧯 Urgent Identity Persistence"

on:
  pull_request:
    paths:
      - "scripts/__init__.py"
      - "scripts/klg_identity_gate_v131.py"
      - "tests/test_klg_identity_gate_v131.py"
      - ".github/workflows/urgent_identity_persistence.yml"
  push:
    branches: [main, master]
    paths:
      - "scripts/__init__.py"
      - "scripts/klg_identity_gate_v131.py"
      - "tests/test_klg_identity_gate_v131.py"
      - ".github/workflows/urgent_identity_persistence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: urgent-identity-persistence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Refuse poisoned last-good identities
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Compile focused production and test files
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/__init__.py \
            scripts/klg_identity_gate_v131.py \
            tests/test_klg_identity_gate_v131.py

      - name: Run persistence regressions
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_klg_identity_gate_v131

      - name: Verify production defaults stay fail-closed
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from scripts.klg_identity_gate_v131 import (
              EXPECTED_ISSUER_TOKENS,
              PATCH_VERSION,
              candidate_identity_failure,
          )

          headers = ["Symbol", "Name", "Exchange", "Currency", "Country", "Current Price"]
          poisoned = ["BPI.PS", "Equinix, Inc.", "PSE", "PHP", "Philippines", 1034.86]
          verified = ["BPI.PS", "Bank of the Philippine Islands", "PSE", "PHP", "Philippines", 120.0]

          assert PATCH_VERSION == "1.3.1"
          assert "BPI.PS" in EXPECTED_ISSUER_TOKENS
          assert candidate_identity_failure(headers, poisoned) == "issuer name mismatch"
          assert candidate_identity_failure(headers, verified) == ""
          print("urgent identity persistence defaults: PASS")
          PY
