# ============================================================================
# TFB Corporate Events -- the Corporate_Events tab from SEC EDGAR 8-K items
# ============================================================================
# 2026-11-08 (v1.0.0): scripts/run_corporate_events.py reads, for every US
# symbol on the decision pages, the issuer's recent EDGAR submissions and
# writes one row per 8-K filing that names a corporate action (merger
# completed, change in control, charter / name / ticker change, rights
# modified, bankruptcy, delisting notice, restatement) within the last 45
# days. The Top-10 cockpit's ticket guard (16_Decision_Top10 v1.27.0,
# DT10_GUARD_CORP_DAYS) holds a ticket whose symbol has such a row. WHY: the
# board seated INDV.US on 2 Nov 2026, the day its merger closed; the next
# day it traded as SUPN ex an $8.13 special dividend. Nothing knew.
# The sec.gov contact comes from the repository secret TFB_SEC_USER_AGENT
# (or the variable of the same name), as for the news gate; the script
# refuses to write without it. Schedule writes; a manual dispatch writes
# ONLY with write=true. Nothing here places an order or changes a count.
name: 🏛️ Corporate Events

on:
  schedule:
    # 05:37 UTC = 08:37 Riyadh, after the calendar sync (05:15 UTC) and
    # before the first board of the day; US 8-Ks are filed by 21:30 UTC.
    - cron: "37 5 * * 1-5"
  workflow_dispatch:
    inputs:
      write:
        description: "Write the Corporate_Events tab (default: dry run)"
        type: boolean
        default: false

concurrency:
  group: tfb-corporate-events
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: "3.11"
  PYTHONUNBUFFERED: 1
  TZ: Asia/Riyadh
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  corporate_events:
    name: 🏛️ Read EDGAR 8-K items & publish the tab
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v6

      - name: 🐍 Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [[ -f requirements.render.txt ]]; then
            python -m pip install -r requirements.render.txt
          else
            python -m pip install -r requirements.txt
          fi

      - name: 🔎 Resolve spreadsheet id
        id: sheet
        env:
          VAR_SHEET: ${{ vars.DEFAULT_SPREADSHEET_ID }}
        run: |
          SID="${VAR_SHEET:-}"
          if [[ -z "$SID" ]]; then
            echo "::error::Spreadsheet ID empty. Set repository variable DEFAULT_SPREADSHEET_ID."
            exit 1
          fi
          echo "sid=$SID" >> "$GITHUB_OUTPUT"

      - name: 🏛️ Run corporate events
        env:
          PYTHONPATH: ${{ github.workspace }}
          DEFAULT_SPREADSHEET_ID: ${{ steps.sheet.outputs.sid }}
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS != '' && secrets.GOOGLE_SHEETS_CREDENTIALS || secrets.GOOGLE_SHEETS_CREDENTIALS_B64 }}
          TFB_SEC_USER_AGENT: ${{ secrets.TFB_SEC_USER_AGENT || vars.TFB_SEC_USER_AGENT }}
          TFB_CORP_LOOKBACK_DAYS: ${{ vars.TFB_CORP_LOOKBACK_DAYS || '45' }}
        run: |
          # Schedule always writes; a manual dispatch writes ONLY when
          # write=true was explicitly ticked (dry-run otherwise).
          MODE="--write"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.write }}" != "true" ]]; then
            MODE="--dry-run"
            echo "Dry-run mode - printing the rows, writing nothing (tick write=true to publish)."
          fi
          python scripts/run_corporate_events.py $MODE
