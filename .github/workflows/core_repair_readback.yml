name: Core repair deployed readback
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-repair-readback
  cancel-in-progress: false
jobs:
  readback:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify deployed SHA, authenticated signing and empty allocation
        env:
          BACKEND_TOKEN: ${{ secrets.BACKEND_TOKEN }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: python scripts/verify_core_repair_readback.py --expected-commit "$EXPECTED_COMMIT"
      - name: Save sanitized readback
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-repair-readback-${{ github.run_id }}
          path: artifacts/core-repair-readback.json
          if-no-files-found: warn
          retention-days: 30
