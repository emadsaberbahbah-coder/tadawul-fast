# =============================================================================
# News & Macro Gate - observe-only verdict before each market session
# =============================================================================
# VERSION 1.0.0 (2026-10-28) -- NEW WORKFLOW (program register A7, news layer)
# WHY (owner request 28 Oct 2026): every GO/NO-GO has needed a hand-made
#       macro and news check (war news, energy, the Fed, each name's own
#       news) and the FRST entry missed a 22% EPS miss filed with the SEC two
#       sessions earlier. scripts/news_macro_gate.py v1.0.0 collects free or
#       already-paid sources (SEC EDGAR, GDELT, Google-News RSS in Arabic,
#       the Federal Reserve RSS, EODHD economic events and S&P 500 / VIX),
#       grades each source (A official .. F unknown) and each story (1
#       confirmed .. 6 social only), and records a GO / CAUTION /
#       NO_NEW_ENTRY verdict with its drivers plus per-name flags in the
#       _News_Gate, _News_Items and _Econ_Events tabs. OBSERVE-ONLY: nothing
#       in the live system reads these tabs; the owner decides every trade.
# SCHEDULE (UTC; GitHub may start scheduled runs late - the run records its
#       own time): 06:41 Sun-Thu (09:41 Riyadh, before the Saudi open),
#       12:47 Mon-Fri (15:47 Riyadh, before the US open), 19:23 Mon-Fri
#       (22:23 Riyadh, after a 14:00 ET FOMC decision in either DST regime).
#       A manual dispatch is a dry run unless write=true.
# GATE: armed here (TFB_NEWS_GATE defaults to observe); kill with the
#       repository Variable TFB_NEWS_GATE=off. TFB_NEWS_GATE_SOURCES limits
#       the sources (default all six).
# SECRETS: GOOGLE_SHEETS_CREDENTIALS (existing), EODHD_API_KEY (existing,
#       economic events + S&P 500 / VIX), TFB_SEC_USER_AGENT (existing secret,
#       or the Variable of the same name; EDGAR is skipped without it).
# =============================================================================
name: 📰 News & Macro Gate

on:
  schedule:
    - cron: "41 6 * * 0-4"
    - cron: "47 12 * * 1-5"
    - cron: "23 19 * * 1-5"
  workflow_dispatch:
    inputs:
      write:
        description: "Write the _News_Gate / _News_Items / _Econ_Events tabs? (default: dry run)"
        required: false
        default: false
        type: boolean
      sources:
        description: "Comma list of sources (blank = edgar,gdelt,google_news,fed_rss,econ,market)"
        required: false
        default: ""
        type: string
      symbols:
        description: "Extra symbols, SYM[:Name];SYM2 (added to holdings + the latest shadow-log day)"
        required: false
        default: ""
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: "3.11"
  PYTHONUNBUFFERED: 1
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  gate:
    name: 📰 Collect, grade and record the news & macro verdict
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v6

      - name: 🐍 Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "google-auth==2.49.2" "requests==2.33.1"

      - name: 📰 Run the gate
        env:
          PYTHONPATH: ${{ github.workspace }}
          DEFAULT_SPREADSHEET_ID: ${{ vars.DEFAULT_SPREADSHEET_ID }}
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS != '' && secrets.GOOGLE_SHEETS_CREDENTIALS || secrets.GOOGLE_SHEETS_CREDENTIALS_B64 }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          TFB_SEC_USER_AGENT: ${{ secrets.TFB_SEC_USER_AGENT || vars.TFB_SEC_USER_AGENT }}
          TFB_NEWS_GATE: ${{ vars.TFB_NEWS_GATE || 'observe' }}
          TFB_NEWS_GATE_SOURCES: ${{ github.event.inputs.sources || vars.TFB_NEWS_GATE_SOURCES || '' }}
          TFB_NEWS_GATE_SYMBOLS: ${{ github.event.inputs.symbols || vars.TFB_NEWS_GATE_SYMBOLS || '' }}
          TFB_NEWS_GATE_EVIDENCE_DIR: news-gate-evidence
        run: |
          # Schedule always writes; a manual dispatch writes ONLY when
          # write=true was explicitly ticked (dry run otherwise).
          MODE="--write"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.write }}" != "true" ]]; then
            MODE="--dry-run"
            echo "Dry-run mode - collecting and grading, writing nothing (tick write=true to record)."
          fi
          python scripts/news_macro_gate.py $MODE

      - name: 📎 Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: news-gate-${{ github.run_id }}
          path: news-gate-evidence
          if-no-files-found: ignore
          retention-days: 30
