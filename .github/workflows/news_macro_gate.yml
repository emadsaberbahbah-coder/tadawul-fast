# =============================================================================
# News & Macro Gate - observe-only verdict before each market session
# =============================================================================
# VERSION 1.1.7 (2026-11-27) -- EXTRA SYMBOLS FROM A SECRET (news_macro_gate 1.12.0, audit E1)
#       TFB_NEWS_GATE_SYMBOLS is read from secrets.TFB_NEWS_GATE_SYMBOLS (masked in the log) instead of a
#       repository Variable (printed in the step's env block). The dispatch input stays, marked public.
# VERSION 1.1.6 (2026-11-26) -- THE PUBLIC LOG KEEPS THE HOLDINGS OUT (news_macro_gate 1.8.1 [PUBLIC-LOG])
#       The run step passes the Variable TFB_NEWS_GATE_LOG_DETAIL (on | off | auto, default auto: off on
#       Actions). This repository is public: its logs, step summaries and artifacts name no holding.
# VERSION 1.1.5 (2026-11-26) -- THE SHADOW READER'S KEY AND SWITCH (news_macro_gate 1.8.0 [LLM-SHADOW])
#       The run step passes secrets.GEMINI_API_KEY and the Variables TFB_NEWS_LLM (on | off, default on)
#       and TFB_NEWS_LLM_MODEL. The reader labels headlines in its own tab and controls nothing.
# VERSION 1.1.4 (2026-11-26) -- THE MARKETAUX KEY REACHES THE GATE (news_macro_gate 1.7.0 [MARKETAUX])
#       The run step passes secrets.MARKETAUX_API_KEY (added by the owner 26 Nov). Nothing else changes.
# VERSION 1.1.3 (2026-11-26) -- THE FINNHUB KEY REACHES THE GATE (news_macro_gate 1.6.0 [FINNHUB])
#       The run step passes secrets.FINNHUB_API_KEY (the repository secret the owner adds, the same
#       key Render holds). Without it the source is skipped and named; nothing else changes.
# VERSION 1.1.2 (2026-11-26) -- FIVE MORE SOURCES (news_macro_gate 1.5.0 [SOURCES])
# WHY: the gate stood on one source (Google News); owner, 26 Nov 12:42: add
#       three to five. WHAT: the script reads bing_news, yahoo_rss, press_rss,
#       official_rss and gulf_rss beside the six older sources; blank
#       TFB_NEWS_GATE_SOURCES still means all. Only the text of the 'sources'
#       input changes here: same triggers, hours, permissions, steps and ENV.
#       To leave the five out, set the Variable TFB_NEWS_GATE_SOURCES to
#       edgar,gdelt,google_news,fed_rss,econ,market.
# VERSION 1.1.1 (2026-11-21) -- THE HOUR GATE IS ITS OWN JOB (Codex P2 on PR 1043)
# WHY: with the gate as the first step, every chained run entered the
#       workflow's concurrency group before the gate decided. A run that
#       was not due could become the pending run of the group and so
#       replace a pending run that would publish (GitHub keeps one pending
#       run per group). The gate is now the job 'due'; the job 'gate' runs
#       only when it says so and holds the concurrency group. Same hours,
#       same writes; News Board, Trial Labels and the Pre-Open Check follow
#       the same rule from 21 Nov.
# VERSION 1.1.0 (2026-11-16) -- THE GATE NO LONGER DEPENDS ON GITHUB'S SCHEDULE ALONE
# WHY: GitHub delayed or dropped the cron runs: the 19:23 UTC run of 13 Nov
#       started 00:21 UTC, the 12:47 run of 15 Nov started 14:17, and on
#       Mon 16 Nov the 06:41 run never started - at 14:25 Riyadh the Today
#       Action Plan still showed the verdict of 15 Nov 17:17.
# WHAT: the gate also runs after the Exit Plan workflow, which the workbook
#       dispatches every hour at :35 (29_Page_Refresh_Dispatch), when the UTC
#       hour is one of TFB_NEWS_GATE_CHAIN_HOURS (repository Variable; default
#       "6 9 12 13 16 19" = 09 12 15 16 19 22 Riyadh; "off" = cron only). A
#       chained run writes, like a scheduled one. The cron entries stay.
# VERSION 1.0.1 (2026-11-16) -- ISSUER LINK: TFB_NEWS_ISSUER_LINK reaches the script (repository Variable;
#       default on; observe counts only; off = news_macro_gate 1.0.2 behaviour).
# VERSION 1.0.0 (2026-10-28) -- NEW WORKFLOW (program register A7, news layer)
# WHY (owner request 28 Oct 2026): every GO/NO-GO has needed a hand-made
#       macro and news check (war news, energy, the Fed, each name's own
#       news) and the FRST entry missed a 22% EPS miss filed with the SEC two
#       sessions earlier. scripts/news_macro_gate.py v1.0.0 collects free or
#       already-paid sources (SEC EDGAR, GDELT, Google-News RSS in Arabic,
#       the Federal Reserve RSS, EODHD economic events and S&P 500 / VIX),
#       grades each source (A official .. F unknown) and each story (1
#       confirmed .. 6 social only), and records a GO / CAUTION /
#       NO_NEW_ENTRY verdict with its drivers plus per-name flags in the
#       _News_Gate, _News_Items and _Econ_Events tabs. OBSERVE-ONLY: nothing
#       in the live system reads these tabs; the owner decides every trade.
# SCHEDULE (UTC; GitHub may start scheduled runs late - the run records its
#       own time): 06:41 Sun-Thu (09:41 Riyadh, before the Saudi open),
#       12:47 Mon-Fri (15:47 Riyadh, before the US open), 19:23 Mon-Fri
#       (22:23 Riyadh, after a 14:00 ET FOMC decision in either DST regime).
#       A manual dispatch is a dry run unless write=true.
# GATE: armed here (TFB_NEWS_GATE defaults to observe); kill with the
#       repository Variable TFB_NEWS_GATE=off. TFB_NEWS_GATE_SOURCES limits
#       the sources (default all; 1.1.4: thirteen).
# SECRETS: GOOGLE_SHEETS_CREDENTIALS (existing), EODHD_API_KEY (existing,
#       economic events + S&P 500 / VIX), TFB_SEC_USER_AGENT (existing secret,
#       or the Variable of the same name; EDGAR is skipped without it).
# =============================================================================
name: 📰 News & Macro Gate

on:
  schedule:
    - cron: "41 6 * * 0-4"
    - cron: "47 12 * * 1-5"
    - cron: "23 19 * * 1-5"
  workflow_run:
    workflows: ["🎯 Exit Plan"]
    types: [completed]
  workflow_dispatch:
    inputs:
      write:
        description: "Write the _News_Gate / _News_Items / _Econ_Events tabs? (default: dry run)"
        required: false
        default: false
        type: boolean
      sources:
        description: "Comma list of sources (blank = all: edgar,gdelt,google_news,fed_rss,econ,market,bing_news,yahoo_rss,press_rss,official_rss,gulf_rss,finnhub,marketaux)"
        required: false
        default: ""
        type: string
      symbols:
        description: "Extra symbols, SYM[:Name];SYM2 - PUBLIC: shown in the run log, never type a holding"
        required: false
        default: ""
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: "3.11"
  PYTHONUNBUFFERED: 1
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  due:
    name: 🕒 Is a chained run due this hour?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.due.outputs.run }}
    steps:
      - name: 🕒 Is a chained run due this hour?
        id: due
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHAIN_HOURS: ${{ vars.TFB_NEWS_GATE_CHAIN_HOURS || '6 9 12 13 16 19' }}
        run: |
          # 1.1.0: a run chained to the hourly Exit Plan works only in the listed UTC hours; schedule and dispatch always.
          RUN=true
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            HOUR=$((10#$(date -u +%H)))
            RUN=false
            for h in $CHAIN_HOURS; do
              if [[ "$h" =~ ^[0-9]+$ ]] && (( 10#$h == HOUR )); then RUN=true; fi
            done
            echo "Chained run at UTC hour $HOUR (hours: $CHAIN_HOURS): run=$RUN"
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

  gate:
    # 1.1.1 (Codex P2, PR 1043): the hour gate is its own job, so a chained run that is not
    # due never enters this job's concurrency group and cannot replace a pending run that publishes.
    needs: due
    if: needs.due.outputs.run == 'true'
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    name: 📰 Collect, grade and record the news & macro verdict
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v6

      - name: 🐍 Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "google-auth==2.49.2" "requests==2.33.1"

      - name: 📰 Run the gate
        env:
          PYTHONPATH: ${{ github.workspace }}
          DEFAULT_SPREADSHEET_ID: ${{ vars.DEFAULT_SPREADSHEET_ID }}
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS != '' && secrets.GOOGLE_SHEETS_CREDENTIALS || secrets.GOOGLE_SHEETS_CREDENTIALS_B64 }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}   # 1.1.3: news_macro_gate 1.6.0 [FINNHUB]
          MARKETAUX_API_KEY: ${{ secrets.MARKETAUX_API_KEY }}   # 1.1.4: news_macro_gate 1.7.0 [MARKETAUX]
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # 1.1.5: news_macro_gate 1.8.0 [LLM-SHADOW]
          TFB_NEWS_LLM: ${{ vars.TFB_NEWS_LLM || 'on' }}
          TFB_NEWS_LLM_MODEL: ${{ vars.TFB_NEWS_LLM_MODEL || '' }}
          TFB_NEWS_GATE_LOG_DETAIL: ${{ vars.TFB_NEWS_GATE_LOG_DETAIL || 'auto' }}   # 1.1.6: news_macro_gate 1.8.1 [PUBLIC-LOG]
          TFB_SEC_USER_AGENT: ${{ secrets.TFB_SEC_USER_AGENT || vars.TFB_SEC_USER_AGENT }}
          TFB_NEWS_GATE: ${{ vars.TFB_NEWS_GATE || 'observe' }}
          TFB_NEWS_GATE_SOURCES: ${{ github.event.inputs.sources || vars.TFB_NEWS_GATE_SOURCES || '' }}
          TFB_NEWS_GATE_SYMBOLS: ${{ github.event.inputs.symbols || secrets.TFB_NEWS_GATE_SYMBOLS || '' }}   # 1.1.7: a secret is masked, a Variable is printed
          TFB_NEWS_GATE_EVIDENCE_DIR: news-gate-evidence
          TFB_NEWS_ISSUER_LINK: ${{ vars.TFB_NEWS_ISSUER_LINK || 'on' }}   # 1.0.1: news_macro_gate 1.1.0 [ISSUER-LINK]; on | observe | off
        run: |
          # Schedule always writes; a manual dispatch writes ONLY when
          # write=true was explicitly ticked (dry run otherwise).
          MODE="--write"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.write }}" != "true" ]]; then
            MODE="--dry-run"
            echo "Dry-run mode - collecting and grading, writing nothing (tick write=true to record)."
          fi
          python scripts/news_macro_gate.py $MODE

      - name: 📎 Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: news-gate-${{ github.run_id }}
          path: news-gate-evidence
          if-no-files-found: ignore
          retention-days: 30
