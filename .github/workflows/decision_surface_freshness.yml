name: 🛡️ Decision Surface Freshness

# =============================================================================
# VERSION 1.1.0 (2026-11-02) -- SYNC-RENDER HANDSHAKE (await_cockpit_receipts 1.1.0)
# (first dated entry; the earlier file carried no version header)
# WHY (runs of 1-2 Nov 2026): on workflow_run of the Advanced Sync this
# workflow audits the cockpits at the same moment the sync's final job does,
# BEFORE the asynchronous Apps Script render of Top_10_Investments /
# Portfolio_Decision has consumed that run, and flags T10_OLDER_THAN_SOURCE /
# T10_POOL_RECONCILIATION_UNPROVEN on timing alone; seven to eight minutes
# later both cockpits read 'source readiness VERIFIED (run <id>)'.
# WHAT: ONE gated step, 'Await the native cockpit render (handshake)',
# immediately BEFORE 'Audit decision surfaces', for workflow_run events only:
# scripts/await_cockpit_receipts.py --wait-only --run-id <the triggering
# sync, github.event.workflow_run.id>, the same read-only poll
# release_after_sync.yml uses, until both cockpits carry that receipt or the
# bound ends (vars.TFB_SYNC_AWAIT_RENDER_MIN, default 15, hard cap 20
# minutes). It only DELAYS the audit: '|| true', never fails the job, never
# writes, never dispatches; its JSON joins the evidence artifact and one line
# goes to the step summary. The audit and its findings are byte-identical.
# The job timeout rises 20 -> 45 minutes (the 20-minute cap plus the step's
# own 25-minute backstop); nothing else changes.
# GATE: vars.TFB_SYNC_AWAIT_RENDER (1/true/yes/on), the same Variable as the
# sync's final job. Unset (default): the step is skipped, nothing moves.
# ROLLBACK: unset the variable, or revert this step and the timeout.
# =============================================================================

on:
  pull_request:
    paths:
      - '.github/workflows/decision_surface_freshness.yml'
      - 'config/approved_universe_scope_v1.json'
      - 'scripts/approved_universe_scope.py'
      - 'tests/test_approved_universe_*.py'
      - 'scripts/audit_decision_surface_freshness.py'
      - 'scripts/audit_full_refresh_coverage.py'
      - 'scripts/workflow_audit_support.py'
      - 'tests/test_workflow_audit_repairs.py'
      - 'tests/test_decision_surface_freshness.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/decision_surface_freshness.yml'
      - 'config/approved_universe_scope_v1.json'
      - 'scripts/approved_universe_scope.py'
      - 'tests/test_approved_universe_*.py'
      - 'scripts/audit_decision_surface_freshness.py'
      - 'scripts/audit_full_refresh_coverage.py'
      - 'scripts/workflow_audit_support.py'
      - 'tests/test_workflow_audit_repairs.py'
      - 'tests/test_decision_surface_freshness.py'
  workflow_run:
    workflows: ["🏦 Tadawul Dashboard Advanced Sync"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: decision-surface-${{ github.event.workflow_run.id || github.run_id }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  regression-tests:
    name: Test decision-surface freshness gate
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install regression test dependencies
        run: python -m pip install pytest==9.1.1 pyyaml==6.0.3

      - name: Compile and test
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/audit_decision_surface_freshness.py \
            scripts/approved_universe_scope.py \
            tests/test_approved_universe_scope.py \
            tests/test_approved_universe_workflow.py \
            tests/test_decision_surface_freshness.py
          python -m pytest -q \
            tests/test_decision_surface_freshness.py \
            tests/test_approved_universe_scope.py \
            tests/test_approved_universe_workflow.py

  audit-live-surfaces:
    name: Block stale or mixed-snapshot decisions
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.head_branch == 'main' &&
          (
            github.event.workflow_run.event == 'schedule' ||
            github.event.workflow_run.event == 'workflow_dispatch'
          )
        )
      }}
    runs-on: ubuntu-24.04
    # v1.1.0: 20 -> 45, room for the gated handshake wait (cap 20 min) and
    # its 25-minute step backstop before the unchanged audit.
    timeout-minutes: 45
    environment: production
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ${{ github.workspace }}
      TZ: Asia/Riyadh
      TARGET_SHEET_ID: ${{ vars.DEFAULT_SPREADSHEET_ID }}
      TFB_DECISION_SURFACE_MAX_AGE_H: '8'
      TFB_DECISION_SOURCE_MAX_AGE_H: '30'
      # (2026-10-12) Owner-approved current roster scope: 255 Saudi-only
      # leaders / 2,474 funds; July's mixed roster is not restored. The
      # versioned scope is authoritative, including membership fingerprints,
      # even if legacy repository floor variables still contain July values.
      # GM 6,512 / CFX 453, freshness, names, prices and custody stay intact.
      TFB_EXPECTED_MIN_ROWS_MARKET_LEADERS: ${{ vars.EXPECTED_MIN_ROWS_MARKET_LEADERS || '255' }}
      TFB_EXPECTED_MIN_ROWS_GLOBAL_MARKETS: ${{ vars.EXPECTED_MIN_ROWS_GLOBAL_MARKETS || '6512' }}
      TFB_EXPECTED_MIN_ROWS_COMMODITIES_FX: ${{ vars.EXPECTED_MIN_ROWS_COMMODITIES_FX || '453' }}
      TFB_EXPECTED_MIN_ROWS_MUTUAL_FUNDS: ${{ vars.EXPECTED_MIN_ROWS_MUTUAL_FUNDS || '2474' }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.render.txt
            requirements.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          if [[ -f requirements.render.txt ]]; then
            python -m pip install -r requirements.render.txt
          elif [[ -f requirements.txt ]]; then
            python -m pip install -r requirements.txt
          else
            echo '::error::No requirements file found.'
            exit 1
          fi

      - name: Configure read-only credentials
        env:
          SECRET_CREDS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          SECRET_CREDS_B64: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "${TARGET_SHEET_ID:-}" ]]; then
            echo '::error::vars.DEFAULT_SPREADSHEET_ID is empty.'
            exit 1
          fi
          RAW_CREDS="${SECRET_CREDS:-}"
          if [[ -z "$RAW_CREDS" && -n "${SECRET_CREDS_B64:-}" ]]; then
            RAW_CREDS="$(printf '%s' "$SECRET_CREDS_B64" | base64 --decode 2>/dev/null || true)"
          fi
          if [[ -z "$RAW_CREDS" ]] || ! printf '%s' "$RAW_CREDS" | jq empty >/dev/null 2>&1; then
            echo '::error::No valid Google Sheets credentials found.'
            exit 1
          fi
          CREDS_PATH="$RUNNER_TEMP/google_credentials.json"
          printf '%s' "$RAW_CREDS" > "$CREDS_PATH"
          chmod 600 "$CREDS_PATH"
          SA_EMAIL="$(jq -r '.client_email // empty' "$CREDS_PATH")"
          [[ -n "$SA_EMAIL" ]] && echo "::add-mask::$SA_EMAIL"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CREDS_PATH" >> "$GITHUB_ENV"

      # (2026-11-02) v1.1.0 SYNC-RENDER HANDSHAKE (await_cockpit_receipts 1.1.0
      # --wait-only). WHY: on workflow_run this job audits the cockpits BEFORE
      # the asynchronous Apps Script render has consumed the triggering sync
      # and flags T10_OLDER_THAN_SOURCE / T10_POOL_RECONCILIATION_UNPROVEN on
      # timing alone. WHAT: this step only DELAYS the unchanged audit below:
      # the same read-only poll as release_after_sync.yml, until both
      # cockpits carry 'source readiness VERIFIED (run <triggering sync>)' or
      # the bound ends (vars.TFB_SYNC_AWAIT_RENDER_MIN, default 15, hard cap
      # 20 minutes). It never fails this job ('|| true'; the script exits 2
      # only on a configuration error and never raises), never writes the
      # workbook, never dispatches, and uses the read-only credentials
      # configured above. workflow_run events only: a manual dispatch has no
      # triggering sync to wait for. GATE: vars.TFB_SYNC_AWAIT_RENDER
      # (1/true/yes/on); unset or any other value skips the step and the job
      # runs exactly as before. The audit below keeps every finding as is.
      - name: Await the native cockpit render (handshake)
        if: ${{ github.event_name == 'workflow_run' && contains(fromJSON('["1","true","yes","on"]'), vars.TFB_SYNC_AWAIT_RENDER) }}
        timeout-minutes: 25
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          TFB_SYNC_AWAIT_RENDER_MIN: ${{ vars.TFB_SYNC_AWAIT_RENDER_MIN || '15' }}
        run: |
          set -euo pipefail
          rm -f await_render.json
          python scripts/await_cockpit_receipts.py --wait-only \
            --run-id "$SOURCE_RUN_ID" \
            --sheet-id "$TARGET_SHEET_ID" \
            --max-minutes "$TFB_SYNC_AWAIT_RENDER_MIN" \
            --json-out await_render.json || true
          python - <<'PY' || true
          import json, os
          from pathlib import Path
          path = Path('await_render.json')
          line = 'Await render (handshake): no report was written; the audit ran without a wait.'
          if path.exists():
              result = json.loads(path.read_text())
              seen = result.get('consumed_at_s') or {}
              def at(name):
                  return 'none' if seen.get(name) is None else 'at %s s' % seen[name]
              line = ('Await render (handshake): %s after %s s, %s polls; receipts for run %s: '
                      'Portfolio_Decision %s, Top_10_Investments %s.' % (
                          result.get('outcome'), result.get('waited_s'), result.get('polls'),
                          result.get('run_id'), at('pf'), at('t10')))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as handle:
              handle.write(line + '\n\n')
          print(line)
          PY

      - name: Audit decision surfaces
        id: audit
        run: |
          set -euo pipefail
          code=0
          python scripts/audit_decision_surface_freshness.py \
            --sheet-id "$TARGET_SHEET_ID" \
            --json-out decision_surface_freshness.json || code=$?
          echo "audit_exit=$code" >> "$GITHUB_OUTPUT"
          if [[ "$code" -ne 0 ]]; then
            echo "::error::Decision surfaces are not executable (exit $code)."
            exit "$code"
          fi

      - name: Publish decision-surface summary
        if: always()
        run: |
          if [[ ! -f decision_surface_freshness.json ]]; then
            echo '# Decision Surface Freshness' >> "$GITHUB_STEP_SUMMARY"
            echo 'Audit report was not produced.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo '# 🛡️ Decision Surface Freshness'
            echo
            echo "Executable: **$(jq -r '.executable' decision_surface_freshness.json)** · Exit: **${{ steps.audit.outputs.audit_exit || 'n/a' }}**"
            echo
            echo "Portfolio run: $(jq -r '.portfolio_run_riyadh // "unknown"' decision_surface_freshness.json)"
            echo
            echo "My_Portfolio source: $(jq -r '.my_portfolio_updated_riyadh // "unknown"' decision_surface_freshness.json)"
            echo
            echo "Top-10 run: $(jq -r '.top10_run_riyadh // "unknown"' decision_surface_freshness.json)"
            echo
            echo '| Severity | Surface | Code | Finding |'
            echo '|---|---|---|---|'
            jq -r '.findings[] | "| \(.severity) | \(.surface) | \(.code) | \(.message | gsub("\\|"; "\\\\|")) |"' decision_surface_freshness.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload decision-surface evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: decision-surface-freshness-${{ github.event.workflow_run.id || github.run_id }}
          path: |
            decision_surface_freshness.json
            await_render.json
          retention-days: 30
          if-no-files-found: warn

      - name: Secure cleanup
        if: always()
        run: |
          CREDS_PATH="${GOOGLE_APPLICATION_CREDENTIALS:-$RUNNER_TEMP/google_credentials.json}"
          if [[ -f "$CREDS_PATH" ]]; then
            shred -u -z "$CREDS_PATH" 2>/dev/null || rm -f "$CREDS_PATH"
          fi
